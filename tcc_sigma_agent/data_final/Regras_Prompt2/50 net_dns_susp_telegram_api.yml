title: DNS Query to Telegram Bot API Endpoint
id: a7b8c9d0-e1f2-43a4-85b6-7c8d9e0f1a2b
status: experimental
description: Detects DNS queries to the Telegram Bot API endpoint (api.telegram.org), a technique abused by malware families such as TeleRAT, TeleCrypt, and KillDisk for covert C2 communication.
references:
    - https://core.telegram.org/bots/faq
    - https://researchcenter.paloaltonetworks.com/2018/03/unit42-telerat-another-android-trojan-leveraging-telegrams-bot-api-to-target-iranian-users/
    - https://blog.malwarebytes.com/threat-analysis/2016/11/telecrypt-the-ransomware-abusing-telegram-api-defeated/
    - https://www.welivesecurity.com/2016/12/13/rise-telebots-analyzing-disruptive-killdisk-attacks/
author: Senior Threat Detection Engineer
date: 2026-06-08
logsource:
    category: dns
detection:
    selection:
        query: 'api.telegram.org'
    condition: selection
falsepositives:
    - Legitimate applications or users using Telegram Bot API for automation
level: medium
tags:
    - attack.command_and_control
    - attack.t1071
    - attack.t1071.001
