title: Kubernetes Secret Modification or Deletion
id: d5e6f7a8-9b0c-1d2e-3f4a-5b6c7d8e9f0a
status: experimental
description: Detects creation, modification, or deletion of Kubernetes Secrets, which may indicate an attacker stealing credentials, planting malicious values, or covering tracks.
references:
    - https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/
    - https://commandk.dev/blog/guide-to-audit-k8s-secrets-for-compliance/
author: Senior Threat Detection Engineer
date: 2026-06-03
logsource:
    product: kubernetes
    service: audit
detection:
    selection:
        objectRef.resource: 'secrets'
        verb:
            - 'create'
            - 'update'
            - 'patch'
            - 'delete'
            - 'deletecollection'
    condition: selection
falsepositives:
    - Legitimate secret rotation by administrators or automated systems.
    - CI/CD pipelines managing secrets.
level: medium
tags:
    - attack.credential_access
    - attack.defense_evasion
    - attack.t1552.007
    - attack.t1485
