title: Potential MeshAgent Execution on macOS
id: e6f7a8b9-c0d1-2345-efab-345678901234
status: experimental
description: Detects potential MeshAgent execution on macOS by matching characteristic command-line arguments that persist even when the binary is renamed. MeshAgent is a remote access tool abused by threat actors including Medusa ransomware operators to maintain persistent remote access.
references:
    - https://www.huntress.com/blog/know-thy-enemy-a-novel-november-case-on-persistent-remote-access
    - https://thecyberexpress.com/ukraine-hit-by-meshagent-malware-campaign/
    - https://wazuh.com/blog/how-to-detect-meshagent-with-wazuh/
    - https://www.security.com/threat-intelligence/medusa-ransomware-attacks
author: Senior Threat Detection Engineer
date: 2024-01-01
tags:
    - attack.command_and_control
    - attack.persistence
    - attack.t1219
    - attack.t1543
logsource:
    product: macos
    category: process_creation
detection:
    selection:
        CommandLine|contains:
            - '-meshServiceName'
            - 'meshagent'
            - '-recover'
            - 'MeshAgent'
    condition: selection
falsepositives:
    - Legitimate use of MeshCentral or MeshAgent by IT administrators for authorized remote management
level: high
