title: PsExec Default Named Pipe Created
id: c4d5e6f7-a8b9-0123-cdef-123456789012
status: stable
description: Detects creation of the default PsExec named pipe on a Windows host, indicating PsExec service execution. PsExec is commonly used for lateral movement or remote command execution by both administrators and attackers.
references:
    - https://www.jpcert.or.jp/english/pub/sr/ir_research.html
    - https://jpcertcc.github.io/ToolAnalysisResultSheet
author: Senior Threat Detection Engineer
date: 2024-01-01
tags:
    - attack.lateral_movement
    - attack.execution
    - attack.t1570
    - attack.t1021.002
    - attack.t1569.002
logsource:
    product: windows
    category: pipe_created
    definition: 'Requires Sysmon named pipe event logging to be configured. Event ID 17 (Pipe Created) and Event ID 18 (Pipe Connected) must be enabled in the Sysmon configuration to generate the necessary telemetry.'
detection:
    selection:
        PipeName: '\PSEXESVC'
    condition: selection
falsepositives:
    - Legitimate administrative use of PsExec by system administrators for remote management tasks
level: medium
