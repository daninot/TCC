title: Suspicious Spring Security Exception in Application Log
id: 3e7b1d4a-8f2c-4a9e-b5d7-6c1f3a8e2b4d
status: experimental
description: |
    Detects suspicious Spring Security exception class names appearing in
    application logs, which may indicate exploitation attempts including
    unauthorized access, CSRF token abuse, cookie tampering, and malformed
    request injection.
references:
    - https://docs.spring.io/spring-security/site/docs/current/api/overview-tree.html
author: Senior Threat Detection Engineer
date: 2024-03-01
tags:
    - attack.initial-access
    - attack.t1190
    - attack.credential-access
    - attack.t1539
logsource:
    category: application
    product: spring
detection:
    keywords:
        - 'AccessDeniedException'
        - 'AuthenticationCredentialsNotFoundException'
        - 'AuthenticationServiceException'
        - 'BadCredentialsException'
        - 'CookieTheftException'
        - 'CsrfException'
        - 'InvalidCsrfTokenException'
        - 'MissingCsrfTokenException'
        - 'InvalidCookieException'
        - 'MalformedParameterException'
        - 'PreAuthenticatedCredentialsNotFoundException'
        - 'RememberMeAuthenticationException'
        - 'SessionAuthenticationException'
        - 'UsernameNotFoundException'
    condition: keywords
falsepositives:
    - Legitimate application errors during normal authentication flows
    - Penetration testing and security scanning activity
    - Misconfigured clients causing repeated authentication failures
level: medium
