title: Detecting Kerberoasting Activity
id: d75d6ff2-9148-47d0-8293-6b4c5f145f3d
description: Detects suspicious Kerberos TGS requests with RC4 encryption.
references:
  - https://adsecurity.org/?p=3458
  - https://learn.microsoft.com/en-us/troubleshoot/windows-client/security/detect-and-remediate-rc4-usage-in-kerberos
  - https://attack.mitre.org/techniques/T1558/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: '0x17'
  condition: selection
falsepositives:
  - Legacy systems or applications that legitimately use RC4 encryption
level: medium