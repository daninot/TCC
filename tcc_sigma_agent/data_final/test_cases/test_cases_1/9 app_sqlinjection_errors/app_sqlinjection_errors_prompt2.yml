title: Error-Based SQL Injection Detection
id: 12345678-1234-5678-9012-345678901234
status: test
description: Detects error-based SQL injection attacks by looking for specific SQL commands or syntax errors in process creation logs.
references:
    - http://www.sqlinjection.net/errors
author: [Your Name]
date: 2023-02-20
tags:
    - attack.t1005
logsource:
    category: process_creation
    product: windows
detection:
    selection_sqlcmd:
        Image|endswith: '\sqlcmd.exe'
    selection_syntax_errors:
        CommandLine|contains|all:
            - 'The used SELECT statements have a different number of columns'
            - 'XPATH syntax error:'
            - 'You have an error in your SQL syntax;'
    condition: all of selection_*
falsepositives:
    - Unknown
level: medium