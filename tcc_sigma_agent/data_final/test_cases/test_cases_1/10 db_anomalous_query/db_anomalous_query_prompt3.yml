title: Potentially Suspicious SQL Queries and Data Exfiltration
id: bb8c8c17-4e03-491c-bc48-27fdf077b666
status: test
description: Detects potentially suspicious usage of sqlcmd.exe, focusing on command patterns that may indicate data exfiltration, reconnaissance, or malicious database operations.
references:
  - https://github.com/sqlmapproject/sqlmap
  - https://en.wikipedia.org/wiki/SQL_injection
  - https://www.paloaltonetworks.com/resources/article/what-is-an-sql-injection/
logsource:
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\sqlcmd.exe'
  selection_cli:
    CommandLine|contains:
      - '-Xe'
      - '--flag'
      - 'SELECT SLEEP(RAND() * 3);'
      - 'SELECT '
      - 'FROM '
      - 'WHERE '
      - 'GROUP BY '
      - 'HAVING '
      - 'ORDER BY '
      - 'LIMIT '
      - 'OFFSET '
      - 'UNION SELECT '
      - 'INSERT INTO '
      - 'UPDATE '
      - 'DELETE FROM '
  condition: all of selection_*
falsepositives:
  - Unknown
level: high