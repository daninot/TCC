LOGSOURCE: The indicator would appear in the Windows Event Logs or Active Directory (AD) logs, so I choose category "registry_event" as it is related to AD.

FIELDS: The fields that contain the indicators of the threat are "Operation", "Event ID", and possibly "TargetFilename".

MODIFIERS: For each field, |contains seems to be the correct choice. However, for "TargetFilename", we should use |endswith to match the file extension or terminal tokens.

ATT&CK: The technique that best describes this threat is T1484.001 - Group Policy Modification.


