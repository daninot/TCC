title: Potential Vice Society Ransomware Activity
id: 97743b0e-beb8-4b83-8ddb-809a6270c3c0
status: test
description: Detects a specific command used by the Vice Society ransomware group
references:
  - https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170
author: frack113
date: 2021-10-12
modified: 2023-02-13
tags:
  - attack.t1562
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\bcdedit.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\netsh.exe'
      - '\wevtutil.exe'
      - '\vssadmin.exe'
    CommandLine|contains|all:
      - '-m '
      - '-net '
      - '-size ' # Size 10 in references
      - '-nomutex '
      - '-p \\\\'
      - '$'
  condition: selection
falsepositives:
  - Unlikely
level: critical