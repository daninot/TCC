title: Duo MFA Bypass or Weakening Action Performed Programmatically via Admin API
id: c29f4b71-8e3a-4d16-bf92-7a5d0c1e38f4
status: experimental
description: |
    Detects high-impact Duo administrator log actions that weaken or completely
    bypass MFA for one or more users, where the acting principal is "API" —
    meaning the action was performed programmatically via the Duo Admin API
    rather than by a human administrator in the Duo Admin Panel.

    LOG SOURCE CONTEXT (duo.com/docs/adminapi#logs):
    The Duo Admin API returns three log streams. The administrator log
    (GET /admin/v2/logs/administrator) records every create, update, and delete
    action taken against Duo objects. Each record contains:
      - username:  The full name of the admin who acted, OR the literal string
                   "API" if the action was performed by an API application,
                   OR "System" for automatic system actions.
      - action:    A typed string identifying the specific operation performed
                   (e.g. "create_bypass_code", "update_user", "delete_phone").
      - object:    The target object (e.g. the username whose bypass was created).
      - timestamp: Unix timestamp of the event.

    The Duo Admin API documentation explicitly warns:
      "If you restrict the allowed networks for API access and see logged events
       for blocked Admin API requests from unrecognized IP addresses, this may
       indicate compromise of your Admin API application's secret key."

    ATTACK SCENARIO — STOLEN API SECRET KEY:
    An attacker who obtains a Duo Admin API secret key (skey) can silently
    perform privileged operations against any user in the Duo account without
    needing to authenticate to the Admin Panel, complete MFA, or generate
    any human-visible audit trail beyond the administrator log itself.

    The most impactful attacker actions that leave username="API" in the log:

    1. create_bypass_code
       Creates a bypass code for a target user, granting them (or the attacker
       presenting the code) the ability to authenticate without MFA. Bypass codes
       generated via API are not subject to the human workflow constraints of the
       Admin Panel (e.g. admin confirmation dialogs, visible to other admins).

    2. update_user (status → bypass)
       Sets a user's Duo status to "bypass", meaning that user is permanently
       exempt from MFA. The Duo docs note: "Bypass - The user is not required
       to use Duo two-factor authentication at log on and is not subject to any
       policy setting restricting access."

    3. delete_phone / delete_token
       Removes a user's enrolled MFA device or hardware token, rendering the
       account temporarily unauthenticatable and forcing re-enrollment — a
       denial-of-service against MFA, or a precursor to enrolling an
       attacker-controlled device under the target account.

    4. create_admin / update_admin
       Creates a new Duo administrator or elevates an existing one, establishing
       persistence in the identity provider with full Admin Panel access.

    5. update_settings
       Modifies global Duo account settings, potentially disabling security
       policies (e.g. enabling "Allow unenrolled users", disabling remembered
       device restrictions) account-wide.

    DETECTION LOGIC:
    The rule fires when the administrator log records any of these high-impact
    action types with username = "API". Legitimate automated integrations (SCIM
    provisioning connectors, HR system sync scripts, approved ITSM integrations)
    will appear as "API" in the username field for routine user CRUD. The
    specificity comes from the action type: legitimate integrations almost never
    issue create_bypass_code, set user status to bypass, or delete enrolled
    phones. The combination of username="API" and a bypass/MFA-weakening action
    is high-confidence regardless of volume.

references:
    - https://duo.com/docs/adminapi#logs
    - https://duo.com/docs/adminapi#administrator-logs
    - https://help.duo.com/s/article/6327
    - https://duo.com/docs/administration-users#bypass
    - https://duo.com/docs/admin-roles
author: Generated from Duo Admin API log documentation and Duo KB article 6327 (Administrator Log Actions)
date: 2024-01-01
tags:
    - attack.persistence
    - attack.t1098.005   # Account Manipulation: Device Registration (bypass code / device deletion)
    - attack.t1556.006   # Modify Authentication Process: Multi-Factor Authentication
    - attack.defense_evasion
    - attack.t1562.001   # Impair Defenses: Disable or Modify Tools (MFA bypass)
    - attack.credential_access
    - attack.t1078.004   # Valid Accounts: Cloud Accounts (API key abuse)
    - tlp:white
logsource:
    product: duo
    service: administrator
    # Ingest via Duo Admin API GET /admin/v2/logs/administrator, polled
    # on a schedule (recommend every 60-120 seconds). Ship to SIEM via:
    #   - Duo's native Splunk Add-on / Chronicle integration
    #   - A SIEM-provided Duo log source (Panther, Elastic, Microsoft Sentinel
    #     Duo connector, Sumo Logic Duo app)
    #   - A custom poller using the Duo Admin API client libraries
    #     (github.com/duosecurity/duo_client_python et al.)
    #
    # Required API permission on the polling Admin API application:
    #   "Grant read log"
    #
    # Field mapping for this rule:
    #   username  → the 'username' field in each administrator log record
    #   action    → the 'action' field in each administrator log record
    #   object    → the 'object' field (target user/phone/token acted upon)
detection:
    # ── The acting principal is the API, not a human administrator ────────────
    # Per the Duo Admin API docs, username="API" means the action was performed
    # by an API application using HMAC-signed API credentials, not via the
    # Admin Panel by a named human. This is the primary pivot field.
    selection_api_actor:
        username: 'API'

    # ── High-impact MFA bypass and weakening action types ────────────────────
    # These action strings are the documented values from the Duo administrator
    # log (KB 6327 / Admin API #administrator-logs). Each directly reduces or
    # eliminates MFA protection for a user or the entire account.
    selection_bypass_actions:
        action:
            - 'create_bypass_code'       # Issues a bypass code for a specific user
            - 'update_user'              # May include status=bypass — see note below
            - 'delete_phone'             # Removes an enrolled MFA phone
            - 'delete_token'             # Removes an enrolled hardware token
            - 'delete_desktop_authenticator'  # Removes a desktop authenticator

    # ── High-impact identity and configuration actions via API ────────────────
    # These action types establish persistence or weaken policy account-wide.
    selection_persistence_actions:
        action:
            - 'create_admin'             # Creates a new Duo administrator
            - 'update_admin'             # Modifies an existing admin (role escalation)
            - 'delete_admin'             # Removes an admin (sabotage/cover tracks)
            - 'update_settings'          # Changes global Duo account security settings
            - 'create_integration'       # Adds a new Admin API application
            - 'update_integration'       # Modifies an existing API app (permission grant)

    # ── Filter: approved automation actors ────────────────────────────────────
    # Some organisations use Admin API integrations for legitimate automated
    # provisioning (SCIM connectors, HR sync). These will appear as "API".
    # If your approved automation ever issues bypass codes or device deletions,
    # document and baseline them here by object (target username) or time window.
    # By default, no filter is applied — all API-origin high-impact actions alert.
    #
    # Example (uncomment and adapt if needed):
    # filter_approved_scim_provisioning:
    #     action:
    #         - 'create_user'
    #         - 'update_user'
    #         - 'delete_user'
    #     object|startswith: 'svc_'   # service accounts only

    condition: >
        selection_api_actor
        and (selection_bypass_actions or selection_persistence_actions)

falsepositives:
    - An approved Admin API integration that programmatically manages bypass
      codes as part of a documented helpdesk automation workflow (e.g. an ITSM
      tool that creates time-limited bypass codes on approved tickets). Validate
      by cross-referencing the bypass code creation timestamp with a corresponding
      approved ITSM ticket and a known source IP in the API application's network
      allowlist.
    - An automated offboarding script that deletes phones and tokens for departing
      users. These produce delete_phone / delete_token with username="API".
      Distinguish from attacks by verifying a corresponding HR event (user
      termination) within the same time window and confirming the source IP is
      the approved offboarding automation host.
    - A SCIM provisioning connector that sets user status during lifecycle
      management. Confirm the object (target username) matches a currently
      offboarding user and the source IP matches the approved IdP connector.
    # Recommended enrichment: join the administrator log record's source IP
    # against the Admin API application's configured "Networks for API Access"
    # allowlist. Any API action originating from an IP outside that allowlist
    # is unconditionally high-confidence (the Duo docs explicitly flag this as
    # an indicator of API key compromise) and should be escalated immediately
    # regardless of the specific action type.
    #
    # Recommended SIEM correlation: when create_bypass_code or update_user
    # (bypass) fires for a specific object (target username), immediately check
    # the authentication log for subsequent logins by that user using
    # reason="bypass_user" — successful bypass-code authentication within
    # minutes of API-originated bypass code creation is active exploitation.
level: high
