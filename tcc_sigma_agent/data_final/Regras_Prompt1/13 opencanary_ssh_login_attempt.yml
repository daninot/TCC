title: OpenCanary - Honeypot Service Interaction Detected
id: 7e4c2b9f-1d83-4a56-b0e7-5c9f3d8a2e14
status: experimental
description: |
    Detects any interaction with an OpenCanary honeypot service, representing a
    near-zero false-positive alert because honeypots receive no legitimate traffic.

    The rule uses the integer logtype constants defined in opencanary/logger.py
    (class LoggerBase, L52+) to cover three attack lifecycle phases:

    1. Credential Access — login attempts against FTP, SSH (connection + banner
       + login), Telnet, HTTP/S, HTTP proxy, MySQL, MSSQL (SQL and Windows Auth),
       VNC, and SNMP community-string harvesting. Any credential submitted to a
       honeypot is stolen or actively being tested by the attacker.

    2. Lateral Movement — SMB file open (attacker browsing fake Windows share),
       RDP session initiation, and Redis command execution. These services are
       exclusively used by attackers performing east-west movement.

    3. Discovery / Reconnaissance — SYN-based port scans (iptables integration),
       four Nmap scan types (OS, NULL, XMAS, FIN), NTP monlist (CVE-2013-5211
       DDoS amplification probe), TFTP, SIP, Git clone, and TCPbanner probes.

    Log format: JSON written via PyLogger.log() → sanitizeLog() to
    /var/tmp/opencanary.log (default) or syslog (RFC format via syslog_rfc
    formatter: "opencanaryd[PID:TID]: NAME LEVEL MESSAGE").
    Every event contains: node_id, logtype, src_host, src_port, dst_host,
    dst_port, utc_time, local_time_adjusted, logdata (nested service detail).
references:
    - https://opencanary.readthedocs.io/en/latest/starting/configuration.html#services-configuration
    - https://github.com/thinkst/opencanary/blob/a0896adfcaf0328cfd5829fe10d2878c7445138e/opencanary/logger.py#L52
    - https://attack.mitre.org/techniques/T1110/
    - https://attack.mitre.org/techniques/T1021/
    - https://attack.mitre.org/techniques/T1046/
author: Security Team
date: 2026-05-25
tags:
    - attack.credential_access
    - attack.t1110    # Brute Force (login attempts against honeypot services)
    - attack.lateral_movement
    - attack.t1021    # Remote Services (SMB, RDP, Redis access)
    - attack.discovery
    - attack.t1046    # Network Service Discovery (port scans, Nmap)
logsource:
    product: opencanary
    service: honeypot
    definition: |
        Ingest from /var/tmp/opencanary.log (JSON, one event per line).
        Or via syslog with formatter "syslog_rfc" — parse JSON from message body.
        Map logtype as integer field; src_host, dst_port, node_id as strings.
detection:
    selection_credential_access:
        # logtype constants from LoggerBase in logger.py, lines 52–90
        logtype:
            - 2000   # LOG_FTP_LOGIN_ATTEMPT
            - 3000   # LOG_HTTP_GET
            - 3001   # LOG_HTTP_POST_LOGIN_ATTEMPT
            - 4000   # LOG_SSH_NEW_CONNECTION
            - 4001   # LOG_SSH_REMOTE_VERSION_SENT
            - 4002   # LOG_SSH_LOGIN_ATTEMPT
            - 6001   # LOG_TELNET_LOGIN_ATTEMPT
            - 7001   # LOG_HTTPPROXY_LOGIN_ATTEMPT
            - 8001   # LOG_MYSQL_LOGIN_ATTEMPT
            - 9001   # LOG_MSSQL_LOGIN_SQLAUTH
            - 9002   # LOG_MSSQL_LOGIN_WINAUTH
            - 12001  # LOG_VNC
            - 13001  # LOG_SNMP_CMD
    selection_lateral_movement:
        logtype:
            - 5000   # LOG_SMB_FILE_OPEN
            - 14001  # LOG_RDP
            - 17001  # LOG_REDIS_COMMAND
    selection_reconnaissance:
        logtype:
            - 5001   # LOG_PORT_SYN
            - 5002   # LOG_PORT_NMAPOS (Nmap OS detection)
            - 5003   # LOG_PORT_NMAPNULL
            - 5004   # LOG_PORT_NMAPXMAS
            - 5005   # LOG_PORT_NMAPFIN
            - 10001  # LOG_TFTP
            - 11001  # LOG_NTP_MONLIST (CVE-2013-5211 amplification probe)
            - 15001  # LOG_SIP_REQUEST
            - 16001  # LOG_GIT_CLONE_REQUEST
            - 18001  # LOG_TCP_BANNER_CONNECTION_MADE
            - 18005  # LOG_TCP_BANNER_DATA_RECEIVED
    condition: 1 of selection_*
fields:
    - node_id
    - logtype
    - src_host
    - src_port
    - dst_host
    - dst_port
    - logdata
    - utc_time
falsepositives:
    - Misconfigured internal services accidentally connecting to honeypot ports
    - Authorized internal vulnerability scanners not added to ip.ignorelist
    - Network monitoring tools performing periodic port reachability checks
level: high
