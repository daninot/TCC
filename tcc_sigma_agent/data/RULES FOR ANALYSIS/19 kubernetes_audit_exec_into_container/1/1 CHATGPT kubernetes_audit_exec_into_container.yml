title: Kubernetes Exec Into Container via Audit Log
id: 1d3fdc1f-7c4f-4ed4-8d47-9f5d7d4c4f4e
status: experimental
description: Detects Kubernetes audit log activity consistent with exec into a container (kubectl exec), which may indicate interactive command execution inside a pod.
references:
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Exec%20into%20container/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - https://www.elastic.co/guide/en/security/8.19/kubernetes-user-exec-into-pod.html
author: OpenAI
date: 2026-06-03
tags:
  - attack.execution
  - attack.t1609
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    kubernetes.audit.objectRef.resource: pods
    kubernetes.audit.objectRef.subresource: exec
    kubernetes.audit.verb:
      - get
      - create
    kubernetes.audit.stage:
      - ResponseStarted
      - ResponseComplete
    "kubernetes.audit.annotations.authorization_k8s_io/decision": allow
  condition: selection
fields:
  - kubernetes.audit.user.username
  - kubernetes.audit.sourceIPs
  - kubernetes.audit.objectRef.namespace
  - kubernetes.audit.objectRef.name
  - kubernetes.audit.objectRef.resource
  - kubernetes.audit.objectRef.subresource
  - kubernetes.audit.verb
  - kubernetes.audit.requestURI
  - kubernetes.audit.stage
  - kubernetes.audit.annotations.authorization_k8s_io/decision
falsepositives:
  - Legitimate administration with kubectl exec
  - DevOps troubleshooting and maintenance
  - Automation or CI/CD jobs that shell into pods
level: medium
