title: Bitbucket Full Data Export Requested
id: 4af5bc63-7182-4467-8db1-c5df58f2762a
status: stable
description: Detects attempts to trigger a full data export on an Atlassian Bitbucket instance, which could indicate data exfiltration by an insider or compromised administrative account.
references:

* [https://confluence.atlassian.com/bitbucketserver/audit-log-events-776640423.html](https://confluence.atlassian.com/bitbucketserver/audit-log-events-776640423.html)
* [https://confluence.atlassian.com/bitbucketserver/secret-scanning-1157471613.html](https://confluence.atlassian.com/bitbucketserver/secret-scanning-1157471613.html)
author: Senior Threat Detection Engineer
date: 2026/05/25
tags:
* attack.collection
* attack.exfiltration
* attack.t1213
* attack.t1020
logsource:
product: bitbucket
service: audit
detection:
selection:
category: 'Data export'
action: 'Export requested'
condition: selection
falsepositives:
* Authorized maintenance, backup creation, or migration activities by legitimate administrators.
level: high
