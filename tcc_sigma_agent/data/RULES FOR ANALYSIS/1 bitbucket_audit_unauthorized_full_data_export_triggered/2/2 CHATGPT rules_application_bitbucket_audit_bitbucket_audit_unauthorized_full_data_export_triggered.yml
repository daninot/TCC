title: Unauthorized Bitbucket Full Data Export
id: 71fb27c3-4df2-46ae-bc90-6ad38335c2be
status: stable
description: Detects Bitbucket audit log events for an unauthorized full data export attempt, which may indicate data exfiltration or use of compromised administrator credentials.
references:

* [https://confluence.atlassian.com/bitbucketserver/audit-log-events-776640423.html](https://confluence.atlassian.com/bitbucketserver/audit-log-events-776640423.html)
* [https://confluence.atlassian.com/bitbucketserver/secret-scanning-1157471613.html](https://confluence.atlassian.com/bitbucketserver/secret-scanning-1157471613.html)
  author: OpenAI
  date: 2026/05/25
  tags:
* attack.collection
* attack.exfiltration
* attack.t1213
  logsource:
  product: bitbucket
  service: audit
  detection:
  selection:
  auditType.action: "Unauthorized full data export triggered"
  condition: selection
  falsepositives:
* Legitimate administrative or support activity in test environments.
* Security validation or permission testing by authorized staff.
  level: critical

