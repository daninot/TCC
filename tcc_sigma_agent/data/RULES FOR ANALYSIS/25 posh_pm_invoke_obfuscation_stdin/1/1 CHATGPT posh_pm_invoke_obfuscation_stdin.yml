title: Invoke-Obfuscation Obfuscated IEX Invocation
id: 4bf943c6-5146-4273-98dd-e958fd1e3abf
status: experimental
description: Detects obfuscated PowerShell IEX invocation patterns commonly generated by the Invoke-Obfuscation framework.
references:
  - https://github.com/SigmaHQ/sigma/issues/1009
author: OpenAI
date: 2026-06-04
tags:
  - attack.defense_evasion
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|re:
      - '\$pshome\[\s*\d{1,3}\s*\]\s*\+\s*\$pshome\['
      - '\$shellid\[\s*\d{1,3}\s*\]\s*\+\s*\$shellid\['
      - '\$env:public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:public\['
      - '\$env:comspec\[(\s*\d{1,3}\s*,){2}'
      - '\*mdr\*\W\s*\)\.name'
      - '\$verbosepreference\.tostring\('
      - '\string\]\s*\$verbosepreference'
      - '.*cmd.*\/c.*\^\|.*powershell.*&&.*cmd.*\/c'
  condition: selection
fields:
  - Image
  - ParentImage
  - CommandLine
  - User
  - Computer
falsepositives:
  - Security testing and red team exercises
  - Legitimate PowerShell scripts that use uncommon string construction
level: high
