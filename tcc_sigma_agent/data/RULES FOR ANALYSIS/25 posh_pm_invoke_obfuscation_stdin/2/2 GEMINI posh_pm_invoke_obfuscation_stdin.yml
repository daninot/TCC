title: PowerShell STDIN+ Launcher Obfuscation
id: a2b5c4d6-ef7a-4921-b843-f112de9402ab
status: stable
description: Detects obfuscated PowerShell execution using the Invoke-Obfuscation STDIN+ launcher technique. In this technique, cmd.exe is used to pipe input into PowerShell via stdin, evading command-line and script-based detections by avoiding direct PowerShell command arguments.
references:

* [https://github.com/SigmaHQ/sigma/issues/1009](https://github.com/SigmaHQ/sigma/issues/1009)
author: Senior Threat Detection Engineer
date: 2026/06/04
tags:
* attack.defense_evasion
* attack.execution
* attack.t1027
* attack.t1059.001
logsource:
product: windows
category: ps_module
detection:
selection:
ContextInfo|re: '(?i)cmd(?:.exe)?\s+/[cr].*powershell.*(?:-noi|-noexit|$input)'
condition: selection
falsepositives:
* Complex administrative automation scripts or legacy developer build tools that explicitly wrap PowerShell invocations via cmd.exe stdin redirection.
level: high
