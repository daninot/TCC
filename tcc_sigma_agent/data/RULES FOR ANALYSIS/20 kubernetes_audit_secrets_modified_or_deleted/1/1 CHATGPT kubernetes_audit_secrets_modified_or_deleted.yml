title: Kubernetes Secret Read Access in Audit Logs
id: 4b72eab7-4d21-4a6f-9d58-2a2f7f7b7c31
status: experimental
description: Detects Kubernetes API server audit events indicating read access to Secrets resources via get, list, or watch operations.
references:
  - https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/
  - https://commandk.dev/blog/guide-to-audit-k8s-secrets-for-compliance/
author: OpenAI
date: 2026-06-03
tags:
  - attack.credential_access
  - attack.t1552
logsource:
  product: kubernetes
  service: audit
detection:
  selection_resource:
    objectRef.resource: secrets
  selection_verb:
    verb:
      - get
      - list
      - watch
  selection_requesturi:
    requestURI|contains:
      - '/secrets'
      - '/api/v1/secrets'
  condition: selection_resource and selection_verb and 1 of selection_requesturi
fields:
  - user.username
  - impersonatedUser.username
  - verb
  - requestURI
  - objectRef.namespace
  - objectRef.name
  - objectRef.resource
  - objectRef.subresource
  - sourceIPs
  - stage
falsepositives:
  - Authorized administration and troubleshooting
  - Controllers or operators that legitimately enumerate secrets
  - Backup, compliance, or inventory tooling
level: medium
