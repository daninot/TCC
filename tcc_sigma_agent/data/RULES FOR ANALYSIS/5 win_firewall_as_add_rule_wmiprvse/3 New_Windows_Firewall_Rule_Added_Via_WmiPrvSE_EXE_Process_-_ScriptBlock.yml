title: New Windows Firewall Rule Added Via WmiPrvSE.EXE Process - ScriptBlock
id: 8e9bcaa9-832f-4fa2-9a50-89973f9ca22b
status: test
description: Detects when a powershell script contains calls to the "New-NetFirewallRule" cmdlet in order to add a new firewall rule with an "Allow" action via WmiPrvSE.EXE process.
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md#atomic-test-24---set-a-firewall-rule-using-new-netfirewallrule
  - https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170
  - https://cybersecuritynews.com/rhysida-ransomware-attacking-windows/
author: frack113
date: 2024-05-10
tags:
  - attack.defense-impairment
  - attack.t1686.003
logsource:
  product: windows
  service: firewall-as
detection:
  selection:
    EventID:
      - 2005 # A rule has been modified in the Windows Defender Firewall exception list (Windows 10)
      - 2073 # A rule has been modified in the Windows Defender Firewall exception list. (Windows 11)
    Action: 1 # Allow
    ModifyingApplication: WmiPrvSE.EXE
    ApplicationPath|endswith: '\System32\WmiPrvSE.exe'
  condition: selection
falsepositives:
  - Administrator script
level: low