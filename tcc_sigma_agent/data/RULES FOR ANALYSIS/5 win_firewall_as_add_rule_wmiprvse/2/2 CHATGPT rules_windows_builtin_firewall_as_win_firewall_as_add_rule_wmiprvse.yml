title: Windows Firewall Allow Rule Added Via WMI Provider Host
id: 2b0d2c48-8d62-48cf-a8df-5bb3f2d7f14a
status: stable
description: Detects a new Windows Firewall exception rule configured with the Allow action where the modification was performed by the WMI Provider Host process (WmiPrvSE.EXE). Adversaries and ransomware operators may abuse PowerShell firewall cmdlets or WMI CIM classes to create inbound firewall exceptions under the WmiPrvSE.EXE security context for lateral movement, command and control, or data exfiltration.
references:

* [https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md#atomic-test-24---set-a-firewall-rule-using-new-netfirewallrule](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md#atomic-test-24---set-a-firewall-rule-using-new-netfirewallrule)
* [https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170](https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170)
* [https://cybersecuritynews.com/rhysida-ransomware-attacking-windows/](https://cybersecuritynews.com/rhysida-ransomware-attacking-windows/)
  author: OpenAI
  date: 2026/05/25
  tags:
* attack.defense-evasion
* attack.lateral-movement
* attack.persistence
* attack.t1562.004
  logsource:
  product: windows
  service: security
  detection:
  selection_event:
  EventID:

  * 4946
  * 4947
    selection_action:
    Action: 'Allow'
    selection_process:
    Application|endswith: '\Windows\System32\wbem\WmiPrvSE.exe'
    condition: selection_event and selection_action and selection_process
    falsepositives:
* Legitimate administrator automation using PowerShell New-NetFirewallRule cmdlets.
* Enterprise configuration management and orchestration tooling using WMI or CIM.
* Authorized remote administration and endpoint management workflows.
  level: medium

