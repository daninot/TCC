Generate a SIGMA rule to detect Django web framework security exceptions in
application logs — indicators of exploitation attempts such as path traversal,
session tampering, redirect abuse, or oversized request payloads.

Target product: django; log source category: application.

Detection uses keyword matching against logged exception class names. Include
both the parent exception class and its security-relevant subclasses, as well
as the PermissionDenied exception.

References to include:
- https://docs.djangoproject.com/en/1.11/ref/exceptions/
- https://docs.djangoproject.com/en/1.11/topics/logging/#django-security