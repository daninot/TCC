title: Exchange PowerShell Cmdlet History Log Deletion
id: 5b4d78b2-5f40-41bf-a3be-60e03e56f4d5
status: experimental
description: Detects the deletion of Exchange PowerShell cmdlet history log files, which may indicate an attempt to evade detection and destroy forensic evidence of malicious administrative actions.
references:
- [https://m365internals.com/2022/10/07/hunting-in-on-premises-exchange-server-logs/](https://m365internals.com/2022/10/07/hunting-in-on-premises-exchange-server-logs/)
author: Senior Threat Detection Engineer
date: 2026/06/02
tags:
- attack.defense_evasion
- attack.t1070.004
logsource:
product: windows
category: file_delete
detection:
selection:
TargetFilename|startswith: 'C:\Program Files\Microsoft\Exchange Server'
TargetFilename|contains: '\CmdletInfra\PowerShell'
condition: selection
falsepositives:
- Exchange native log maintenance or automated log rotation scripts.
level: high
