title: Suspicious Group Policy Registry Modification Via Command or PowerShell
id: c8f6c3e7-5d9a-4c62-9c13-6f0c9a1f4e2d
status: experimental
description: >
  Detects modifications to Group Policy-related registry settings using
  reg.exe or PowerShell. Adversaries may alter Group Policy refresh intervals
  or SmartScreen protections to impair defenses, delay policy enforcement,
  or facilitate persistence and lateral movement.
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1484.001/T1484.001.md
  - https://attack.mitre.org/techniques/T1484/001/
author: OpenAI
date: 2026-05-26
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1484.001
  - attack.t1112
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    Image|endswith:
      - '\reg.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_registry_path:
    CommandLine|contains: 'SOFTWARE\Policies\Microsoft\Windows\System'
  selection_registry_values:
    CommandLine|contains:
      - 'GroupPolicyRefreshTime'
      - 'GroupPolicyRefreshTimeOffset'
      - 'GroupPolicyRefreshTimeDC'
      - 'GroupPolicyRefreshTimeOffsetDC'
      - 'EnableSmartScreen'
      - 'ShellSmartScreenLevel'
  condition: all of selection_*
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
  - Computer
falsepositives:
  - Legitimate administrator Group Policy tuning
  - Enterprise hardening or policy deployment scripts
  - Authorized security configuration management tools
level: high
