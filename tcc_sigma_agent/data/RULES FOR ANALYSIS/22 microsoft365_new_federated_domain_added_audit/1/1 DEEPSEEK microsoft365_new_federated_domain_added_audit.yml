title: O365 New Federated Domain Added
id: 58f88172-a73d-442b-94c9-95eaed3cbb36
status: test
description: Detects the addition of a new federated domain in an Office 365 environment, which may indicate a backdoor attempt or unauthorized configuration change.
references:
  - https://research.splunk.com/cloud/e155876a-6048-11eb-ae93-0242ac130002/
  - https://o365blog.com/post/aadbackdoor/
author: Splunk Threat Research Team (original rule), Harjot Singh @cyb3rjy0t (sigma rule)
date: 2023-09-18
tags:
  - attack.persistence
  - attack.t1136.003
  - attack.t1484.002
logsource:
  product: m365
  service: audit
detection:
  selection:
    Workload: Exchange
    Operation: Add-FederatedDomain
  condition: selection
falsepositives:
  - Legitimate administrative changes performed by authorized personnel.
  - Rarely occurring, but should be investigated.
level: high
