title: M365 Federated Domain Added
id: 5b4d7c1e-913a-4ef4-9e12-c2cb4e3db899
status: stable
description: Detects the addition or creation of a federated domain within a Microsoft 365 tenant. Adversaries can abuse domain federation to establish persistent backdoor access via forged SAML tokens, bypassing MFA and password controls.
references:

* [https://research.splunk.com/cloud/e155876a-6048-11eb-ae93-0242ac130002/](https://research.splunk.com/cloud/e155876a-6048-11eb-ae93-0242ac130002/)
* [https://o365blog.com/post/aadbackdoor/](https://o365blog.com/post/aadbackdoor/)
author: Senior Threat Detection Engineer
date: 2026/06/04
tags:
* attack.persistence
* attack.t1484.002
logsource:
product: m365
service: audit
detection:
selection_domain:
Operation|contains: 'domain'
selection_action:
Operation|contains:
* 'add'
* 'create'
condition: all of selection_*
falsepositives:


* Legitimate administrative actions involving the addition or federation of a new organizational domain.
level: high
