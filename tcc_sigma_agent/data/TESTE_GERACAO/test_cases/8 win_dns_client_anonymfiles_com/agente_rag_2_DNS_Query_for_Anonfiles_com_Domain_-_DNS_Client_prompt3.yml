title: DNS Query for Anonfiles.com Domain - DNS Client
id: f98b966c-ef83-49f4-b7ad-3e5ab9c474fa
status: test
description: Detects DNS queries for anonfiles.com, which is an anonymous file upload platform often used for malicious purposes.
references:
  - https://www.trendmicro.com/vinfo/us/security/news/ransomware-spotlight/ransomware-spotlight-blackbyte
author: Your Name
date: 2024-09-06
tags:
  - attack.exfiltration
  - detection.emerging-threats
logsource:
  product: windows
  service: dns-client
definition: 'Requirements: Microsoft-Windows-DNS Client Events/Operational Event Log must be enabled/collected in order to receive the events.'
detection:
  selection:
    QueryName|contains: '.anonfiles.com'
  condition: selection
falsepositives:
  - Legitimate DNS queries and usage of anonfiles.com
level: medium