title: OpenCanary SSH Login Attempt
id: 0c1e2d3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
status: experimental
description: Detects any SSH login attempt against an OpenCanary honeypot node, indicating malicious probing or activity since legitimate users should never connect to the decoy.
references:
    - https://opencanary.readthedocs.io/en/latest/starting/configuration.html#services-configuration
    - https://github.com/thinkst/opencanary/blob/a0896adfcaf0328cfd5829fe10d2878c7445138e/opencanary/logger.py#L52
author: Senior Threat Detection Engineer
date: 2026-06-02
logsource:
    product: opencanary
    category: application
detection:
    selection:
        logtype: 'SSH'
    condition: selection
falsepositives:
    - None (honeypot environment, any SSH attempt is suspicious)
level: high
tags:
    - attack.initial_access
    - attack.lateral_movement
    - attack.persistence
    - attack.discovery
    - attack.t1190
    - attack.t1021.004
    - attack.t1098
    - attack.t1046
