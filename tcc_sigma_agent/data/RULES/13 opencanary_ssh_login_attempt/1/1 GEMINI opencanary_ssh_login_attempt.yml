title: OpenCanary Honeypot Activity Triggered
id: e8a2b53c-1122-4aef-b811-da3a42c59cb1
status: experimental
description: Detects interactions with an OpenCanary honeypot daemon. OpenCanary logs unauthorized probes, connection attempts, and brute-force attacks against simulated network services (such as SSH, HTTP, SMB, and FTP). Because honeypots lack legitimate production users, any telemetry generated indicates active network scanning, discovery, or lateral movement.
references:
    - https://opencanary.readthedocs.io/en/latest/starting/configuration.html#services-configuration
    - https://github.com/thinkst/opencanary/blob/a0896adfcaf0328cfd5829fe10d2878c7445138e/opencanary/logger.py#L52
author: Security Operations Center
date: 2026/05/30
tags:
    - attack.reconnaissance
    - attack.t1595 # Active Scanning
    - attack.lateral_movement
logsource:
    category: application
    product: opencanary
detection:
    selection_parsed_fields:
        # Matches parsed JSON fields standardized by the OpenCanary logger implementation
        logtype|contains:
            - '1001'  # SSH login attempt
            - '2001'  # FTP login attempt
            - '3001'  # HTTP request / probe
            - '5001'  # Telnet login attempt
            - '9001'  # MySQL interaction
            - '17001' # RDP connection attempt
            - '18001' # SMB/Samba access
    selection_raw_json:
        # Fallback signature for unparsed JSON blobs within raw log messages
        Message|contains|all:
            - '"node_id":'
            - '"logtype":'
            - '"src_host":'
    condition: 1 of selection_*
falsepositives:
    - Vulnerability scanners, asset inventory tools, or authorized penetration testing teams probing the network segments where the honeypot resides.
    - Misconfigured corporate systems trying to connect to an outdated IP address currently assigned to the OpenCanary instance.
level: high
