title: OpenCanary SYN Port Scan Detection
id: 974be8d2-283e-4033-ab08-7505b84204d0
status: experimental
description: >
  Detects OpenCanary alerts indicating that a host was targeted by a SYN
  port scan. This activity is commonly associated with reconnaissance and
  service discovery performed prior to exploitation attempts.
references:
  - https://opencanary.readthedocs.io/en/latest/starting/configuration.html#services-configuration
  - https://github.com/thinkst/opencanary/blob/a0896adfcaf0328cfd5829fe10d2878c7445138e/opencanary/logger.py#L52
author: OpenAI
date: 2026-05-30
tags:
  - attack.discovery
  - attack.t1046
logsource:
  category: application
  product: opencanary
detection:
  selection:
    logtype: 5001
  condition: selection
fields:
  - src_host
  - src_port
  - dst_host
  - dst_port
  - node_id
  - logtype
  - local_time
falsepositives:
  - Authorized vulnerability scanning
  - Internal asset discovery tools
  - Security validation exercises
level: high
