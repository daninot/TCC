title: Suspicious Firewall Rule Creation (T1562.004 / Rhysida Ransomware)
id: 4e6a9d1c-4d1e-11ef-9a2d-0242ac120002
status: experimental
description: Detects creation of new Windows firewall rules via PowerShell (New-NetFirewallRule), which may indicate defense evasion or ransomware activity such as Rhysida.
author: Copilot
date: 2026/05/26
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md#atomic-test-24---set-a-firewall-rule-using-new-netfirewallrule
  - https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170
  - https://cybersecuritynews.com/rhysida-ransomware-attacking-windows/
logsource:
  product: windows
  service: powershell
  category: process_creation
detection:
  selection_firewall_rule:
    CommandLine|contains: "New-NetFirewallRule"
  selection_rhysida_patterns:
    CommandLine|contains:
      - "Allow"
      - "Any"
      - "Inbound"
      - "RemoteDesktop"
  condition: selection_firewall_rule and selection_rhysida_patterns
fields:
  - timestamp
  - CommandLine
  - User
  - ComputerName
  - ProcessId
falsepositives:
  - Legitimate administrators configuring firewall rules
  - Security tools deploying baseline firewall policies
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.004
  - ransomware.rhysida

