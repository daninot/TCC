title: New Firewall Rule Added via WmiPrvSE
id: a8f430b2-70b1-419b-ad7a-51df83cfa617
status: stable
description: Detects the addition of a new "Allow" firewall rule by the WMI provider host process (WmiPrvSE.exe). This activity is common in ransomware campaigns, such as Rhysida, where adversaries use PowerShell or WMI classes to execute firewall modifications under a system process context to facilitate lateral movement or command and control.
references:

* [https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md#atomic-test-24---set-a-firewall-rule-using-new-netfirewallrule](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md#atomic-test-24---set-a-firewall-rule-using-new-netfirewallrule)
* [https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170](https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170)
* [https://cybersecuritynews.com/rhysida-ransomware-attacking-windows/](https://cybersecuritynews.com/rhysida-ransomware-attacking-windows/)
author: Senior Threat Detection Engineer
date: 2026/05/26
tags:
* attack.defense_evasion
* attack.t1562.004
logsource:
product: windows
service: firewall_as
detection:
selection:
EventID:
* 2004
* 2071
* 2097
Action: 3
ModifyingApplication|endswith: '\Windows\System32\wbem\WmiPrvSE.exe'
condition: selection
falsepositives:


* Legitimate administrative scripts, orchestration platforms, or automated deployment frameworks updating Windows Firewall configuration via WMI/PowerShell.
level: medium
