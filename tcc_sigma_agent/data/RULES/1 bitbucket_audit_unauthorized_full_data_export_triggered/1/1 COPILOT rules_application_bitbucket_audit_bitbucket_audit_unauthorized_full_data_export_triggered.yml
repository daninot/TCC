title: Bitbucket Server Secret Scanning Detection
id: 12345678-90ab-cdef-1234-567890abcdef
status: experimental
description: Detects when Bitbucket Server audit logs report a secret scanning event (e.g., secret detected in repository).
author: Copilot
date: 2026/05/25
references:
  - https://confluence.atlassian.com/bitbucketserver/audit-log-events-776640423.html
  - https://confluence.atlassian.com/bitbucketserver/secret-scanning-1157471613.html
logsource:
  product: bitbucket
  service: audit
detection:
  selection:
    eventType: "SECRET_SCANNING"
    action: "SECRET_DETECTED"
  condition: selection
fields:
  - timestamp
  - user
  - repository
  - project
  - eventType
  - action
  - details
falsepositives:
  - Test repositories with intentionally committed dummy secrets
level: high
tags:
  - attack.credential_access
  - attack.t1552

