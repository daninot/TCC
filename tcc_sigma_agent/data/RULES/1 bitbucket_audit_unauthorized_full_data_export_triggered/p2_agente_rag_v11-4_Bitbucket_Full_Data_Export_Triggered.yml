title: Bitbucket Full Data Export Triggered
id: f431dcb5-8b03-4b92-906f-89b012a03cf7
status: test
description: Detects unauthorized attempts to export data from Bitbucket.
references:
  - https://confluence.atlassian.com/bitbucketserver/audit-log-events-776640423.html
author: "Your Name"
date: 2023-02-25
tags:
  - attack.collection
  - attack.reconnaissance
logsource:
  product: bitbucket
  service: audit
  definition: 'Requirements: "Advance" log level is required to receive these audit events.'
detection:
  selection:
    auditType.category: 'Data pipeline'
    auditType.action: 'Full data export triggered'
  condition: selection
falsepositives:
  - Legitimate user activity.
level: high