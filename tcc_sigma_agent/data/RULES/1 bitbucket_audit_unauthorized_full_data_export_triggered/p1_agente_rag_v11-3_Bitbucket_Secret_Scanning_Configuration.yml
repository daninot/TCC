title: Bitbucket Secret Scanning Configuration
id: 1aad0ff3-b07b-444e-9ff8-2dd0626089b9
status: test
description: Detects attempts to configure secret scanning in Bitbucket.
references:
  - https://confluence.atlassian.com/bitbucketserver/secret-scanning-1157471613.html
logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|contains|all:
      - '/rest/api/latest/projects/'
      - 'prefix='
      - '%00--exec'
  condition: selection
falsepositives:
  - Legitimate user activity
level: high