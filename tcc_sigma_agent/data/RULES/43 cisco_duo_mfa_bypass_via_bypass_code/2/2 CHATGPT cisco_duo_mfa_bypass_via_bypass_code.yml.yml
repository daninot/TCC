title: Cisco Duo Successful MFA Authentication Via Bypass Code
id: 6f7e1c10-2dc9-4312-adb6-9574ff09a5c8
status: test
description: Detects successful Duo MFA authentications performed using a bypass code. Bypass codes are temporary administrator-issued passcodes that can be abused to circumvent normal MFA verification requirements.
references:

* [https://duo.com/docs/adminapi#logs](https://duo.com/docs/adminapi#logs)
* [https://help.duo.com/s/article/6327?language=en_US](https://help.duo.com/s/article/6327?language=en_US)
  logsource:
  product: cisco
  service: duo
  detection:
  selection:
  event_type: authentication
  reason: bypass_user
  condition: selection
  falsepositives:
* Legitimate use of administrator-issued bypass codes for account recovery or temporary access
  level: medium
  tags:
* attack.credential-access
* attack.initial-access
* attack.defense-evasion
* attack.t1556
* attack.t1078.004

