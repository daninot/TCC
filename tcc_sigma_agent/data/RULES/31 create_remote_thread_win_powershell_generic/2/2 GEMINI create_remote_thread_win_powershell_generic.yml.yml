title: Remote Thread Creation From PowerShell
id: d17b5c3e-90ab-4efd-b12a-3c5e8f4d9a10
status: stable
description: Detects remote thread creation originating from a PowerShell process into another process, which can indicate code injection or process migration techniques.
references:

* [https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse](https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse)
author: Senior Threat Detection Engineer
date: 2026/06/05
tags:
* attack.defense_evasion
* attack.privilege_escalation
* attack.t1055.001
logsource:
product: windows
category: create_remote_thread
detection:
selection:
SourceImage|endswith:
* '\powershell.exe'
* '\pwsh.exe'
filter_main_telemetry:
TargetImage|endswith: '\CompatTelRunner.exe'
condition: selection and not 1 of filter_main_*
falsepositives:


* Legitimate administrative tools, security agents, or system troubleshooting utilities that use PowerShell for remote process diagnostics.
level: high
