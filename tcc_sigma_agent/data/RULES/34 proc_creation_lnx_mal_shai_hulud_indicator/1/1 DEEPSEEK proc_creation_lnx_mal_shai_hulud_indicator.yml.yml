title: Shai-Hulud Malware Indicators - setup_bun.js or bun_environment.js Creation
id: 11111111-1111-1111-1111-111111111111
status: test
description: Detects creation of setup_bun.js or bun_environment.js files, which are malicious files injected by the Shai-Hulud supply chain worm into compromised npm packages.
references:
    - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
    - https://www.aikido.dev/blog/shai-hulud-strikes-again-hitting-zapier-ensdomains
    - https://semgrep.dev/blog/2025/digging-for-secrets-sha1-hulud-the-second-coming-of-the-npm-worm/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2026-06-05
tags:
    - attack.t1195.001
    - attack.s9008
logsource:
    category: file_event
    product: linux
detection:
    selection:
        TargetFilename|endswith:
            - 'setup_bun.js'
            - 'bun_environment.js'
    condition: selection
falsepositives:
    - Unknown
level: high
