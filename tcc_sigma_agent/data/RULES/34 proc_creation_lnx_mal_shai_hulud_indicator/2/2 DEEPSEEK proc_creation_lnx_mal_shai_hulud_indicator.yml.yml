title: Shai-Hulud Malware Execution on Linux
id: b8c9d0e1-f2a3-44b5-86c7-8d9e0f1a2b3c
status: experimental
description: Detects execution of Shai-Hulud malware, a supply chain worm targeting the npm ecosystem, by matching characteristic identifier strings in the process command line.
references:
    - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
    - https://www.aikido.dev/blog/shai-hulud-strikes-again-hitting-zapier-ensdomains
    - https://semgrep.dev/blog/2025/digging-for-secrets-sha1-hulud-the-second-coming-of-the-npm-worm/
author: Senior Threat Detection Engineer
date: 2026-06-06
logsource:
    product: linux
    category: process_creation
detection:
    selection:
        CommandLine|contains:
            - 'Shai-Hulud'
            - 'sha1-hulud'
            - 'SHAI_HULUD'
    condition: selection
falsepositives:
    - Legitimate references to Dune-themed code or test strings
level: critical
tags:
    - attack.execution
    - attack.t1105
    - attack.t1059.001
    - attack.t1552.001
