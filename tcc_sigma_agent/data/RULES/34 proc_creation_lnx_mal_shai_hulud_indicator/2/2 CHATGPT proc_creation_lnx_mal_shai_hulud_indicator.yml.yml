title: Shai-Hulud Malware Execution on Linux
id: 2f7a8f6c-8d0c-4ad4-9e69-5f1e4f0f7d3b
status: experimental
description: Detects Linux process executions with characteristic Shai-Hulud command-line strings associated with the npm supply-chain worm and secret exfiltration activity.
references:

* [https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack](https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack)
* [https://www.aikido.dev/blog/shai-hulud-strikes-again-hitting-zapier-ensdomains](https://www.aikido.dev/blog/shai-hulud-strikes-again-hitting-zapier-ensdomains)
* [https://semgrep.dev/blog/2025/digging-for-secrets-sha1-hulud-the-second-coming-of-the-npm-worm/](https://semgrep.dev/blog/2025/digging-for-secrets-sha1-hulud-the-second-coming-of-the-npm-worm/)
  author: OpenAI
  date: 2026-06-06
  tags:
* attack.execution
* attack.supply_chain_compromise
  logsource:
  product: linux
  category: process_creation
  detection:
  selection:
  CommandLine|contains:

  * 'Shai-Hulud'
  * 'Sha1-Hulud'
  * 'shai-hulud'
  * 'sha1-hulud'
    condition: selection
    falsepositives:
* Security research or incident response activity referencing the malware name
  level: high

