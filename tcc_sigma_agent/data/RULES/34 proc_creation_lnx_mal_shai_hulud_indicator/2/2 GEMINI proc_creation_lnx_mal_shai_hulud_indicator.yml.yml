title: Shai-Hulud Malware Execution
id: f6e8b409-a1c2-48ef-b924-f7b2c0199e8d
status: experimental
description: Detects the execution of Shai-Hulud (and Mini Shai-Hulud) malware on Linux hosts. This supply chain worm targets developer and CI/CD ecosystems to exfiltrate secrets, leaving distinctive strings and daemon names within process command lines.
references:

* [https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack](https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack)
* [https://www.aikido.dev/blog/shai-hulud-strikes-again-hitting-zapier-ensdomains](https://www.aikido.dev/blog/shai-hulud-strikes-again-hitting-zapier-ensdomains)
* [https://semgrep.dev/blog/2025/digging-for-secrets-sha1-hulud-the-second-coming-of-the-npm-worm/](https://semgrep.dev/blog/2025/digging-for-secrets-sha1-hulud-the-second-coming-of-the-npm-worm/)
author: Senior Threat Detection Engineer
date: 2026/06/06
tags:
* attack.execution
* attack.initial_access
* attack.t1190
* attack.persistence
logsource:
product: linux
category: process_creation
detection:
selection:
CommandLine|contains:
* 'gh-token-monitor'
* 'kitty-monitor'
* 'SHA1HULUD'
* 'bun_environment.js'
* 'setup_bun.js'
* 'IfYouRevokeThisTokenItWillWipeTheComputerOfTheOwner'
* 'ctf-scramble-v2'
condition: selection
falsepositives:


* None expected. These are highly specific operational components and strings unique to the Shai-Hulud malware family.
level: critical
