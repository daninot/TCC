title: GitHub Audit Log Destructive Action - Resource Deletion
id: a2b3c4d5-e6f7-8901-2345-67890abcdef1
status: experimental
description: Detects delete actions in GitHub audit logs targeting codespaces, environments, projects, and repositories, indicating potential destructive activity or unauthorized resource removal.
references:
    - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions
    - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events#codespaces
author: Senior Threat Detection Engineer
date: 2026-06-03
logsource:
    product: github
    service: audit
    # Documentation: Requires GitHub audit log streaming to be enabled
    # Setup: https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-streaming
detection:
    selection:
        action|endswith:
            - '.delete'
            - '.destroy'
            - '.remove'
        action|startswith:
            - 'codespace.'
            - 'environment.'
            - 'project.'
            - 'repo.'
    condition: selection
falsepositives:
    - Legitimate administrative cleanup of unused resources.
    - Automated lifecycle management scripts.
level: medium
tags:
    - attack.impact
    - attack.t1485
