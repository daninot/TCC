title: GitHub Codespaces Activity in Security and Audit Logs
id: 7b4c7f2d-4f3d-4b5f-b1e5-9c4b7f6d2d91
status: experimental
description: Detects GitHub Codespaces-related security log and organization audit log events, including codespace creation, environment start, credential refresh, environment export, and trusted repository access changes.
references:
  - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions
  - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events#codespaces
author: OpenAI
tags:
  - attack.initial_access
  - attack.execution
  - attack.defense_evasion
logsource:
  category: application
detection:
  selection:
    action:
      - 'codespaces.allow_permissions'
      - 'codespaces.connect'
      - 'codespaces.create'
      - 'codespaces.destroy'
      - 'codespaces.export_environment'
      - 'codespaces.restore'
      - 'codespaces.start_environment'
      - 'codespaces.suspend_environment'
      - 'codespaces.trusted_repositories_access_update'
      - 'user.codespaces_trusted_repo_access_granted'
      - 'user.codespaces_trusted_repo_access_revoked'
  condition: selection
fields:
  - action
  - actor
  - user
  - user_agent
  - repo
  - org
  - request_id
  - created_at
falsepositives:
  - Legitimate developer Codespaces usage
  - Repository maintenance and onboarding activity
  - Administrative changes to Codespaces settings
level: medium
