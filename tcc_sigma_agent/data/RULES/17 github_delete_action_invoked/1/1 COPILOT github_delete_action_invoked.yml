title: GitHub Organization Audit - Sensitive Org and Codespaces Actions
id: 9c1f4b2e-6a7d-4f3b-8e2a-0f1b2c3d4e5a
status: experimental
description: Detects sensitive GitHub organization audit log actions and Codespaces events that may indicate unauthorized changes to organization security settings, OAuth/SAML integrations, or suspicious Codespaces provisioning. Tune actor allowlists and known automation/service accounts to reduce false positives.
author: Daniela
date: 2026-06-03
references:
  - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions
  - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events#codespaces
logsource:
  product: github
  service: audit
  category: cloud
detection:
  selection_sensitive_org_actions:
    action:
      - "org.oauth_application.authorized"
      - "org.oauth_application.revoked"
      - "org.saml.sso_enabled"
      - "org.saml.sso_disabled"
      - "org.saml.sso_configured"
      - "org.2fa_requirement.enabled"
      - "org.2fa_requirement.disabled"
      - "org.ldap_configured"
      - "org.ldap_removed"
      - "org.settings.updated"
      - "org.member.invited"
      - "org.member.removed"
  selection_codespaces_actions:
    action:
      - "codespaces.create"
      - "codespaces.delete"
      - "codespaces.prebuild.create"
      - "codespaces.ssh_authorized"
      - "codespaces.ssh_revoked"
  condition: selection_sensitive_org_actions or selection_codespaces_actions
fields:
  - "@timestamp"
  - action
  - actor
  - actor_login
  - actor_location
  - organization
  - repository
  - client_ip
  - user_agent
  - request_url
  - request_payload
falsepositives:
  - Legitimate administrative changes by authorized organization owners or automation accounts
  - Scheduled or automated provisioning/deprovisioning of Codespaces by CI/CD or onboarding tooling
level: high
tags:
  - cloud.github
  - identity_and_access
  - attack.persistence
  - attack.privilege_escalation
  - detection.audit
notes: |
  - Tune by whitelisting known automation/service accounts and trusted admin actors.
  - Correlate with unusual actor IPs, new or foreign actor locations, or unexpected timing (off-hours).
  - Investigate request_payload and request_url for details (e.g., OAuth client IDs, SAML metadata, Codespace repo/image).

