title: Potential MeshAgent Execution on macOS via Persistent Command-Line Argument
id: 6c1f9a2b-4e7d-4b3a-9f2c-1b8e7d5a3c4f
status: experimental
description: Detects execution of a process on macOS where the command line contains MeshAgent-specific installer/service arguments (which persist even if the binary is renamed). MeshAgent and derivatives often retain flags such as --install when launched for persistence or service installation; detection focuses on these arguments rather than the executable name.
author: Senior Threat Detection Engineer
date: 2026/06/07
references:
  - [https://www.huntress.com/blog/know-thy-enemy-a-novel-november-case-on-persistent-remote-access](https://www.huntress.com/blog/know-thy-enemy-a-novel-november-case-on-persistent-remote-access)
  - [https://wazuh.com/blog/how-to-detect-meshagent-with-wazuh/](https://wazuh.com/blog/how-to-detect-meshagent-with-wazuh/)
  - [https://thecyberexpress.com/ukraine-hit-by-meshagent-malware-campaign/](https://thecyberexpress.com/ukraine-hit-by-meshagent-malware-campaign/)
tags:
  - attack.persistence
  - attack.remote_services
  - malware.meshagent
logsource:
  product: macos
  category: process_creation
  description: Process creation events from macOS endpoint telemetry (e.g., sysmon for macOS, osquery, or native process auditing) that include the full CommandLine. Ensure process auditing is enabled and command-line arguments are captured.
detection:
  selection:
    CommandLine|contains:
      - '--install'
      - '-install'
  condition: selection
falsepositives:
  - Legitimate software installers or management agents that use --install or -install flags.
  - Developer or build tools invoked with install-style arguments during packaging or CI workflows.
level: high
