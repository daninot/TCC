title: Potential MeshAgent Execution on macOS
id: d4e5f6a7-b8c9-40d1-92e3-4a5b6c7d8e9f
status: experimental
description: Detects potential MeshAgent execution on macOS based on characteristic command-line arguments, as this remote access tool is abused by threat actors (including Medusa ransomware) who often rename the binary but retain specific arguments.
references:
    - https://www.huntress.com/blog/know-thy-enemy-a-novel-november-case-on-persistent-remote-access
    - https://thecyberexpress.com/ukraine-hit-by-meshagent-malware-campaign/
    - https://wazuh.com/blog/how-to-detect-meshagent-with-wazuh/
    - https://www.security.com/threat-intelligence/medusa-ransomware-attacks
author: Senior Threat Detection Engineer
date: 2026-06-05
logsource:
    product: macos
    category: process_creation
detection:
    selection:
        CommandLine|contains: '--pair'
    condition: selection
falsepositives:
    - Legitimate use of MeshAgent for remote administration
level: high
tags:
    - attack.command_and_control
    - attack.t1219
    - attack.persistence
