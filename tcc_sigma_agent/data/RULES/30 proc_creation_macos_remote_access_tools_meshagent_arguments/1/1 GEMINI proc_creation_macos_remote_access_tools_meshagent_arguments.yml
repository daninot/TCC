title: MeshAgent Remote Access Tool Execution
id: a9d8213e-1b2c-4ef3-90bd-b65fa312984b
status: experimental
description: Detects the execution or service installation of MeshAgent, an open-source remote monitoring and management (RMM) tool. While legitimate, MeshAgent is frequently abused by threat actors—such as Medusa ransomware affiliates and adversaries targeting Ukrainian entities—to maintain persistent remote access and command-and-control (C2) within a compromised network.
references:
    - https://www.huntress.com/blog/know-thy-enemy-a-novel-november-case-on-persistent-remote-access
    - https://thecyberexpress.com/ukraine-hit-by-meshagent-malware-campaign/
    - https://wazuh.com/blog/how-to-detect-meshagent-with-wazuh/
    - https://www.security.com/threat-intelligence/medusa-ransomware-attacks
author: Security Operations Center
date: 2026/06/05
tags:
    - attack.command_and_control
    - attack.persistence
    - attack.t1219 # Remote Access Software
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith: '\meshagent.exe'
    selection_commandline:
        CommandLine|contains:
            - '-fullservice'
            - 'meshagent'
            - 'meshcentral'
            - 'node-mesh'
    condition: 1 of selection_*
falsepositives:
    - Legitimate IT department, helpdesk, or Managed Service Provider (MSP) infrastructure intentionally using MeshCentral or MeshAgent for remote device administration.
level: high
