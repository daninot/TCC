title: Registry Modification Adding Domains to Trusted Sites Zone  
id: 3b9f1a2e-6c4d-4f8a-9b2e-1d3f5a6c7e88  
status: experimental  
description: Detects registry modifications that add domains under the Trusted Sites Zone path (`ZoneMap\Domains`) which can be abused for defense evasion and persistence by marking attacker-controlled domains as trusted. Requires collection of Windows registry modification events (e.g., Security Event ID 4657) and capture of the registry value details.  
references:  
  - [https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone](https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone)  
author: Senior Threat Detection Engineer  
date: 2026-05-30  
tags:  
  - attack.defense_evasion  
  - attack.persistence  
  - attack.t1112  
logsource:  
  product: windows  
  category: registry  
  requirement: Windows registry modification events must be collected (e.g., Security Event ID 4657) and include the `TargetObject` and `Details` fields.  
detection:  
  selection_path:  
    TargetObject|startswith: "\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\Domains\\"  
  selection_details_present:  
    Details|contains: "DWORD"  
  exclusion_details:  
    Details:  
      - "DWORD (0x00000000)"  
      - "DWORD (0x00000001)"  
      - "(Empty)"  
  condition: selection_path and selection_details_present and not exclusion_details  
falsepositives:  
  - Legitimate administrative configuration changes where administrators add internal or partner domains to Trusted Sites; changes from configuration management tools or documented maintenance windows.  
level: high
