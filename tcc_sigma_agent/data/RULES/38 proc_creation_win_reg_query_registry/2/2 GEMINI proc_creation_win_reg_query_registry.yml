title: Registry Reconnaissance via Reg.exe
id: c3b2a10e-5d4f-4a1b-92bc-8d7a1b3c5eed
status: stable
description: Detects registry reconnaissance using reg.exe to query sensitive registry keys for credentials, persistence mechanisms, software inventories, or service configurations.
references:

* [https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md](https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md)
author: Senior Threat Detection Engineer
date: 2026/06/07
tags:
* attack.discovery
* attack.t1012
logsource:
product: windows
category: process_creation
detection:
selection_binary:
* Image|endswith: '\reg.exe'
* OriginalFileName: 'reg.exe'
selection_subcommand:
CommandLine|contains: 'query'
selection_paths:
CommandLine|contains:
* '\CurrentVersion\Run'
* '\CurrentVersion\Winlogon'
* '\CurrentControlSet\Services'
* '\CurrentControlSet\Control\Lsa'
* '\CurrentVersion\Policies'
* '\Terminal Server\Wds\rdpwd'
condition: all of selection_*
falsepositives:




* Legitimate automated system administration tools, asset management software, host baseline checkers, or compliance audit scripts.
level: medium
