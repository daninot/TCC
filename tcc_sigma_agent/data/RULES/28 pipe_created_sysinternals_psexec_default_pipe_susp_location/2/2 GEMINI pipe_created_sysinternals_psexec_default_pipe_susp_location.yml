title: Default PsExec Named Pipe Creation
id: a5b7c89e-2134-4bc3-a612-da78ef91cd02
status: stable
description: Detects the creation of the default PsExec named pipe on a Windows host, which indicates PsExec service execution. This is commonly used for lateral movement or remote command execution by both administrators and attackers. This rule requires Sysmon named pipe event logging (Event ID 17 or 18) to be properly configured.
references:

* [https://www.jpcert.or.jp/english/pub/sr/ir_research.html](https://www.jpcert.or.jp/english/pub/sr/ir_research.html)
* [https://jpcertcc.github.io/ToolAnalysisResultSheet](https://jpcertcc.github.io/ToolAnalysisResultSheet)
author: Senior Threat Detection Engineer
date: 2026/06/05
tags:
* attack.execution
* attack.lateral_movement
* attack.t1021.002
* attack.t1569.002
logsource:
product: windows
category: pipe_created
detection:
selection:
PipeName: '\psexecsvc'
condition: selection
falsepositives:
* Legitimate administrative use of PsExec for remote network management and troubleshooting.
level: medium
