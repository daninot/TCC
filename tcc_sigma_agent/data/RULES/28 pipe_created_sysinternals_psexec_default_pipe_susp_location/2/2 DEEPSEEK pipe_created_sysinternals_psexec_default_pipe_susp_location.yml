title: PsExec Service Named Pipe Creation
id: b2c3d4e5-f6a7-48b9-0c1d-2e3f4a5b6c7d
status: experimental
description: Detects creation of the default PsExec named pipe (PSEXESVC), indicating PsExec service execution used for lateral movement or remote command execution.
references:
    - https://www.jpcert.or.jp/english/pub/sr/ir_research.html
    - https://jpcertcc.github.io/ToolAnalysisResultSheet
author: Senior Threat Detection Engineer
date: 2026-06-05
logsource:
    product: windows
    category: pipe_created
    definition: 'Requires Sysmon named pipe event logging (Event ID 17 for pipe creation, Event ID 18 for pipe connection)'
detection:
    selection:
        PipeName|endswith: '\PSEXESVC'
    condition: selection
falsepositives:
    - Legitimate administrative use of PsExec by IT staff
level: high
tags:
    - attack.lateral_movement
    - attack.t1021.002
    - attack.t1570
