title: Potential Registry Modification for Persistence
id: 019ceff2-b54b-4fd6-8bbe-5f53dfb1d4a8
status: test
description: Detects registry modifications that could be used to add malicious domains to the Trusted Sites zone.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone
author: frack113
date: 2022-10-02
modified: 2023-08-17
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains\\'
        Details: 'DWORD (0x00000000)'
    condition: selection and not filter_main_
falsepositives:
    - Legitimate environment configurations
level: medium