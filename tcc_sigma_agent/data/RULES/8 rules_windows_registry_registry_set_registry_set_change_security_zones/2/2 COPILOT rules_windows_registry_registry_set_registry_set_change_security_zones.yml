title: Registry Modification Adding Domains to Trusted Sites Zone  
id: 9e2f7c6d-4b3a-4d8e-9f2a-7c6b5e4d3a21  
status: experimental  
description: Detects silent modifications to the Windows Registry that add domains to the Trusted Sites zone. Adversaries may abuse this technique for defense evasion and persistence by ensuring their malicious domains are treated as trusted. Requires monitoring of registry modification events.  
references:  
  - [https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone](https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone)  
author: Senior Threat Detection Engineer  
date: 2026-05-26  
tags:  
  - attack.defense_evasion  
  - attack.persistence  
  - attack.t1112  
logsource:  
  product: windows  
  category: registry  
detection:  
  selection_path:  
    TargetObject|contains: "\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\Domains\\"  
  selection_value:  
    Details|contains: "DWORD"  
  exclusion:  
    Details:  
      - "DWORD (0x00000000)"   # My Computer  
      - "DWORD (0x00000001)"   # Local Intranet Zone  
      - "(Empty)"  
  condition: selection_path and selection_value and not exclusion  
falsepositives:  
  - Legitimate enterprise configurations where administrators add trusted domains intentionally for internal applications or services.  
level: high  
