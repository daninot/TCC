title: Windows Trusted Sites Zone Registry Modification
id: de604f82-748a-4933-91df-f1797c5e2195
status: stable
description: Detects registry modifications that add domains to the internet settings zone map, which can be abused by adversaries to force trust onto malicious domains for defense evasion or persistence.
references:

* [https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone](https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone)
author: Senior Threat Detection Engineer
date: 2026/05/26
tags:
* attack.defense_evasion
* attack.persistence
* attack.t1112
logsource:
product: windows
category: registry
detection:
selection_path:
TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains'
exclusion_details:
Details:
* 'DWORD (0x00000000)'
* 'DWORD (0x00000001)'
* '(Empty)'
condition: selection_path and not exclusion_details
falsepositives:


* Legitimate enterprise group policies or administrative scripts updating trusted site configurations across corporate endpoints.
level: medium
