title: Django Security Exception Detection
id: 3c9b7f6a-2b8e-4e6c-9f8d-django-sec-exceptions
description: Detects Django security-related exceptions in application logs that may indicate exploitation attempts (path traversal, session tampering, redirect abuse, oversized payloads).
status: experimental
author: Copilot
date: 2026/06/02
references:
  - https://docs.djangoproject.com/en/1.11/ref/exceptions/
  - https://docs.djangoproject.com/en/1.11/topics/logging/#django-security
logsource:
  category: application
  product: django
detection:
  selection:
    message|contains:
      - "SuspiciousOperation"
      - "DisallowedHost"
      - "DisallowedModelAdminLookup"
      - "DisallowedModelAdminToField"
      - "DisallowedRedirect"
      - "InvalidSessionKey"
      - "RequestDataTooBig"
      - "PermissionDenied"
  condition: selection
fields:
  - timestamp
  - level
  - logger
  - message
falsepositives:
  - Misconfigured application behavior
  - Legitimate but unusual user input
level: high
tags:
  - attack.web
  - attack.exploitation
  - attack.session
  - attack.redirect
  - attack.payload
