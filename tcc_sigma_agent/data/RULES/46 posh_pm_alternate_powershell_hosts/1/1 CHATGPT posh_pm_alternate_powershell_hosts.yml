title: Suspicious Remote Service Installation
id: 2edc5d7c-5f2f-4b42-9b2d-4adf3f8a0b31
status: experimental
description: Detects Windows service installation events with suspicious service binary paths often associated with remote service creation and lateral movement.
references:
  - https://threathunterplaybook.com/hunts/windows/190815-RemoteServiceInstallation/notebook.html
author: OpenAI
date: 2026-06-08
tags:
  - attack.lateral_movement
  - attack.persistence
  - attack.t1021
  - attack.t1543.003
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID: 4697
  selection_suspicious_path:
    ServiceFileName|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'
      - '\\ADMIN$\'
      - '\\C$\'
      - 'cmd.exe'
      - 'powershell.exe'
      - 'wscript.exe'
      - 'cscript.exe'
  condition: selection_event and selection_suspicious_path
falsepositives:
  - Legitimate remote administration tools
  - Software deployment and endpoint management platforms
  - Administrative service installs during maintenance
level: high
