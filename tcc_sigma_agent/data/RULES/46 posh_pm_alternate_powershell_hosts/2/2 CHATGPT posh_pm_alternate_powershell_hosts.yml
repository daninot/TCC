title: PowerShell Execution From Alternate Hosts
id: 7b4f4f9c-7fb6-4d57-8b4a-4c1d0b8e4f2f
status: test
description: Detects PowerShell runtime execution from alternate (non-default) hosts via the HostApplication field in PowerShell classic event logging, which may indicate embedded PowerShell used to bypass application allow-lists.
references:

* [https://threathunterplaybook.com/hunts/windows/190815-RemoteServiceInstallation/notebook.html](https://threathunterplaybook.com/hunts/windows/190815-RemoteServiceInstallation/notebook.html)
  logsource:
  product: windows
  category: ps_classic_start
  detection:
  selection:
  Data|contains: 'HostApplication='
  filter_main_standard_powershell_paths:
  Data|contains:

  * 'HostApplication=C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
  * 'HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe'
  * 'HostApplication=C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  * 'HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
    filter_main_sdiagnhost:
    Data|contains:
  * 'HostApplication=C:\Windows\System32\sdiagnhost.exe'
  * 'HostApplication=C:/Windows/System32/sdiagnhost.exe'
    filter_main_bare_powershell:
    Data|contains: 'HostApplication=powershell'
    filter_optional_citrix_configsync:
    Data|contains:
  * 'Citrix'
  * 'ConfigSync'
    filter_optional_hexnode_agent:
    Data|contains:
  * 'Hexnode'
  * 'Agent'
    condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    falsepositives:
* Legitimate administrative tools that embed PowerShell
* Citrix ConfigSync activity
* Hexnode Agent activity
  level: medium
  tags:
* attack.defense-evasion
* attack.t1059.001

