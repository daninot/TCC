title: Suspicious File Creation In Windows Startup Folder
id: 1f0c7f2a-2cb0-4fd8-bf2d-4dd2f6b1e3f7
status: experimental
description: Detects creation of potentially malicious script or executable files in the Windows Startup folder, which may be used for persistence and automatic execution at user logon.
references:

* [https://github.com/last-byte/PersistenceSniper](https://github.com/last-byte/PersistenceSniper)
* [https://www.microsoft.com/en-us/security/blog/2025/03/06/malvertising-campaign-leads-to-info-stealers-hosted-on-github/](https://www.microsoft.com/en-us/security/blog/2025/03/06/malvertising-campaign-leads-to-info-stealers-hosted-on-github/)
* [https://github.com/redcanaryco/atomic-red-team/blob/5ede8f21e42ebe37e0a6eff757dba60bcfa85859/atomics/T1547.001/T1547.001.md](https://github.com/redcanaryco/atomic-red-team/blob/5ede8f21e42ebe37e0a6eff757dba60bcfa85859/atomics/T1547.001/T1547.001.md)
  author: OpenAI
  date: 2026-06-05
  tags:
* attack.persistence
* attack.t1547.001
  logsource:
  product: windows
  category: file_event
  detection:
  selection_startup:
  TargetFilename|contains:

  * '\Microsoft\Windows\Start Menu\Programs\Startup'
  * '\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'
    selection_ext:
    TargetFilename|endswith:
  * '.ps1'
  * '.vbs'
  * '.vbe'
  * '.js'
  * '.jse'
  * '.bat'
  * '.cmd'
  * '.hta'
  * '.dll'
  * '.jar'
  * '.exe'
  * '.scr'
  * '.com'
  * '.cpl'
  * '.pif'
  * '.msi'
  * '.wsf'
  * '.wsh'
  * '.lnk'
    condition: all of selection_*
    falsepositives:
* Legitimate software installation or administrator-driven persistence mechanisms
* User-created shortcuts or scripts placed in the Startup folder intentionally
  level: medium

