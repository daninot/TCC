title: Atlassian Bitbucket Full Data Export Attempted
id: 591bd267-a49c-40d9-a734-e81e43e4ef87
status: test
description: Detects when full data export is attempted on an Atlassian Bitbucket instance without proper authorization.
references:
    - https://confluence.atlassian.com/bitbucketserver/audit-log-events-776640423.html
    - https://confluence.atlassian.com/bitbucketserver/secret-scanning-1157471613.html
author: Senior Threat Detection Engineer (@threat_hunter)
date: 2024-02-25
tags:
    - attack.collection
    - attack.t1213.003
logsource:
    product: atlassian_bitbucket
    service: audit
    definition: 'Requirements: "Advanced" log level is required to receive these audit events.'
detection:
    selection:
        auditType.category: 'Data pipeline'
        auditType.action: 'Full data export triggered'
    condition: selection
falsepositives:
    - Legitimate user activity.
level: high