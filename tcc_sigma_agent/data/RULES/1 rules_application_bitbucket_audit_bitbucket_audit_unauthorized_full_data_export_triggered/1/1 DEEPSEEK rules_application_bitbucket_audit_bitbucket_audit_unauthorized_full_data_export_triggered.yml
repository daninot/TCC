title: Unauthorized Full Data Export Triggered
id: 3a2e1c4d-5b6f-4a8b-9c0d-1e2f3a4b5c6d
status: experimental
description: Detects when a user attempts to trigger a full data export from an Atlassian Bitbucket instance without proper authorization, which may indicate data exfiltration, insider threat, or compromised admin credentials.
references:
  - https://confluence.atlassian.com/bitbucketserver/audit-log-events-776640423.html
  - https://confluence.atlassian.com/bitbucketserver/secret-scanning-1157471613.html
author: Senior Threat Detection Engineer
date: 2026-05-25
tags:
  - attack.ta0010
  - attack.t1048
  - bitbucket
  - data_exfiltration
logsource:
  product: bitbucket
  category: audit
detection:
  selection:
    action: 'Unauthorized full data export triggered'
  condition: selection
falsepositives:
  - Legitimate administrative exports performed for backup, migration, or compliance purposes.
level: critical
