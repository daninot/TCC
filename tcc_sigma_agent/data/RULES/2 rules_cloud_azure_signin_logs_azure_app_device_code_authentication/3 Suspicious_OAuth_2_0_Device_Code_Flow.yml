title: Suspicious OAuth 2.0 Device Code Flow
id: ce8de0d2-1510-4c6b-8ab1-8571d8aaf09a
status: test
description: Detects suspicious use of the OAuth 2.0 Device Code flow in Azure/Entra ID environment.
references:
    - https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications#application-authentication-flows
author: Threat Hunter
date: 2023-02-20
modified: 2025-07-02
tags:
    - attack.t1090
    - attack.t1078.002
logsource:
    product: azure
    service: signinlogs
detection:
    selection_main:
        AuthenticationMethod: 'OAuth2DeviceCode'
        ResultType: 50097
    selection_empty1:
        DeviceDetail.trusttype: ''
    selection_empty2:
        DeviceDetail.trusttype: null
    condition: selection_main and 1 of selection_empty*
falsepositives:
    - Legitimate use by input-constrained devices (e.g., smart TVs, CLI tools)
level: medium