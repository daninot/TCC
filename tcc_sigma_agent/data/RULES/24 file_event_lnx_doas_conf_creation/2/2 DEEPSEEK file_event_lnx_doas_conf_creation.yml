title: Linux Doas Configuration File Creation
id: e4f5a6b7-c8d9-40e1-92f3-4a5b6c7d8e9f
status: experimental
description: Detects creation of the doas configuration file on Linux, which may indicate an attacker establishing privilege escalation capabilities as an alternative to sudo.
references:
    - https://research.splunk.com/endpoint/linux_doas_conf_file_creation/
    - https://www.makeuseof.com/how-to-install-and-use-doas/
author: Senior Threat Detection Engineer
date: 2026-06-04
logsource:
    product: linux
    category: file_event
detection:
    selection:
        TargetFilename|endswith: '/etc/doas.conf'
    condition: selection
falsepositives:
    - Legitimate system administration using doas
level: medium
tags:
    - attack.privilege_escalation
    - attack.t1548.003
