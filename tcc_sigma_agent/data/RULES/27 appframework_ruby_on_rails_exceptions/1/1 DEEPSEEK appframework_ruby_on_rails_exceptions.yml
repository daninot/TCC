title: Suspicious Rails Exception - Not Authorized or CSRF Failure
id: 7a2e1c4d-5b6f-4a8b-9c0d-1e2f3a4b5c6d
status: experimental
description: Detects 'not authorized' exceptions in Rails application logs, which may indicate unauthorized access attempts, parameter tampering, or automated scanning activities.
references:
  - http://edgeguides.rubyonrails.org/security.html
  - http://guides.rubyonrails.org/action_controller_overview.html
  - https://stackoverflow.com/questions/25892194/does-rails-come-with-a-not-authorized-exception
  - https://github.com/rails/rails/blob/cd08e6bcc4cd8948fe01e0be1ea0c7ca60373a25/actionpack/lib/action_dispatch/middleware/exception_wrapper.rb
author: Senior Threat Detection Engineer
date: 2026-06-04
tags:
  - attack.initial-access
  - attack.t1078
  - attack.t1190
  - attack.defense-evasion
  - attack.t1027
logsource:
  product: rails
  category: application
detection:
  selection:
    message|re:
      - 'ActionController::InvalidAuthenticityToken'
      - 'AbstractController::ActionNotFound'
      - 'ActionController::RoutingError'
      - 'ActionController::UnknownFormat'
      - 'ActionController::UnknownHttpMethod'
      - 'ActionController::MethodNotAllowed'
      - 'ActionController::NotImplemented'
      - 'ActiveRecord::RecordNotFound'
      - 'ActionPolicy::Unauthorized'
      - 'Pundit::NotAuthorizedError'
      - 'CanCan::AccessDenied'
      - 'NotAuthorizedError'
      - 'Completed 401 Unauthorized'
    status:
      - 401
      - 403
      - 422
  condition: selection
falsepositives:
  - Legitimate user errors such as expired sessions or malformed requests.
  - Automated security scanning tools.
  - Internal testing or debugging with DEBUG=true.
level: high
