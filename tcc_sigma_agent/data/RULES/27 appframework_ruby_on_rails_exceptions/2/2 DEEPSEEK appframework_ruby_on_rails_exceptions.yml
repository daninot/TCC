title: Suspicious Ruby on Rails Exception Classes
id: f6a7b8c9-d0e1-42f3-84a5-6b7c8d9e0f1a
status: experimental
description: Detects suspicious Ruby on Rails exception classes in application logs, indicating potential exploitation attempts such as CSRF token abuse, cross-origin request forgery, invalid HTTP methods, malformed requests, or missing required parameters.
references:
    - http://edgeguides.rubyonrails.org/security.html
    - http://guides.rubyonrails.org/action_controller_overview.html
    - https://stackoverflow.com/questions/25892194/does-rails-come-with-a-not-authorized-exception
    - https://github.com/rails/rails/blob/cd08e6bcc4cd8948fe01e0be1ea0c7ca60373a25/actionpack/lib/action_dispatch/middleware/exception_wrapper.rb
author: Senior Threat Detection Engineer
date: 2026-06-05
logsource:
    product: ruby_on_rails
    category: application
detection:
    selection:
        exception_class|contains:
            - 'ActionController::InvalidAuthenticityToken'
            - 'ActionController::InvalidCrossOriginRequest'
            - 'ActionController::UnknownHttpMethod'
            - 'ActionController::BadRequest'
            - 'ActionController::ParameterMissing'
            - 'ActionController::UnpermittedParameters'
            - 'ActionController::RoutingError'
            - 'ActionController::MethodNotAllowed'
    condition: selection
falsepositives:
    - Legitimate client errors from misconfigured or automated requests
level: medium
tags:
    - attack.initial_access
    - attack.t1190
    - attack.impact
