title: Potential PrintNightmare Remote Procedure Call (RPC) Execution
id: da0c313a-a11b-4cf7-9df0-7d7b42023d57
status: experimental
description: Detects the remote execution of specific MS-RPRN (Print System Remote Protocol) or MS-PAR (Print System Asynchronous Remote Protocol) RPC interface uuids and opnums (specifically RpcAddPrinterDriverEx/AsyncRpcAddPrinterDriverEx) used to exploit the PrintNightmare vulnerability (CVE-2021-34527). This can be monitored using tools like RPC Firewall or advanced RPC auditing.
references:
    - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527
    - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-rprn/d42db7d5-f141-4466-8f47-0a4be14e2fc1
    - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-pan/e44d984c-07d3-414c-8ffc-f8c8ad8512a8
    - https://github.com/jsecurity101/MSRPC-to-ATTACK/blob/ddd4608fe8684fcf2fcf9b48c5f0b3c28097f8a3/documents/MS-RPRN-PAR.md
    - https://github.com/zeronetworks/rpcfirewall
    - https://zeronetworks.com/blog/stopping-lateral-movement-via-the-rpc-firewall/
author: Security Operations Center
date: 2026/05/26
tags:
    - attack.lateral_movement
    - attack.privilege_escalation
    - attack.t1210 # Exploitation of Remote Services
logsource:
    product: windows
    service: rpc-firewall # Or generic windows RPC auditing telemetry if mapped to a custom event log
detection:
    selection_ms_rprn:
        # MS-RPRN Interface UUID: 12345678-1234-abcd-ef00-0123456789ab
        InterfaceUuid: '12345678-1234-abcd-ef00-0123456789ab'
        Opnum: 
            - 19 # RpcAddPrinterDriver
            - 89 # RpcAddPrinterDriverEx
    selection_ms_par:
        # MS-PAR Interface UUID: 76f03f96-cdfd-44fc-a22c-64950a001209
        InterfaceUuid: '76f03f96-cdfd-44fc-a22c-64950a001209'
        Opnum: 
            - 39 # AsyncRpcAddPrinterDriver
            - 58 # AsyncRpcAddPrinterDriverEx
    condition: 1 of selection_*
falsepositives:
    - Legitimate administrative actions involving network printer deployment or remote installation of official print drivers by a print server or system administrator.
level: critical
