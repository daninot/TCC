title: Remote RPC Print Service Invocations via RPC Firewall
id: bf3c9e6d-6284-4b53-8d0b-608b49e2cf4b
status: stable
description: Detects remote RPC calls targeting the Windows remote printing services (MS-RPRN and MS-PAR) using RPC Firewall logs. This pattern is characteristic of PrintNightmare (CVE-2021-34527) style exploitation for lateral movement or privilege escalation. This rule requires the RPC Firewall agent to be installed and configured to audit the printing RPC interface UUIDs across all processes.
references:

* [https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527](https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527)
* [https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-rprn/d42db7d5-f141-4466-8f47-0a4be14e2fc1](https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-rprn/d42db7d5-f141-4466-8f47-0a4be14e2fc1)
* [https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-pan/e44d984c-07d3-414c-8ffc-f8c8ad8512a8](https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-pan/e44d984c-07d3-414c-8ffc-f8c8ad8512a8)
* [https://github.com/jsecurity101/MSRPC-to-ATTACK/blob/ddd4608fe8684fcf2fcf9b48c5f0b3c28097f8a3/documents/MS-RPRN-PAR.md](https://github.com/jsecurity101/MSRPC-to-ATTACK/blob/ddd4608fe8684fcf2fcf9b48c5f0b3c28097f8a3/documents/MS-RPRN-PAR.md)
* [https://github.com/zeronetworks/rpcfirewall](https://github.com/zeronetworks/rpcfirewall)
* [https://zeronetworks.com/blog/stopping-lateral-movement-via-the-rpc-firewall/](https://zeronetworks.com/blog/stopping-lateral-movement-via-the-rpc-firewall/)
author: Senior Threat Detection Engineer
date: 2026/05/26
tags:
* attack.lateral_movement
* attack.privilege_escalation
* attack.t1210
* attack.t1068
logsource:
product: rpc_firewall
category: application
detection:
selection:
EventID: 1
InterfaceUuid:
* '12345678-1234-abcd-ef00-0123456789ab'
* '76f03f96-cdfd-44fc-a72c-31d664a5941c'
condition: selection
falsepositives:


* Legitimate remote printing operations, print server administration, or driver installations by authorized users and network administrators.
level: high
