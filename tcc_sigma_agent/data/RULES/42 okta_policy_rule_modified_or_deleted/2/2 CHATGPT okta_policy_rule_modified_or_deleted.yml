title: Okta Policy Rule Modification or Deletion
id: 0c97c1d3-4057-45c9-b148-1de94b631931
status: test
description: Detects modification or deletion of Okta policy rules, which may indicate weakening or removal of security controls such as MFA, sign-on, or access policies. References: Okta System Log event types policy.rule.update and policy.rule.delete.
references:

* [https://developer.okta.com/docs/reference/api/system-log/](https://developer.okta.com/docs/reference/api/system-log/)
* [https://developer.okta.com/docs/reference/api/event-types/](https://developer.okta.com/docs/reference/api/event-types/)
  logsource:
  product: okta
  service: okta
  detection:
  selection:
  eventType:

  * policy.rule.update
  * policy.rule.delete
    condition: selection
    falsepositives:
* Authorized administrative changes to Okta policy rules
  level: medium
  tags:
* attack.persistence
* attack.privilege-escalation
* attack.t1098
* attack.t1556
* attack.t1484.001

