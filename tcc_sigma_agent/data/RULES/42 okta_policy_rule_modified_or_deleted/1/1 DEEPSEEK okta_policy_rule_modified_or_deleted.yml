title: Okta Suspicious Activity Detected
id: 00112233-4455-6677-8899-aabbccddeeff
status: experimental
description: |
  Detects suspicious activity reported in Okta system logs, including user-reported suspicious activity, risk detections, and threat intelligence events.
  This rule aims to identify potential compromise, insider threats, or malicious behavior within an Okta environment.
references:
  - https://developer.okta.com/docs/reference/api/system-log/
  - https://developer.okta.com/docs/reference/api/event-types/
author: Sigma Rule Generator
date: 2026-06-07
tags:
  - attack.initial-access
  - attack.t1078
  - attack.persistence
  - attack.t1098
logsource:
  product: okta
  service: system_log
detection:
  selection:
    - eventType: "user.risk.detect"
    - eventType: "user.account.report_suspicious_activity_by_enduser"
    - eventType: "security.threat.detected"
    - eventType: "system.suspicious_activity.report"
    - eventType: "user.session.impersonation.initiate"
    - eventType: "application.privilege.grant"
    - outcome.result: "FAILURE"
      outcome.reason|contains: "Authentication failed: bad username or password"
  condition: selection
falsepositives:
  - Legitimate user interactions such as failed login attempts due to forgotten passwords.
  - Authorized administrator actions like granting application privileges.
level: high
