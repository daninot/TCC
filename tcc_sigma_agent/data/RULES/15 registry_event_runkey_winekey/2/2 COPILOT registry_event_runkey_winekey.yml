title: Suspicious Run Key Created/Modified by WINEKEY or Team9 Backdoor  
id: 7c3a9f2e-2b4d-4f6a-9e1b-0d5c8a7e4f21  
status: experimental  
description: Detects registry write events that create or modify a Run key entry under HKCU or HKLM which appears to be disguised as a legitimate backup manager application. Malware families such as WINEKEY/Team9 have been observed achieving persistence by adding Run key entries that mimic backup software. Requires collection of registry write events (Windows Security Event ID 4657 or Sysmon Event ID 13).  
references:  
  - [https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html](https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html)  
author: Senior Threat Detection Engineer  
date: 2026-06-01  
tags:  
  - attack.persistence  
  - attack.defense_evasion  
  - attack.t1547.001  
logsource:  
  product: windows  
  category: registry_event  
  requirement: Registry write events must be collected (Windows Security Event ID 4657 or Sysmon Event ID 13) and include full registry key path (`TargetObject`) and the value name (`TargetValueName`).  
detection:  
  selection_event:  
    EventID:  
      - 4657  
      - 13  
  selection_key:  
    TargetObject|endswith:  
      - "\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"  
      - "\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run"  
  selection_name:  
    TargetValueName|contains:  
      - "Backup"  
      - "BackupManager"  
      - "BackupSvc"  
  condition: selection_event and selection_key and selection_name  
falsepositives:  
  - Legitimate backup or endpoint protection software installers and management agents that create Run keys to persist their services; validate against known software inventories and change windows.  
level: high
