title: Office 365 New Federated Domain Added
id: e155876a-6048-11eb-ae93-0242ac130002
status: experimental
description: Detects the addition of a new federated domain in an Office 365 environment, which may indicate federation abuse or an Azure AD backdoor.
references:
  - https://research.splunk.com/cloud/e155876a-6048-11eb-ae93-0242ac130002/
  - https://o365blog.com/post/aadbackdoor/
author: OpenAI
date: 2026-06-04
tags:
  - attack.persistence
  - attack.credential_access
  - attack.t1136.003
logsource:
  product: o365
  service: management_activity
detection:
  selection:
    Workload: Exchange
    Operation: Add-FederatedDomain
  condition: selection
fields:
  - user
  - user_agent
  - authentication_service
  - Workload
  - Operation
  - ModifiedProperties{}.NewValue
  - ModifiedProperties{}.OldValue
  - vendor_account
  - dest
falsepositives:
  - Legitimate federation setup or migration activity
  - Planned identity provider changes by administrators
level: high
