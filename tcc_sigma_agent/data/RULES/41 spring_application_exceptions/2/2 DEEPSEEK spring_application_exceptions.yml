title: Suspicious Spring Security Exception Classes
id: d6e7f8a9-b0c1-42d3-94e5-f6a7b8c9d0e1
status: experimental
description: Detects suspicious Spring Security exception classes in application logs, indicating potential exploitation attempts such as unauthorized access, CSRF token abuse, cookie tampering, or rejected requests.
references:
    - https://docs.spring.io/spring-security/site/docs/current/api/overview-tree.html
author: Senior Threat Detection Engineer
date: 2026-06-06
logsource:
    product: spring
    category: application
detection:
    selection:
        exception_class|contains:
            - 'AccessDeniedException'
            - 'AuthenticationCredentialsNotFoundException'
            - 'AuthenticationServiceException'
            - 'BadCredentialsException'
            - 'InsufficientAuthenticationException'
            - 'InvalidBearerTokenException'
            - 'LockedException'
            - 'DisabledException'
            - 'AccountExpiredException'
            - 'CredentialsExpiredException'
            - 'CsrfException'
            - 'InvalidCsrfTokenException'
            - 'MissingCsrfTokenException'
            - 'SessionAuthenticationException'
            - 'UsernameNotFoundException'
            - 'ConcurrentSessionControlException'
            - 'MaximumSessionsExceededException'
            - 'SessionFixedException'
            - 'ProviderNotFoundException'
    condition: selection
falsepositives:
    - Legitimate authentication failures or expired sessions
level: medium
tags:
    - attack.initial_access
    - attack.t1190
    - attack.t1557
