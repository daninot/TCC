title: Suspicious LSASS Process Access Flags
id: 2f6d6c23-3c5f-4a54-9bb2-0a9f6f0f9a77
status: test
description: Detects process access requests to LSASS with GrantedAccess flags consistent with credential dumping behavior.
references:

* [https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights](https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights)
* [https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html](https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html)
* [https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment](https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment)
* [https://web.archive.org/web/20230420013146/http://security-research.dyndns.org/pub/slides/FIRST2017/FIRST-2017_Tom-Ueltschi_Sysmon_FINAL_notes.pdf](https://web.archive.org/web/20230420013146/http://security-research.dyndns.org/pub/slides/FIRST2017/FIRST-2017_Tom-Ueltschi_Sysmon_FINAL_notes.pdf)
  logsource:
  product: windows
  category: process_access
  detection:
  selection_target:
  TargetImage|endswith: '\lsass.exe'
  selection_access:

  * GrantedAccess|endswith:

    * '30'
    * '50'
    * '70'
    * '90'
    * 'B0'
    * 'D0'
    * 'F0'
    * '18'
    * '38'
    * '58'
    * '78'
    * '98'
    * 'B8'
    * 'D8'
    * 'F8'
    * '1A'
    * '3A'
    * '5A'
    * '7A'
    * '9A'
    * 'BA'
    * 'DA'
    * 'FA'
  * GrantedAccess|startswith:

    * '0x100000'
    * '0x1010'
    * '0x1410'
    * '0x1418'
    * '0x1438'
    * '0x143a'
    * '0x1f0fff'
    * '0x1f1fff'
    * '0x1f2fff'
    * '0x1f3fff'
    * '0x40'
      filter_main_generic:
      SourceImage|contains:
    * ':\Program Files (x86)'
    * ':\Program Files'
    * ':\Windows\System32'
    * ':\Windows\SysWOW64'
      filter_main_windefend_1:
      SourceImage|contains: ':\ProgramData\Microsoft\Windows Defender'
      SourceImage|endswith: '\MsMpEng.exe'
      filter_main_windefend_2:
      CallTrace|contains|all:
    * ':\ProgramData\Microsoft\Windows Defender\Definition Updates{'
    * '}\mpengine.dll+'
      GrantedAccess: '0x1418'
      filter_main_windefend_3:
      CallTrace|contains:
    * '|c:\program files\windows defender\mprtp.dll'
    * '|c:\program files\windows defender\MpClient.dll'
      filter_main_explorer:
      SourceImage|endswith: '\explorer.exe'
      GrantedAccess: '0x401'
      filter_optional_malwarebytes:
      SourceImage|endswith: ':\ProgramData\MALWAREBYTES\MBAMSERVICE\ctlrupdate\mbupdatr.exe'
      filter_optional_mbami:
      SourceImage|endswith: '\MBAMInstallerService.exe'
      GrantedAccess: '0x40'
      filter_optional_vscode:
      SourceImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
      filter_optional_vmwaretools:
      SourceImage|contains: ':\ProgramData\VMware\VMware Tools'
      SourceImage|endswith: '\vmtoolsd.exe'
      filter_optional_sysinternals_process_explorer:
      SourceImage|endswith:
    * '\PROCEXP64.EXE'
    * '\PROCEXP.EXE'
      GrantedAccess: '0x40'
      filter_optional_sysinternals_handle:
      SourceImage|endswith:
    * '\handle.exe'
    * '\handle64.exe'
      GrantedAccess: '0x40'
      filter_optional_nextron:
      SourceImage|endswith:
    * '\aurora-agent-64.exe'
    * '\aurora-agent.exe'
    * '\thor.exe'
    * '\thor64.exe'
      GrantedAccess: '0x40'
      filter_optional_webex:
      SourceImage|endswith: '\AppData\Local\WebEx\WebexHost.exe'
      GrantedAccess: '0x401'
      filter_optional_steam_apps:
      SourceImage|contains: '\SteamLibrary\steamapps'
      condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
      falsepositives:
* Legitimate security tools, EDR, AV, and endpoint diagnostics
* User-initiated inspection or troubleshooting of LSASS by administrative tools
  level: high
  tags:
* attack.credential-access
* attack.t1003.001

