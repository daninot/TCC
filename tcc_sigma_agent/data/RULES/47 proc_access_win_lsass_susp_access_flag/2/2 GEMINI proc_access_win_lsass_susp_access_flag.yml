title: LSASS Process Access with Suspicious GrantedAccess Mask
id: 7b9e4a3c-1d2e-4f5a-9b8c-0d1e2f3a4b5c
status: experimental
description: Detects process access requests to LSASS with GrantedAccess flags consistent with credential dumping (Mimikatz-class tools). LSASS holds authentication secrets; access masks like 0x1F0FFF / 0x1F1FFF / 0x1F2FFF / 0x1F3FFF and the 0x1010 / 0x1410 / 0x1438 family indicate memory read or duplication intent.
references:
- [https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights](https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights)
- [https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html](https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html)
- [https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment](https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment)
- [https://web.archive.org/web/20230420013146/http://security-research.dyndns.org/pub/slides/FIRST2017/FIRST-2017_Tom-Ueltschi_Sysmon_FINAL_notes.pdf](https://web.archive.org/web/20230420013146/http://security-research.dyndns.org/pub/slides/FIRST2017/FIRST-2017_Tom-Ueltschi_Sysmon_FINAL_notes.pdf)
author: Senior Threat Detection Engineer
date: 2026/06/08
tags:
- attack.credential_access
- attack.t1003.001
logsource:
product: windows
category: process_access
detection:
selection_target:
TargetImage|endswith: '\lsass.exe'
selection_access:
GrantedAccess|startswith:
- '0x100000'
- '0x1f0fff'
- '0x1f1fff'
- '0x1f2fff'
- '0x1f3fff'
- '0x1418'
- '0x1438'
- '0x143a'
- '0x40'
GrantedAccess|endswith:
- '30'
- '38'
- '3a'
- '50'
- '58'
- '5a'
- '70'
- '78'
- '7a'
- '90'
- '98'
- '9a'
- 'B0'
- 'B8'
- 'Ba'
- 'D0'
- 'D8'
- 'Da'
- 'F0'
- 'F8'
- 'Fa'
- '10'
- '18'
- '1a'
- 'ff'
filter_main_paths:
SourceImage|contains:
- '\Windows\System32'
- '\Program Files'
- '\Program Files (x86)'
filter_main_defender_msmpeng:
SourceImage|contains: '\Microsoft\Windows Defender\Platform'
SourceImage|endswith: '\MsMpEng.exe'
filter_main_defender_mpengine:
CallTrace|contains|all:
- '\Definition Updates'
- '\mpengine.dll'
GrantedAccess: '0x1418'
filter_main_defender_client:
CallTrace|contains:
- 'MpClient'
- 'mprtp'
filter_main_explorer:
SourceImage|endswith: '\explorer.exe'
GrantedAccess: '0x401'
filter_optional_malwarebytes:
SourceImage|endswith:
- '\mbupdatr.exe'
- '\MBAMInstallerService.exe'
GrantedAccess: '0x40'
filter_optional_vscode:
SourceImage|endswith: '\Code.exe'
filter_optional_vmware:
SourceImage|endswith: '\vmtoolsd.exe'
filter_optional_procexp:
SourceImage|endswith:
- '\PROCEXP64.EXE'
- '\PROCEXP.EXE'
GrantedAccess: '0x40'
filter_optional_handle:
SourceImage|endswith:
- '\handle.exe'
- '\handle64.exe'
GrantedAccess: '0x40'
filter_optional_nextron:
SourceImage|endswith:
- '\aurora.exe'
- '\thor.exe'
- '\thor64.exe'
GrantedAccess: '0x40'
filter_optional_webex:
SourceImage|endswith: '\WebexHost.exe'
GrantedAccess: '0x401'
filter_optional_steam:
SourceImage|contains: '\Steam\steamapps'
condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate security agents, antivirus software, and debugging tools troubleshooting system processes.
level: high
