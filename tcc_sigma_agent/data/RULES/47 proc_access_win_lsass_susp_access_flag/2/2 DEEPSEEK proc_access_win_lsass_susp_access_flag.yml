title: LSASS Credential Dumping via Suspicious GrantedAccess
id: d4e5f6a7-b8c9-40d1-92e3-4a5b6c7d8e9f
status: experimental
description: Detects process access requests to LSASS with GrantedAccess flags consistent with credential dumping tools (e.g., Mimikatz), indicating potential credential theft.
references:
    - https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
    - https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
    - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
    - https://web.archive.org/web/20230420013146/http://security-research.dyndns.org/pub/slides/FIRST2017/FIRST-2017_Tom-Ueltschi_Sysmon_FINAL_notes.pdf
author: Senior Threat Detection Engineer
date: 2026-06-08
logsource:
    product: windows
    category: process_access
detection:
    selection_target:
        TargetImage|endswith: '\lsass.exe'
    selection_access:
        GrantedAccess|endswith:
            # Low-byte patterns: 0x30, 0x50, 0x70, 0x90, 0xB0, 0xD0, 0xF0 and variants with 8/A
            - '30'
            - '50'
            - '70'
            - '90'
            - 'b0'
            - 'd0'
            - 'f0'
            - '38'
            - '58'
            - '78'
            - '98'
            - 'b8'
            - 'd8'
            - 'f8'
            - '3a'
            - '5a'
            - '7a'
            - '9a'
            - 'ba'
            - 'da'
            - 'fa'
        GrantedAccess|startswith:
            # High masks: 0x100000, 0x1f0fff family, 0x1418, 0x1438, 0x143a, 0x40
            - '0x100000'
            - '0x1f0fff'
            - '0x1f1fff'
            - '0x1f2fff'
            - '0x1f3fff'
            - '0x1418'
            - '0x1438'
            - '0x143a'
            - '0x40'
    filter_main_system_paths:
        SourceImage|contains:
            - '\System32\'
            - '\SysWOW64\'
            - '\Program Files\'
            - '\Program Files (x86)\'
    filter_main_defender:
        - SourceImage|endswith: '\MsMpEng.exe'
        - CallTrace|contains|all:
            - '\ProgramData\Microsoft\Windows Defender\Definition Updates\'
            - '\mpengine.dll'
        - GrantedAccess|startswith: '0x1418'
        - CallTrace|contains:
            - 'MpClient.dll'
            - 'mprtp.dll'
    filter_main_explorer:
        SourceImage|endswith: '\explorer.exe'
        GrantedAccess|startswith: '0x401'
    filter_optional_malwarebytes:
        SourceImage|endswith:
            - '\mbupdatr.exe'
            - '\MBAMInstallerService.exe'
        GrantedAccess|startswith: '0x40'
    filter_optional_vscode:
        SourceImage|endswith: '\Code.exe'
        GrantedAccess|startswith: '0x40'
    filter_optional_vmware:
        SourceImage|endswith: '\vmtoolsd.exe'
        GrantedAccess|startswith: '0x40'
    filter_optional_procexp:
        SourceImage|endswith:
            - '\PROCEXP64.exe'
            - '\PROCEXP.exe'
        GrantedAccess|startswith: '0x40'
    filter_optional_handle:
        SourceImage|endswith:
            - '\handle64.exe'
            - '\handle.exe'
        GrantedAccess|startswith: '0x40'
    filter_optional_aurora:
        SourceImage|endswith:
            - '\aurora.exe'
            - '\thor.exe'
        GrantedAccess|startswith: '0x40'
    filter_optional_webex:
        SourceImage|endswith: '\WebexHost.exe'
        GrantedAccess|startswith: '0x401'
    filter_optional_steam:
        SourceImage|contains: '\Steam\steamapps\'
    condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
    - Legitimate security software (AV/EDR) accessing LSASS for monitoring (excluded where possible)
    - System processes like explorer.exe (excluded)
    - Third-party applications with legitimate need (excluded via optional filters)
level: critical
tags:
    - attack.credential_access
    - attack.t1003
    - attack.t1003.001
