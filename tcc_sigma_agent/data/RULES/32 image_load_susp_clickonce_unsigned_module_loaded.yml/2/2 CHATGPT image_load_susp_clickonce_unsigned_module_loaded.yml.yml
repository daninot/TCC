title: ClickOnce Loaded Unsigned Or Expired Module
id: c5d8b4a1-7c0e-4a6f-8d2a-1e7f9b3c2d44
status: experimental
description: Detects a module loaded by a ClickOnce application from the ClickOnce deployment directory when the module is unsigned or has an expired signature, which may indicate abuse of ClickOnce trusted execution to load malicious DLLs.
references:

* [https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5](https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5)
  author: OpenAI
  date: 2026-06-06
  tags:
* attack.defense_evasion
* attack.t1553.005
  logsource:
  product: windows
  category: image_load
  detection:
  selection_path:
  ImageLoaded|contains: '\AppData\Local\Apps\2.0'
  selection_signature_unsigned:
  Signed: false
  selection_signature_expired:
  SignatureStatus: Expired
  condition: selection_path and 1 of selection_signature_*
  falsepositives:
* Legitimate ClickOnce application activity
* Benign third-party software with unsigned or expired components
  level: high

