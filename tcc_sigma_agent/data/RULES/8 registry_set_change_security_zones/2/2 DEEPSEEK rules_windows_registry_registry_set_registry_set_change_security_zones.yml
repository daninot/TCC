title: Trusted Sites Zone Domain Modification via Registry
id: d88d0ab2-e696-4d40-a2ed-9790064e66b4
status: experimental
description: Detects modifications to the Windows Registry that add or alter entries under the ZoneMap\Domains key, used to map domains to security zones. Adversaries may abuse this to add malicious domains to the Trusted Sites zone, bypassing security controls and enabling further attacks.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone
author: Senior Threat Detection Engineer
date: 2026-05-26
tags:
    - attack.defense-evasion
    - attack.persistence
    - attack.t1112
logsource:
    product: windows
    category: registry_set
detection:
    selection:
        TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains\'
    exclude:
        Details|contains:
            - 'DWORD (0x00000000)'  # My Computer zone
            - 'DWORD (0x00000001)'  # Local Intranet zone
        Details:
            - null
            - '(Empty)'
    condition: selection and not exclude
falsepositives:
    - Legitimate system administration or software installations that add domains to security zones other than Trusted Sites.
level: medium
