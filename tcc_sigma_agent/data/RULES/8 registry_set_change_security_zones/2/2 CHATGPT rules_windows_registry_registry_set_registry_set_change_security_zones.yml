title: Suspicious Addition of Domains to Internet Explorer Trusted Sites Zone
id: 8f9c2f87-3f9b-4cf6-8c0d-3d85f9e6b52f
status: stable
description: Detects registry modifications adding domains to the Windows Internet Settings Trusted Sites zone. Adversaries may abuse ZoneMap domain assignments to reduce browser security protections and facilitate execution of malicious content. The rule filters common benign mappings such as My Computer, Local Intranet Zone, and empty assignments.
references:

* [https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone](https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone)
  author: OpenAI
  date: 2026/05/25
  tags:
* attack.defense-evasion
* attack.persistence
* attack.t1112
  logsource:
  product: windows
  category: registry_set
  detection:
  selection:
  TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains'
  filter_benign:
  Details:

  * 'DWORD (0x00000000)'
  * 'DWORD (0x00000001)'
  * '(Empty)'
    condition: selection and not filter_benign
    falsepositives:
* Legitimate enterprise browser hardening or proxy configuration policies.
* Administrative addition of approved internal or partner domains to Trusted Sites.
* Software installers or endpoint management tooling configuring browser trust settings.
  level: medium

