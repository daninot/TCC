title: Kerberos TGS Request Using RC4 Encryption
id: 4b4df834-0f5d-4b0b-aec7-c4a7b9134b0b
status: stable
description: Detects Kerberos Ticket Granting Service (TGS) requests using RC4-HMAC encryption in Zeek kerberos logs, which may indicate Kerberoasting activity. The rule excludes common machine-account activity to reduce false positives from normal enterprise operations.
references:

* [https://adsecurity.org/?p=3458](https://adsecurity.org/?p=3458)
  author: OpenAI
  date: 2026/05/25
  tags:
* attack.credential-access
* attack.t1558.003
  logsource:
  product: zeek
  service: kerberos
  detection:
  selection:
  request_type: 'TGS'
  cipher: 'rc4-hmac'
  success: true
  filter_machine_accounts:
  service|startswith: '$'
  condition: selection and not filter_machine_accounts
  falsepositives:
* Normal enterprise SPN request activity using legacy RC4-compatible service accounts.
* Legacy applications and services that still require RC4 Kerberos encryption.
  level: medium

