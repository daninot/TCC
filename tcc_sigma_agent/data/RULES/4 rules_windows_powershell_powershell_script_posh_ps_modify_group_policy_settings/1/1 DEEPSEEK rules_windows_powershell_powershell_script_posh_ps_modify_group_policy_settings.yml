title: Suspicious Group Policy Registry Modifications
id: 9ab80952-74ee-43da-a98c-1e740a985f28  # Using the atomic test GUID
status: experimental
description: Detects modifications to Group Policy refresh intervals and SmartScreen settings, as used in LockBit Black ransomware and other threats.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1484.001/T1484.001.md
    - https://attack.mitre.org/techniques/T1484/001/
author: Generated from Atomic Red Team Test
date: 2025-01-01
modified: 2025-01-01
tags:
    - attack.t1484.001          # Group Policy Modification
    - attack.defense-evasion
    - attack.privilege-escalation
logsource:
    product: windows
    category: registry_set       # Sysmon Event ID 13 or Windows Security Event ID 4657
detection:
    selection_group_policy:
        TargetObject|contains|all:
            - 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
            - 'GroupPolicyRefreshTime'
    selection_smartscreen:
        TargetObject|contains|all:
            - 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
            - 'EnableSmartScreen'
    condition: 1 of selection_*
falsepositives:
    - Legitimate administrative use of Group Policy Management Console (GPMC)
level: high
