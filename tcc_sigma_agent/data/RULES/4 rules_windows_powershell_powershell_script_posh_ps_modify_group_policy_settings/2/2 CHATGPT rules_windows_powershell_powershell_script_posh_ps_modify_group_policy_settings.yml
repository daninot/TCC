title: PowerShell Modification of Group Policy Security Settings
id: c58e61a4-4c8b-4f92-a3d8-f8f8f7cf9f8d
status: stable
description: Detects PowerShell script block activity modifying Group Policy-related registry settings, including SmartScreen and Group Policy refresh configuration. This detection requires PowerShell Script Block Logging to be enabled and correlates Group Policy system hive registry paths with specific policy value names within the executed script content.
references:

* [https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1484.001/T1484.001.md](https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1484.001/T1484.001.md)
  author: OpenAI
  date: 2026/05/25
  tags:
* attack.defense-evasion
* attack.persistence
* attack.privilege-escalation
* attack.t1484.001
  logsource:
  product: windows
  category: ps_script
  detection:
  selection_registry_path:
  ScriptBlockText|contains:

  * 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
  * 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
  * 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy'
  * 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Group Policy'
    selection_policy_values:
    ScriptBlockText|contains:
  * 'EnableSmartScreen'
  * 'ShellSmartScreenLevel'
  * 'GroupPolicyRefreshTime'
  * 'GroupPolicyRefreshTimeOffset'
    selection_modification_commands:
    ScriptBlockText|contains:
  * 'Set-ItemProperty'
  * 'New-ItemProperty'
  * 'reg add'
    condition: selection_registry_path and selection_policy_values and selection_modification_commands
    falsepositives:
* Legitimate administrative modification of Group Policy settings through PowerShell automation.
* Enterprise endpoint management and hardening scripts.
* Authorized security configuration baselines and compliance tooling.
  level: high

