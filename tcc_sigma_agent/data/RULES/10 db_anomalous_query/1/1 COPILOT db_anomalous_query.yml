title: Webserver Detection - sqlmap Automated SQLi Scanning
id: 1f3b9c2e-2026-0001-0000-000000000001
status: experimental
description: Detects likely use of the sqlmap automated SQL injection tool by matching User-Agent, request URI, and common sqlmap payloads and techniques.
author: Daniela (generated)
date: 2026/05/29
references:
  - https://github.com/sqlmapproject/sqlmap
  - https://highon.coffee/sqlmap-cheat-sheet
logsource:
  product: webserver
  service: httpd
  category: web_access
detection:
  selection_useragent:
    UserAgent|contains:
      - "sqlmap"
      - "sqlmap/"
  selection_uri_sqlmap:
    Uri|contains:
      - "sqlmap"
      - "sqlmap=" 
  selection_payloads:
    Query|contains:
      - "UNION SELECT"
      - "information_schema"
      - "benchmark("
      - "SLEEP("
      - "sleep("
      - "WAITFOR DELAY"
      - "load_file("
      - "into outfile"
      - "group_concat("
      - "concat("
  condition: selection_useragent or selection_uri_sqlmap or selection_payloads
fields:
  - timestamp
  - ClientIP
  - UserAgent
  - HttpMethod
  - Uri
  - Query
  - Status
falsepositives:
  - Authorized vulnerability scans or penetration tests using sqlmap
  - Web application scanners that intentionally include similar payloads for testing
level: high
tags:
  - attack.initial_access
  - attack.t1190
  - tool.sqlmap

