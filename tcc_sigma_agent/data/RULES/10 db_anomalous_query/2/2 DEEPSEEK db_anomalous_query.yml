title: Suspicious SQL Query Keywords
id: a3b7c5d9-1e2f-4a6b-8c7d-9e0f1a2b3c4d
status: experimental
description: Detects SQL queries containing keywords associated with reconnaissance, exfiltration, or destructive activities, such as dropping tables, truncating data, dumping contents, or wildcard selection. Requires SQL query logging to be enabled.
references:
  - https://github.com/sqlmapproject/sqlmap
author: Senior Threat Detection Engineer
date: 2026-05-29
tags:
  - attack.initial-access
  - attack.exfiltration
  - attack.impact
  - attack.t1190
  - attack.t1041
  - attack.t1485
logsource:
  category: database
detection:
  keywords:
    - drop
    - truncate
    - dump
    - select \*
  condition: keywords
falsepositives:
  - Legitimate database maintenance operations (e.g., dropping temporary tables, truncating logs)
  - Vulnerability scanners or authorized penetration testing
  - Administrative scripts performing routine clean-up tasks
level: medium
