title: Huawei BGP Authentication Failure
id: 5b7d6091-a12b-4cd3-90be-db19f4a2da5a
status: stable
description: Detects authentication failures on the Border Gateway Protocol (BGP) service of a Huawei network device, which can indicate brute-force or routing manipulation attempts. This rule requires Huawei BGP logs to be enabled and ingested into the log management system.
references:

* [https://www.blackhat.com/presentations/bh-usa-03/bh-us-03-convery-franz-v3.pdf](https://www.blackhat.com/presentations/bh-usa-03/bh-us-03-convery-franz-v3.pdf)
author: Senior Threat Detection Engineer
date: 2026/05/26
tags:
* attack.initial_access
* attack.credential_access
* attack.persistence
* attack.t1110
logsource:
product: huawei
service: bgp
detection:
keywords|all:
* 'BGP'
* 'authentication failed'
condition: keywords
falsepositives:


* Legitimate network configuration errors, such as mismatched MD5 authentication keys or passwords between BGP peers during deployment or maintenance.
level: low
