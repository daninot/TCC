title: The rise of TeleBots: Analyzing disruptive KillDisk attacks

description: ESET's Anton Cherepanov analyzes the work of TeleBots, a malicious toolset that was used in focused cyberattacks against targets in Ukraine's financial sector.

references:
  - https://www.welivesecurity.com/2016/12/13/rise-telebots-analyzing-disruptive-killdisk-attacks/

detection:
  selection:
    process:
      - path: C:\Windows\System32\svchost.exe
        command_line: '*api.telegram.org/bot*'
      - path: C:\Windows\System32\svchost.exe
        command_line: '*GetMe*'

rules:
