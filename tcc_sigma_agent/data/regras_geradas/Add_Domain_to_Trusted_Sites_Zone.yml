title: Add Domain to Trusted Sites Zone
id: 9c3f2a1b-5d4e-42c8-b0ad-fc6d1c6d9cde
status: test
description: Detects registry modifications that add domains to the Trusted Sites zone
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone
author: frack113
date: 2023-08-17
modified: 2023-08-17
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains\'
    filter:
        not:
            Details: '(Empty), DWORD (0x00000000), DWORD (0x00000001)'
    condition: selection and not 1 of filter
falsepositives:
    - Legitimate admin script
level: medium