title: Kubernetes Secret Modification Or Deletion
id: 9c2f7b8e-3e7a-4b62-9f0e-7b3d4a1c2f8a
status: experimental
description: Detects Kubernetes audit log events targeting the secrets resource with mutating API verbs, which may indicate credential theft, malicious secret planting, or destructive activity.
references:

* [https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/](https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/)
* [https://commandk.dev/blog/guide-to-audit-k8s-secrets-for-compliance/](https://commandk.dev/blog/guide-to-audit-k8s-secrets-for-compliance/)
  author: OpenAI
  date: 2026-06-03
  tags:
* attack.credential_access
* attack.defense_evasion
* attack.t1552
  logsource:
  product: kubernetes
  service: audit
  detection:
  selection:
  objectRef.resource: secrets
  verb:

  * create
  * update
  * patch
  * delete
  * deletecollection
    condition: selection
    falsepositives:
* Authorized secret lifecycle management
* Application deployments and rotation jobs
* Infrastructure automation and compliance tooling
  level: high

