title: Kubernetes Secret Modification or Deletion
id: d52e5a31-64d1-4be3-b789-20b1e1cd7341
status: stable
description: Detects creation, modification, or deletion of Kubernetes Secrets. Attackers with sufficient RBAC permissions may manipulate secrets to steal credentials, introduce malicious values, or cover their tracks.
references:

* [https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/](https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/)
* [https://commandk.dev/blog/guide-to-audit-k8s-secrets-for-compliance/](https://commandk.dev/blog/guide-to-audit-k8s-secrets-for-compliance/)
author: Senior Threat Detection Engineer
date: 2026/06/04
tags:
* attack.credential_access
* attack.defense_evasion
* attack.impact
* attack.t1555
logsource:
product: kubernetes
service: audit
detection:
selection:
objectRef.resource: 'secrets'
verb:
* 'create'
* 'update'
* 'patch'
* 'delete'
* 'deletecollection'
condition: selection
falsepositives:


* Automated deployment systems, continuous integration/continuous deployment (CI/CD) pipelines, Kubernetes operators, or cluster administrators performing authorized secret updates and rotations.
level: medium
