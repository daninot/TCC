title: Windows System Binary Execution From Unusual Location
id: b349f82d-1a2c-493e-bd9f-2a1748291a99
status: experimental
description: |
  Detects the execution of core Windows system utilities (such as cmd.exe or powershell.exe) from non-standard, unusual, or world-writable paths. 
  Adversaries copy legitimate system binaries to arbitrary paths to masquerade malicious activities, evade path-focused detection engineering, or bypass application whitelisting limits.
author: Gemini
date: 2026/06/08
references:
    - https://twitter.com/ffforward/status/1481672378639912960
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1036/T1036.md#atomic-test-1---system-file-copied-to-unusual-location
tags:
    - attack.defense_evasion
    - attack.t1036.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\calc.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\regsrv32.exe'
            - '\rundll32.exe'
    filter_legitimate_paths:
        Image|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\Windows\WinSxS\'
    condition: selection_image and not filter_legitimate_paths
falsepositives:
    - Legacy, proprietary, or poorly developed commercial enterprise software suites that deploy localized copies of native command-line shells within their application folders.
    - Automated administrative scripting toolkits that pack standalone utility binaries inside specific staging shares.
level: high
