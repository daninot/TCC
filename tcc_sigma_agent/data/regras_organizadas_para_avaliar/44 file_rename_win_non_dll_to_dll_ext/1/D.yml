title: System Binary Executed From Non-System Location
id: 8f5c0a9d-2f61-4f57-b4c6-6c9f0f6e4d41
status: experimental
description: Detects execution of a Windows system binary from a non-standard directory after being copied from System32 or SysWOW64, a technique associated with ATT&CK T1036 Masquerading.
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1036/T1036.md
  - https://attack.mitre.org/techniques/T1036/
author: OpenAI
date: 2026-06-08
tags:
  - attack.defense_evasion
  - attack.t1036
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\cscript.exe'
      - '\wscript.exe'
  filter_system_paths:
    Image|contains:
      - '\Windows\System32\'
      - '\Windows\SysWOW64\'
      - '\Windows\WinSxS\'
  condition: selection_img and not filter_system_paths
falsepositives:
  - Administrator troubleshooting activities
  - Software packaging or application virtualization solutions
  - Legitimate copies of Windows binaries used by enterprise software
level: medium
