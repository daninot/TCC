title: Zeek Kerberos TGS Request Using RC4 Encryption
id: a24be982-f5c7-4fc9-b687-beee54f3b890
status: stable
description: Detects Kerberos Ticket-Granting Service (TGS) requests using the weak RC4 encryption algorithm from Zeek network logs, which can indicate a Kerberoasting attack.
references:

* [https://adsecurity.org/?p=3458](https://adsecurity.org/?p=3458)
author: Senior Threat Detection Engineer
date: 2026/05/25
tags:
* attack.credential_access
* attack.t1558.003
logsource:
product: zeek
service: kerberos
detection:
selection:
request_type: TGS
cipher: rc4-hmac
exclusion:
client|endswith: '$'
condition: selection and not exclusion
falsepositives:
* Normal enterprise SPN activity involving legacy systems or applications that require fallback to RC4 encryption.
level: medium
