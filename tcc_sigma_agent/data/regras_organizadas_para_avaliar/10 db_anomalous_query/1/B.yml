title: Default SQLMap Automated Assessment Tool Detection
id: 8f2d5e23-7db1-4c12-bdba-39ab6d09fe9a
status: experimental
description: Detects inbound web traffic generated by the default configuration of the sqlmap penetration testing tool. This rule targets the default User-Agent string utilized by the framework during automated SQL injection discovery and exploitation phases.
references:
    - https://github.com/sqlmapproject/sqlmap
author: Security Operations Center
date: 2026/05/29
tags:
    - attack.initial_access
    - attack.reconnaissance
    - attack.t1595.002 # Active Scanning: Vulnerability Scanning
    - attack.t1190 # Exploit Public-Facing Application
logsource:
    category: webserver
detection:
    selection:
        - c-user-agent|contains: 'sqlmap/'
        - http_user_agent|contains: 'sqlmap/'
    condition: selection
falsepositives:
    - Authorized vulnerability assessment scans, continuous security monitoring solutions, or internal penetration testing activities where the default user-agent has not been modified.
level: high
