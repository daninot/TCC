title: MacOS Python PTH File Creation
id: a3b2c1d4-e5f6-47a8-98b7-c6d5e4f3a2b1
status: experimental
description: Detects the creation of a Python path configuration file (.pth) in macOS Python library folders. These files are executed at every Python startup (3.5+) regardless of import, enabling code execution and persistence. Observed in exploitation of CVE-2024-3400 (Palo Alto GlobalProtect).
references:
- [https://www.volexity.com/blog/2024/04/12/zero-day-exploitation-of-unauthenticated-remote-code-execution-vulnerability-in-globalprotect-cve-2024-3400/](https://www.volexity.com/blog/2024/04/12/zero-day-exploitation-of-unauthenticated-remote-code-execution-vulnerability-in-globalprotect-cve-2024-3400/)
- [https://www.virustotal.com/gui/file/3de2a4392b8715bad070b2ae12243f166ead37830f7c6d24e778985927f9caac](https://www.virustotal.com/gui/file/3de2a4392b8715bad070b2ae12243f166ead37830f7c6d24e778985927f9caac)
- [https://docs.python.org/3/library/site.html](https://docs.python.org/3/library/site.html)
author: Senior Threat Detection Engineer
date: 2026/06/07
tags:
- attack.persistence
- attack.t1546
- cve.2024.3400
logsource:
product: macos
category: file_event
detection:
selection_path:
TargetFilename|re: '(?i).*/lib/python3.([5-9]|[1-9][0-9])/site-packages/.*'
selection_ext:
TargetFilename|endswith: '.pth'
condition: selection_path and selection_ext
falsepositives:
- Legitimate installation of Python packages that use .pth files for namespace packages or path configuration.
level: medium
