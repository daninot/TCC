title: Python PTH File Creation in macOS Site-Packages
id: 7c7f5f10-8db7-4f06-b7fb-1f9fb4f1f57d
status: experimental
description: Detects creation of Python .pth files in macOS Python site-packages directories for Python 3.5+; these files are processed at startup and can be abused for code execution or persistence.
logsource:
product: macos
category: file_event
detection:
selection_path:
TargetFilename|re: '(?i)^(?:/Library/Frameworks/Python.framework/Versions/3.(?:[5-9]|[1-9]\d)/lib/python3.(?:[5-9]|[1-9]\d)|/Users/[^/]+/Library/Python/3.(?:[5-9]|[1-9]\d)/lib/python(?:3.(?:[5-9]|[1-9]\d))?)/site-packages/'
selection_ext:
TargetFilename|endswith: '.pth'
condition: selection_path and selection_ext
falsepositives:

* Legitimate Python package installation or maintenance activity
  level: high

