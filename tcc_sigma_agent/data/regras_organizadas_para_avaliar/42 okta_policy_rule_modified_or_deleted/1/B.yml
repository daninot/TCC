title: Okta Custom Admin Role Change
id: 0f3c3c8d-4f33-4b91-9c6a-8cf2b8e7b6f1
status: experimental
description: Detects creation, deletion, or modification of custom admin roles in Okta System Log events.
references:
  - https://developer.okta.com/docs/reference/api/system-log/
  - https://developer.okta.com/docs/reference/api/event-types/
author: OpenAI
date: 2026-06-07
logsource:
  category: application
detection:
  selection:
    eventType:
      - iam.role.create
      - iam.role.delete
      - iam.role.permissions.add
      - iam.role.permissions.delete
      - iam.role.update
  condition: selection
falsepositives:
  - Legitimate administrative role lifecycle changes
  - Approved permission adjustments during access reviews or migrations
level: high
tags:
  - attack.privilege_escalation
  - attack.persistence
  - attack.t1098
