title: Linux Doas Configuration File Creation
id: bf5a8f2c-63da-47b1-8b43-22876a4df8e5
status: stable
description: Detects the creation of the doas configuration file on a Linux host. Doas is a minimal alternative to sudo, and the creation of its configuration file may indicate an adversary establishing persistent or unauthorized privilege escalation capabilities.
references:

* [https://research.splunk.com/endpoint/linux_doas_conf_file_creation/](https://research.splunk.com/endpoint/linux_doas_conf_file_creation/)
* [https://www.makeuseof.com/how-to-install-and-use-doas/](https://www.makeuseof.com/how-to-install-and-use-doas/)
author: Senior Threat Detection Engineer
date: 2026/06/04
tags:
* attack.privilege_escalation
* attack.t1548.003
logsource:
product: linux
category: file_event
detection:
selection:
TargetFilename|endswith: '/etc/doas.conf'
condition: selection
falsepositives:
* Legitimate installation and configuration of doas by a system administrator as an alternative to sudo.
level: medium
