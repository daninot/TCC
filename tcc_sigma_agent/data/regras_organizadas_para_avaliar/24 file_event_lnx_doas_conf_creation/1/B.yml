title: Linux Doas Configuration File Creation
id: 3c5e81f2-91d4-4b51-9be4-8aef53cfb162
status: experimental
description: Detects the creation or modification of the 'doas.conf' configuration file on Linux. The 'doas' utility is a minimalist alternative to 'sudo' that allows authorized users to execute commands as root. Attackers may install doas or modify its configuration file to establish stealthy persistence or achieve privilege escalation.
references:
    - https://research.splunk.com/endpoint/linux_doas_conf_file_creation/
    - https://www.makeuseof.com/how-to-install-and-use-doas/
author: Security Operations Center
date: 2026/06/04
tags:
    - attack.privilege_escalation
    - attack.persistence
    - attack.t1548.001 # Abuse Privilege Escalation Mechanism: Sudo and Sudo Caching
logsource:
    product: linux
    category: file_event
detection:
    selection:
        TargetFilename:
            - '/etc/doas.conf'
            - '/usr/local/etc/doas.conf'
    condition: selection
falsepositives:
    - Legitimate system administrators installing or updating the doas package to replace or augment sudo configurations.
    - Automated configuration management tools (e.g., Ansible, Puppet, Chef, SaltStack) deploying standard system baseline files.
level: medium
