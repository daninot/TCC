title: PowerShell Remote Thread Creation
id: 2d8f7c6a-5b1e-4c3f-9a7b-1c2e4d6f8a90
status: experimental
description: Detects remote thread creation from PowerShell into another process, which may indicate code injection or process migration. Excludes known benign activity when PowerShell is launched by the Windows compatibility telemetry runner.
references:

* [https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse](https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse)
  author: OpenAI
  date: 2026-06-05
  tags:
* attack.execution
* attack.t1055
  logsource:
  product: windows
  category: create_remote_thread
  detection:
  selection:
  SourceImage|endswith:

  * '\powershell.exe'
  * '\pwsh.exe'
    filter_main_compattelrunner:
    ParentImage|endswith: '\CompatTelRunner.exe'
    condition: selection and not 1 of filter_main_*
    falsepositives:
* Legitimate administrative scripting and automation
* Security tooling that injects threads from PowerShell for monitoring or response
  level: high
