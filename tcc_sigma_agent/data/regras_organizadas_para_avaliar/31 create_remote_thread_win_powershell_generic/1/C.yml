title: PowerShell bXOR Obfuscation in Classic Logs
id: 1c2d8d8a-9e0f-4e6f-8e1a-3e8b9f7d2c4a
status: test
description: Detects PowerShell Classic logging events that contain the bXOR operator, which is commonly used as an obfuscation technique.
references:
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
  - https://github.com/SigmaHQ/sigma/blob/master/rules-threat-hunting/windows/powershell/powershell_classic/posh_pc_bxor_operator_usage.yml
author: OpenAI
date: 2026-06-05
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1027
logsource:
  product: windows
  category: ps_classic_start
detection:
  selection:
    Data|contains|all:
      - 'HostName=ConsoleHost'
      - ' -bxor '
  condition: selection
fields:
  - Data
  - User
  - HostName
  - ProcessId
  - Computer
falsepositives:
  - Legitimate scripts using the PowerShell bitwise XOR operator
level: low
