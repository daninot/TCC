title: Executable Download via WebDAV
id: 8d1b8c1d-5d5b-4a7d-9b2f-0f8f1f8b9c2e
status: experimental
description: Detects executable downloads over WebDAV in Zeek HTTP logs by combining WebDAV-specific indicators with executable MIME type or executable file extensions. This technique has been observed in APT29 activity to blend malicious binary delivery with legitimate file-sharing traffic.
references:

* [http://carnal0wnage.attackresearch.com/2012/06/webdav-server-to-download-custom.html](http://carnal0wnage.attackresearch.com/2012/06/webdav-server-to-download-custom.html)
* [https://github.com/OTRF/detection-hackathon-apt29](https://github.com/OTRF/detection-hackathon-apt29)
  author: OpenAI
  date: 2026-06-06
  tags:
* attack.t1105
* attack.command_and_control
  logsource:
  product: zeek
  service: http
  detection:
  selection_webdav:
  user_agent|contains: 'WebDAV'
  uri|contains: 'webdav'
  selection_executable:
  resp_mime_types|contains: 'dosexec'
  uri|endswith:

  * '.exe'
  * '.dll'
  * '.scr'
  * '.com'
  * '.bat'
  * '.cmd'
  * '.ps1'
  * '.vbs'
  * '.vbe'
  * '.js'
  * '.jse'
  * '.hta'
    condition: selection_webdav and selection_executable
    falsepositives:
* Legitimate WebDAV file sharing or software distribution
* Administrative download activity from internal WebDAV servers
  level: medium

