title: WebDAV Client Execution via Rundll32
id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
status: test
description: Detects svchost.exe spawning rundll32.exe with davclnt.dll,DavSetCookie, which may indicate WebDAV-based exfiltration or code execution from a WebDAV server.
references:
  - https://github.com/OTRF/detection-hackathon-apt29/issues/17
  - https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/7.B.4_C10730EA-6345-4934-AA0F-B0EFCA0C4BA6.md
author: OpenAI
date: 2026-06-06
tags:
  - attack.exfiltration
  - attack.t1048.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\svchost.exe'
  selection_img:
    Image|endswith: '\rundll32.exe'
  selection_orig:
    OriginalFileName: RUNDLL32.EXE
  selection_cli:
    CommandLine|contains: 'C:\windows\system32\davclnt.dll,DavSetCookie'
  condition: selection_parent and (selection_img or selection_orig) and selection_cli
falsepositives:
  - Unknown
level: medium
