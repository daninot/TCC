title: Internet Explorer ZoneMap Trusted Sites Domain Added
id: 8e2a9c2e-3b91-4f8d-9d5f-6a7c1d4b9e11
status: experimental
description: Detects registry modifications that add domains to Internet Explorer ZoneMap Domains, potentially adding attacker-controlled sites to trusted browser zones. Excludes legitimate zone assignments for My Computer (0), Local Intranet (1), and empty values.
references:

* [https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone](https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone)
* [https://learn.microsoft.com/en-us/troubleshoot/developer/browsers/security-privacy/ie-security-zones-registry-entries](https://learn.microsoft.com/en-us/troubleshoot/developer/browsers/security-privacy/ie-security-zones-registry-entries)
  author: OpenAI
  date: 2026-06-02
  tags:
* attack.defense-evasion
* attack.persistence
* attack.t1112
  logsource:
  product: windows
  category: registry_set
  detection:
  selection:
  TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains'
  filter_legitimate:
  Details:

  * 'DWORD (0x00000000)'
  * 'DWORD (0x00000001)'
  * ''
    condition: selection and not filter_legitimate
    falsepositives:
* Administrative configuration of browser security zones
* Enterprise software adding approved domains to Trusted Sites
  level: medium

