title: Registry Modification - Add Domain to Trusted Sites Zone (T1112)
id: b3d6f9a4-4d1e-11ef-9a2d-0242ac120002
status: experimental
description: Detects registry modifications that add domains to the Trusted Sites zone in Internet Explorer / Windows, which may indicate persistence or defense evasion.
author: Copilot
date: 2026/05/26
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone
  - https://learn.microsoft.com/en-us/troubleshoot/developer/browsers/security-privacy/ie-security-zones-registry-entries
logsource:
  product: windows
  service: security
  category: registry
detection:
  selection_trusted_sites:
    EventID: 4657   # Registry value modified
    TargetObject|contains: "\\Software\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\Domains\\"
    Details|contains: "2"   # Zone ID 2 = Trusted Sites
  condition: selection_trusted_sites
fields:
  - timestamp
  - EventID
  - SubjectUserName
  - SubjectDomainName
  - TargetObject
  - Details
falsepositives:
  - Legitimate administrative configuration of trusted domains
  - Enterprise GPOs managing browser security zones
level: high
tags:
  - attack.defense_evasion
  - attack.persistence
  - attack.t1112

