title: Suspicious Tool Execution Detected from JPCERT/CC Tool Analysis
id: 11111111-1111-1111-1111-111111111111
status: test
description: Detects execution of tools commonly used by attackers for lateral movement, credential dumping, or information discovery based on JPCERT/CC's Tool Analysis Result Sheet.
references:
  - https://www.jpcert.or.jp/english/pub/sr/ir_research.html
  - https://jpcertcc.github.io/ToolAnalysisResultSheet
author: JPCERT/CC (Original), Sigma Rule Generator
date: 2017-12-05
tags:
  - attack.lateral-movement
  - attack.credential-access
  - attack.discovery
  - attack.t1021
  - attack.t1003
  - attack.t1087
logsource:
  product: windows
  service: security
detection:
  selection:
    - 'EventID: 4688'
    - 'ProcessName|endswith':
        - '\mimikatz.exe'
        - '\pwdump.exe'
        - '\wce.exe'
        - '\ntdsutil.exe'
        - '\vssadmin.exe'
        - '\csvde.exe'
        - '\ldifde.exe'
        - '\dsquery.exe'
        - '\dcdiag.exe'
        - '\nltest.exe'
        - '\nmap.exe'
        - '\PsExec.exe'
        - '\schtasks.exe'
        - '\wmic.exe'
        - '\net.exe'
        - '\net1.exe'
        - '\sdelete.exe'
        - '\timestomp.exe'
        - '\wevtutil.exe'
  condition: selection
falsepositives:
  - Legitimate administrative activities by system administrators using these tools.
level: medium
