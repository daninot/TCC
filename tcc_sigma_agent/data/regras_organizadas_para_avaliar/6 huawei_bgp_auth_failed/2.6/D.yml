title: Huawei BGP Authentication Failure
id: 5f7f5f2c-7d74-4db8-a3ec-0dc54f4b2b89
status: stable
description: Detects Huawei BGP authentication failure messages in unstructured network device logs. Repeated BGP authentication failures may indicate brute-force attempts or unauthorized efforts to manipulate routing relationships. Huawei BGP logging must be enabled and ingested for this detection to function correctly.
references:

* [https://www.blackhat.com/presentations/bh-usa-03/bh-us-03-convery-franz-v3.pdf](https://www.blackhat.com/presentations/bh-usa-03/bh-us-03-convery-franz-v3.pdf)
  author: OpenAI
  date: 2026/05/25
  tags:
* attack.initial-access
* attack.credential-access
* attack.persistence
* attack.t1110
  logsource:
  product: huawei
  service: bgp
  detection:
  keywords:
  message|all:

  * 'BGP'
  * 'authentication failed'
    condition: keywords
    falsepositives:
* BGP neighbor authentication mismatches caused by configuration drift or incorrect shared secrets.
* Temporary routing peer instability during maintenance or key rotation activities.
  level: medium

