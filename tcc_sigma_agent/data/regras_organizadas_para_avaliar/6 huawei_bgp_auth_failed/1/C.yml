title: Suspicious IPv6 Tunneling Usage (Covert Channel)
id: 5a9c2d3e-4d1e-11ef-9a2d-0242ac120002
status: experimental
description: Detects potential abuse of IPv6 tunneling mechanisms (Teredo, ISATAP, 6to4) that can be used as covert channels to bypass security controls.
author: Copilot
date: 2026/05/26
references:
  - https://www.blackhat.com/presentations/bh-usa-03/bh-us-03-convery-franz-v3.pdf
logsource:
  product: windows
  service: system
  category: network_connection
detection:
  selection_tunnel_processes:
    Image|endswith:
      - "\\teredo.exe"
      - "\\isatap.exe"
      - "\\6to4svc.exe"
  selection_event_ids:
    EventID:
      - 5156   # Windows Filtering Platform permitted connection
      - 5157   # Windows Filtering Platform blocked connection
  condition: selection_tunnel_processes and selection_event_ids
fields:
  - timestamp
  - EventID
  - Image
  - SourceIp
  - DestinationIp
  - Protocol
falsepositives:
  - Legitimate IPv6 transition use in enterprise networks
  - Testing or lab environments enabling tunneling for compatibility
level: high
tags:
  - attack.defense_evasion
  - attack.command_and_control
  - attack.t1090.003

