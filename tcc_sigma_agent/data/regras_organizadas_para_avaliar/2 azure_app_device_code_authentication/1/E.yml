title: Applications Using ROPC Authentication Flow
id: 55695bc0-c8cf-461f-a379-2535f563c854
status: test
description: Detects when an application uses the Resource Owner Password Credentials (ROPC) authentication flow in Microsoft Entra ID, which is considered insecure and should be avoided.
references:
  - https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications#application-authentication-flows
author: Mark Morowczynski '@markmorow', Bailey Bercik '@baileybercik'
date: 2022-06-01
tags:
  - attack.stealth
  - attack.t1078
  - attack.persistence
  - attack.privilege-escalation
  - attack.initial-access
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    properties.message: ROPC
  condition: selection
falsepositives:
  - Applications that are being used as part of automated testing or a legacy application that cannot use any other modern authentication flow.
level: medium
