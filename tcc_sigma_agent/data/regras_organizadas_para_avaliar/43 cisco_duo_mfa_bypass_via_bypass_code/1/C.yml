title: Duo Bypass Code Creation via Admin API
id: 7a5d2f8b-1f64-4c4d-9c9d-1d3f2d2e7d31
status: experimental
description: Detects creation of Duo bypass codes through the Admin API endpoint used to generate temporary user bypass codes.
references:
  - https://duo.com/docs/adminapi
  - https://help.duo.com/s/article/6327
author: OpenAI
date: 2026-06-07
logsource:
  product: duo
  category: application
  service: adminapi
detection:
  selection_method:
    http.request.method: POST
  selection_endpoint:
    url|re: '^/admin/v1/users/[^/]+/bypass_codes$'
  condition: selection_method and selection_endpoint
falsepositives:
  - Legitimate help desk or break-glass support activity
  - Approved account recovery workflows
  - Administrative testing in non-production environments
level: high
tags:
  - attack.defense_evasion
  - attack.credential_access
  - attack.t1078
