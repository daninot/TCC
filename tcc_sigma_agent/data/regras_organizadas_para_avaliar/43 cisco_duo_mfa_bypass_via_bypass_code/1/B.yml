title: Duo Security Admin Bypass Code Generated
id: c4e2f9d8-3b1a-427c-9a1b-8f5c3e7b4a2d
status: experimental
description: |
  Detects when a Duo administrator generates a temporary or multi-use bypass code for a user.
  Threat actors seek to compromise administrative sessions to generate bypass codes, which allows them to fully circumvent MFA mechanisms and maintain persistence inside targeted user accounts.
author: Gemini
date: 2026/06/08
references:
    - https://duo.com/docs/adminapi#administrator-logs
    - https://help.duo.com/s/article/6327
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1556.006
logsource:
    product: duo
    service: administrator
detection:
    selection:
        action: 'bypass_create'
    condition: selection
falsepositives:
    - Standard helpdesk or IT support operations assisting employees who have lost, locked, or replaced their hardware tokens/mobile devices.
level: medium
