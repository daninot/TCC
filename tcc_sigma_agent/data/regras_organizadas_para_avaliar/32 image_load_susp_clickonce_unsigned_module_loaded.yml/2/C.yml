title: Unsigned or Expired Module Loaded by ClickOnce Application
id: a9b0c1d2-e3f4-5678-abcd-567890123456
status: experimental
description: Detects an unsigned or expired-signature module loaded by a ClickOnce application. Attackers abuse the ClickOnce trusted execution mechanism to load malicious unsigned DLLs while bypassing SmartScreen and other application trust controls.
references:
    - https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5
author: Senior Threat Detection Engineer
date: 2024-01-01
tags:
    - attack.defense_evasion
    - attack.execution
    - attack.t1127
    - attack.t1553.002
logsource:
    product: windows
    category: image_load
detection:
    selection_process:
        ImageLoaded|contains:
            - '\AppData\Local\Apps\2.0\'
    selection_signature:
        Signed:
            - 'false'
        SignatureStatus:
            - 'Expired'
    condition: all of selection_*
falsepositives:
    - Legitimate ClickOnce applications that bundle unsigned third-party libraries
    - Development or testing environments where code signing is not enforced
level: high
