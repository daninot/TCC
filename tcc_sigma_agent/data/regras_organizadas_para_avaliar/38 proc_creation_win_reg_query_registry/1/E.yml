title: Atomic Test T1012 - Query Registry Suspicious Keys
id: b9c8d7e6-f5a4-43b2-81c0-9d8e7f6a5b4c
status: experimental
description: Detects execution of reg.exe with query parameter targeting specific registry keys often used for persistence and system discovery, as performed in Atomic Red Team test T1012.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md
author: Senior Threat Detection Engineer
date: 2026-06-06
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\reg.exe'
        - OriginalFileName: 'reg.exe'
    selection_flag:
        CommandLine|contains: 'query'
    selection_keys:
        CommandLine|contains:
            - 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows'
            - 'HKLM\Software\Microsoft\Windows\CurrentVersion\RunServicesOnce'
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\RunServicesOnce'
            - 'HKLM\Software\Microsoft\Windows\CurrentVersion\RunServices'
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\RunServices'
            - 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Notify'
            - 'HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit'
            - 'HKCU\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell'
            - 'HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell'
            - 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\ShellServiceObjectDelayLoad'
            - 'HKLM\Software\Microsoft\Windows\CurrentVersion\RunOnce'
            - 'HKLM\Software\Microsoft\Windows\CurrentVersion\RunOnceEx'
            - 'HKLM\Software\Microsoft\Windows\CurrentVersion\Run'
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\RunOnce'
            - 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
            - 'HKLM\system\currentcontrolset\services'
    condition: all of selection_*
falsepositives:
    - Legitimate system administration or software installation queries
level: medium
tags:
    - attack.discovery
    - attack.t1012
