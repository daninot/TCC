title: Windows Registry Query Discovery via Reg.exe
id: 7f6d9c3e-4d6b-4d5b-9f1a-3f3c0f4e7c21
status: experimental
description: Detects reg.exe querying Windows registry locations commonly used for discovery, persistence, and system configuration reconnaissance.
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md
author: OpenAI
date: 2026-06-07
tags:
  - attack.discovery
  - attack.t1012
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\reg.exe'
  selection_cmd:
    CommandLine|contains: 'reg query'
  selection_targets_run:
    CommandLine|contains:
      - '\Software\Microsoft\Windows\CurrentVersion\Run'
      - '\Software\Microsoft\Windows\CurrentVersion\RunOnce'
      - '\Software\Microsoft\Windows\CurrentVersion\RunServices'
      - '\Software\Microsoft\Windows\CurrentVersion\RunServicesOnce'
  selection_targets_winlogon:
    CommandLine|contains:
      - '\Software\Microsoft\Windows NT\CurrentVersion\Winlogon'
      - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
      - '\Software\Microsoft\Windows\CurrentVersion\ShellServiceObjectDelayLoad'
  selection_targets_services:
    CommandLine|contains:
      - '\System\CurrentControlSet\Services'
      - '\system\currentcontrolset\services'
  condition: selection_img and selection_cmd and 1 of selection_targets_*
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
  - Computer
falsepositives:
  - Administrative troubleshooting
  - Security validation and incident response
  - Inventory or compliance tooling
level: medium
