title: Registry Reconnaissance via Reg.exe
id: 5c9f1f26-0e1b-4c0e-9a44-2cb24d2c4d3a
status: experimental
description: Detects reg.exe querying sensitive Windows registry locations commonly used to discover persistence mechanisms, services, shell loading settings, policies, and logon configuration.
references:

* [https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md](https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1012/T1012.md)
  author: OpenAI
  date: 2026-06-07
  tags:
* attack.discovery
* attack.t1012
  logsource:
  product: windows
  category: process_creation
  detection:
  selection_process_image:
  Image|endswith: '\reg.exe'
  selection_process_originalfilename:
  OriginalFileName: 'REG.EXE'
  selection_cmd_query:
  CommandLine|contains: ' query '
  selection_sensitive_paths:
  CommandLine|contains:

  * '\Software\Microsoft\Windows\CurrentVersion\Run'
  * '\Software\Microsoft\Windows\CurrentVersion\RunOnce'
  * '\Software\Microsoft\Windows\CurrentVersion\RunServices'
  * '\Software\Microsoft\Windows\CurrentVersion\RunServicesOnce'
  * '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
  * '\Software\Microsoft\Windows\CurrentVersion\ShellServiceObjectDelayLoad'
  * '\Software\Microsoft\Windows NT\CurrentVersion\Winlogon'
  * '\System\CurrentControlSet\Services'
    condition: all of selection_*
    fields:
* Image
* OriginalFileName
* CommandLine
* ParentImage
* User
* Computer
  falsepositives:
* Administrative troubleshooting
* Security validation and incident response
* Inventory or compliance tooling
  level: medium

