title: Suspicious Ruby on Rails ActionController Exception Classes in Application Logs
id: b3c4d5e6-f7a8-9012-bcde-f12345678901
status: experimental
description: Detects suspicious Ruby on Rails exception class names in application logs that may indicate exploitation attempts including CSRF token abuse, cross-origin request forgery, invalid HTTP methods, malformed requests, or missing required parameters.
references:
    - http://edgeguides.rubyonrails.org/security.html
    - http://guides.rubyonrails.org/action_controller_overview.html
    - https://stackoverflow.com/questions/25892194/does-rails-come-with-a-not-authorized-exception
    - https://github.com/rails/rails/blob/cd08e6bcc4cd8948fe01e0be1ea0c7ca60373a25/actionpack/lib/action_dispatch/middleware/exception_wrapper.rb
author: Senior Threat Detection Engineer
date: 2024-01-01
tags:
    - attack.initial_access
    - attack.t1190
    - attack.t1059
logsource:
    product: ruby_on_rails
    category: application
detection:
    keywords:
        - 'ActionController::InvalidAuthenticityToken'
        - 'ActionController::InvalidCrossOriginRequest'
        - 'ActionController::UnknownHttpMethod'
        - 'ActionController::UnknownFormat'
        - 'ActionController::ParameterMissing'
        - 'ActionController::BadRequest'
        - 'ActionController::RoutingError'
        - 'ActionController::MethodNotAllowed'
        - 'ActionController::NotImplemented'
        - 'ActionController::InvalidToken'
        - 'ActionController::RequestForgeryProtection'
    condition: keywords
falsepositives:
    - Legitimate application errors during development or testing
    - Misconfigured clients generating malformed requests
    - Automated scanners performing security assessments in authorized penetration tests
level: medium
