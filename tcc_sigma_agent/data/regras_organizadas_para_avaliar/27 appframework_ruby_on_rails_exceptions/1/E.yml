title: Ruby on Rails Authorization and Request Validation Exceptions
id: 0e7f5f5d-9db8-4f84-b8b0-6b4afdfd3d7d
status: experimental
description: Detects Ruby on Rails exception messages associated with authorization failures, request forgery validation, and routing errors.
references:
  - http://edgeguides.rubyonrails.org/security.html
  - http://guides.rubyonrails.org/action_controller_overview.html
  - https://stackoverflow.com/questions/25892194/does-rails-come-with-a-not-authorized-exception
  - https://github.com/rails/rails/blob/cd08e6bcc4cd8948fe01e0be1ea0c7ca60373a25/actionpack/lib/action_dispatch/middleware/exception_wrapper.rb
author: OpenAI
date: 2026-06-04
tags:
  - attack.initial_access
  - attack.defense_evasion
  - attack.t1110
logsource:
  category: application
detection:
  selection_exception:
    message|contains:
      - 'User::NotAuthorized'
      - 'ActionController::InvalidAuthenticityToken'
      - 'ActionController::RoutingError'
      - 'ActiveRecord::RecordNotFound'
      - 'ActionController::ParameterMissing'
  selection_logger:
    logger|contains:
      - 'rails'
      - 'action_controller'
      - 'action_dispatch'
  condition: selection_exception and 1 of selection_logger*
fields:
  - logger
  - message
  - exception
  - error.class
  - error.message
  - path
  - request_method
  - user_id
falsepositives:
  - Legitimate authorization denials
  - CSRF protection blocking normal browser requests
  - Missing-route probes from health checks or scanners
level: medium
