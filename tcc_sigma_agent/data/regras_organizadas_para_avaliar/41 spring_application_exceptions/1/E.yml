title: Spring Security StrictHttpFirewall Request Rejection
id: b2a1c9e8-7d4f-4a31-9c65-2d8e4f1b5a9c
status: experimental
description: |
  Detects 'RequestRejectedException' events in Spring Boot/Spring Security application logs. 
  This exception is thrown by the StrictHttpFirewall when it intercepts HTTP requests containing potentially malicious elements (e.g., path traversal attempts, double slashes, invalid HTTP methods, or malicious character encodings). A spike in these exceptions indicates active web reconnaissance or exploitation attempts against the application.
author: Gemini
date: 2026/06/07
references:
    - https://docs.spring.io/spring-security/site/docs/current/api/overview-tree.html
    - https://docs.spring.io/spring-security/reference/servlet/exploits/firewall.html
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: application
detection:
    keywords:
        - 'org.springframework.security.web.firewall.RequestRejectedException'
        - 'The request was rejected because the URL contained a potentially malicious String'
        - 'The request was rejected because the URL is not normalized'
        - 'The request was rejected because the HTTP method'
    condition: keywords
falsepositives:
    - Active penetration testing or authorized vulnerability scanning (e.g., Nessus, Burp Suite).
    - Misconfigured reverse proxies or load balancers forwarding poorly formatted requests.
    - Legacy third-party API clients sending non-compliant HTTP requests.
level: medium
