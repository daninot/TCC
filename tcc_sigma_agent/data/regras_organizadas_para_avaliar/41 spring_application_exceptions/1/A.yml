title: Spring Security Authentication or Authorization Exception in Application Logs
id: 3c8d4f3a-8f7b-4fd1-9c9b-0e4f8c1b7f2a
status: experimental
description: Detects Spring Security authentication, authorization, CSRF, or request-rejection exceptions in application logs.
references:
  - https://docs.spring.io/spring-security/site/docs/current/api/overview-tree.html
author: OpenAI
date: 2026-06-07
logsource:
  category: application
detection:
  selection:
    Message|contains:
      - "org.springframework.security."
      - "BadCredentialsException"
      - "AccessDeniedException"
      - "InvalidCsrfTokenException"
      - "MissingCsrfTokenException"
      - "SessionAuthenticationException"
      - "RequestRejectedException"
      - "AuthenticationCredentialsNotFoundException"
      - "InsufficientAuthenticationException"
  condition: selection
falsepositives:
  - Legitimate authentication failures
  - CSRF validation failures during normal application use
  - Misconfigured clients or probes triggering rejected requests
level: medium
tags:
  - attack.initial_access
  - attack.credential_access
