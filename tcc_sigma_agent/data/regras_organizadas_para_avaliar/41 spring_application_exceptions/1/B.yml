title: Suspicious Spring Security Exception
id: 7e8f5a6b-4c3d-4e2f-9a1b-2c3d4e5f6a7b
status: experimental
description: Detects suspicious Spring Security exceptions such as AccessDeniedException, InvalidCsrfTokenException, or InsufficientAuthenticationException, which may indicate exploitation attempts, unauthorized access, or CSRF attacks.
references:
  - https://docs.spring.io/spring-security/site/docs/current/api/overview-tree.html
author: Sigma Rule Generator
date: 2026-06-07
tags:
  - attack.initial-access
  - attack.t1078
  - attack.t1190
  - attack.defense-evasion
  - attack.t1027
  - attack.privilege-escalation
  - attack.t1548
logsource:
  category: application
  product: spring
detection:
  selection:
    - 'AccessDeniedException'
    - 'AuthenticationCredentialsNotFoundException'
    - 'BadCredentialsException'
    - 'CsrfException'
    - 'DisabledException'
    - 'InsufficientAuthenticationException'
    - 'InvalidCsrfTokenException'
    - 'LockedException'
    - 'MissingCsrfTokenException'
    - 'SessionAuthenticationException'
    - 'UsernameNotFoundException'
  condition: selection
falsepositives:
  - Legitimate user authentication failures or expired sessions.
  - Automated security scanning tools.
  - Internal testing with DEBUG-level logging enabled.
level: medium
