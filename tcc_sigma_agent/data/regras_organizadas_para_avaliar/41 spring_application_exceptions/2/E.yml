title: Spring Security Exception Classes in Application Logs
id: 9bbd01fb-5c86-4cb2-8b36-0c7d1d5f1d74
status: experimental
description: Detects Spring Security exception class names in application logs that may indicate unauthorized access attempts, CSRF token abuse, cookie tampering, or rejected malformed requests.
logsource:
product: spring
category: application
detection:
selection:
message|re: '(?i)\b(?:AccessDeniedException|AuthenticationException|AuthenticationCredentialsNotFoundException|BadCredentialsException|InsufficientAuthenticationException|SessionAuthenticationException|CsrfException|InvalidCsrfTokenException|MissingCsrfTokenException|RequestRejectedException|CookieTheftException|InvalidCookieException)\b'
condition: selection
falsepositives:

* Legitimate authentication failures
* Expected CSRF validation failures during testing or misconfiguration
* Benign malformed request handling by the application or framework
  level: medium

