title: Python PEP 249 SQL Exception Classes in Application Logs
id: c1d2e3f4-a5b6-7890-cdef-789012345678
status: experimental
description: Detects Python PEP 249 Database API SQL exception class names in application logs that may indicate SQL injection probing or other database-related exploitation attempts against Python web applications.
references:
    - https://www.python.org/dev/peps/pep-0249/#exceptions
author: Senior Threat Detection Engineer
date: 2024-01-01
tags:
    - attack.initial_access
    - attack.t1190
    - attack.credential_access
    - attack.t1110
logsource:
    product: python
    category: application
detection:
    keywords:
        - 'django.db.utils.IntegrityError'
        - 'django.db.utils.OperationalError'
        - 'django.db.utils.ProgrammingError'
        - 'django.db.utils.DataError'
        - 'django.db.utils.InternalError'
        - 'django.db.utils.NotSupportedError'
        - 'django.db.utils.DatabaseError'
        - 'django.db.utils.InterfaceError'
        - 'sqlalchemy.exc.OperationalError'
        - 'sqlalchemy.exc.ProgrammingError'
        - 'sqlalchemy.exc.IntegrityError'
        - 'sqlalchemy.exc.DataError'
        - 'sqlalchemy.exc.InternalError'
        - 'sqlalchemy.exc.NotSupportedError'
        - 'sqlalchemy.exc.DatabaseError'
        - 'sqlalchemy.exc.InterfaceError'
        - 'sqlite3.OperationalError'
        - 'sqlite3.ProgrammingError'
        - 'sqlite3.IntegrityError'
        - 'sqlite3.DataError'
        - 'sqlite3.InternalError'
        - 'sqlite3.NotSupportedError'
        - 'sqlite3.DatabaseError'
        - 'sqlite3.InterfaceError'
        - 'psycopg2.OperationalError'
        - 'psycopg2.ProgrammingError'
        - 'psycopg2.IntegrityError'
        - 'psycopg2.DataError'
        - 'psycopg2.InternalError'
        - 'psycopg2.NotSupportedError'
        - 'psycopg2.DatabaseError'
        - 'psycopg2.InterfaceError'
        - 'pymysql.OperationalError'
        - 'pymysql.ProgrammingError'
        - 'pymysql.IntegrityError'
        - 'pymysql.DataError'
        - 'pymysql.InternalError'
        - 'pymysql.NotSupportedError'
        - 'pymysql.DatabaseError'
        - 'pymysql.InterfaceError'
        - 'pyodbc.OperationalError'
        - 'pyodbc.ProgrammingError'
        - 'pyodbc.IntegrityError'
        - 'pyodbc.DataError'
        - 'pyodbc.InternalError'
        - 'pyodbc.DatabaseError'
        - 'pyodbc.InterfaceError'
    condition: keywords
falsepositives:
    - Legitimate application database errors caused by schema migrations or misconfigured queries
    - Development and testing environments generating database exceptions during normal operation
    - Automated database maintenance tasks producing transient errors
level: medium
