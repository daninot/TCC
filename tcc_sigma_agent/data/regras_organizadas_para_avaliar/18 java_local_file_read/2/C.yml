title: JVM Local File Read Path Traversal Attempt
id: b9d5f0e1-4c12-4c8d-bd1f-6b2f679fe2c4
status: stable
description: Detects local file read vulnerability exploitation attempts in JVM-based applications where user-controlled input triggers a java.io.FileNotFoundException containing path traversal sequences. This rule requires application error logs to be captured at LOG_LEVEL ERROR or higher.
references:

* [https://www.wix.engineering/post/threat-and-vulnerability-hunting-with-application-server-error-logs](https://www.wix.engineering/post/threat-and-vulnerability-hunting-with-application-server-error-logs)
author: Senior Threat Detection Engineer
date: 2026/06/03
tags:
* attack.initial_access
* attack.t1190
logsource:
product: jvm
category: application
detection:
keywords|all:
* 'java.io.FileNotFoundException'
* '..'
condition: keywords
falsepositives:


* Legitimate administrative or application processes using relative pathing that trigger file-not-found exceptions due to misconfiguration.
level: medium
