title: MSBuild Network Connection to Web Ports
id: b2c3d4e5-f6a7-48b9-0c1d-2e3f4a5b6c7d
status: experimental
description: Detects outbound network connections initiated by msbuild.exe to standard HTTP/HTTPS ports, a technique abused by SilentTrinity and other C2 frameworks to bypass application allow-lists.
references:
    - https://www.blackhillsinfosec.com/my-first-joyride-with-silenttrinity/
author: Senior Threat Detection Engineer
date: 2026-06-08
logsource:
    product: windows
    category: network_connection
detection:
    selection:
        Image|endswith: '\msbuild.exe'
        Initiated: true
        DestinationPort:
            - 80
            - 443
            - 8080
            - 8443
            - 8000
            - 8888
    condition: selection
falsepositives:
    - Legitimate MSBuild usage downloading remote build scripts or packages
level: high
tags:
    - attack.defense_evasion
    - attack.t1127
    - attack.command_and_control
    - attack.t1071.001
