title: SilentTrinity C2 and Post-Exploitation Indicators
id: 2026-000-st-silenttrinity
status: experimental
description: Detects process, file, and network indicators consistent with SilentTrinity implants and teamserver activity: st.py/silenttrinity processes, dynamic .NET scripting artifacts (Naga), long-lived WebSocket/HTTPS C2, and suspicious child processes or DLL loads.
author: Detection Engineer
date: 2026-06-08
references:
  - https://github.com/ye-gxc/SILENTTRINITY
  - https://github.com/byt3bl33d3r/SILENTTRINITY
logsource:
  product: windows,linux
  service: sysmon,process,network
  category: process_creation,network_connection,file_event
detection:
  selection_stager_process:
    EventID: 1
    Image|re:
      - '(?i)\\st\.py$'
      - '(?i)\\silenttrinity(\.exe|\.py)?$'
      - '(?i)\\teamserver(\.py|\.exe)?$'
  selection_python_websocket:
    EventID: 1
    Image|re:
      - '(?i)\\python(\d?\.exe)?$'
    CommandLine|re:
      - '(?i)(websockets|quart|hypercorn|aiohttp|socketio|ws|websocket)'
  selection_dotnet_dlr_load:
    EventID: 7
    Image|re:
      - '(?i)\\.*\.dll$'
    TargetFilename|re:
      - '(?i)naga|boolang|mimikatz|byt3bl33d3r'
  selection_long_lived_ws:
    EventID: 3
    Protocol|contains:
      - "ws"
      - "wss"
    Duration|gt:  "00:05:00"
  selection_https_c2:
    EventID: 3
    DestinationPort:
      - 443
      - 8443
    HttpRequestUri|re:
      - '(?i)/api/|/stager/|/session/|/teamserver|/connect'
    SNI|re:
      - '(?i)teamserver|silenttrinity'
  selection_unusual_child:
    EventID: 1
    ParentImage|re:
      - '(?i)\\python(\.exe)?$'
      - '(?i)\\silenttrinity(\.exe)?$'
    Image|re:
      - '(?i)\\rundll32\.exe$'
      - '(?i)\\regsvr32\.exe$'
      - '(?i)\\mimikatz\.dll$'
  condition: selection_stager_process or selection_python_websocket or selection_dotnet_dlr_load or selection_long_lived_ws or selection_https_c2 or selection_unusual_child
fields:
  - timestamp
  - EventID
  - ComputerName
  - SubjectUserName
  - Image
  - ParentImage
  - CommandLine
  - TargetFilename
  - DestinationIp
  - DestinationPort
  - Protocol
falsepositives:
  - Legitimate development or CI systems running Python web frameworks (quart, aiohttp) or internal WebSocket services.
  - Internal automation that loads .NET scripting engines for valid reasons; whitelist known build/dev hosts.
level: high
tags:
  - attack.command_and_control
  - attack.persistence
  - malware.silenttrinity
  - detection.endpoint
notes: |
  - Tuning: whitelist known dev/test hosts, internal teamservers, and signed binaries; require correlation across process + network + file events to raise confidence.
  - Investigation: collect full process trees, stager files (st.py), loaded DLLs (Naga), TLS metadata (SNI, certs), WebSocket URIs, and any logged teamserver artifacts.
  - Response: isolate hosts with confirmed implants, block C2 endpoints, remove stagers, rotate credentials, and hunt for lateral sessions or additional teamservers.

