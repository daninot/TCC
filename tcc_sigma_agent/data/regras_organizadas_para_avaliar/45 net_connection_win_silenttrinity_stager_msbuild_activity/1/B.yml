title: Potential SILENTTRINITY BYOI Execution Via MSBuild
id: d0d3d52f-c3bb-4a75-8d7c-5f58f47f2e91
status: experimental
description: Detects execution of MSBuild with project files from user-writable locations, a technique commonly used by SILENTTRINITY stagers and other BYOI (Bring Your Own Interpreter) tradecraft to execute .NET code without PowerShell.
references:
  - https://www.blackhillsinfosec.com/my-first-joyride-with-silenttrinity/
  - https://www.blackhillsinfosec.com/webcast-in-depth-silenttrinity-demo-explanation-walkthrough/
author: OpenAI
date: 2026-06-08
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1127.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\MSBuild.exe'
    CommandLine|contains:
      - '\Users\'
      - '\ProgramData\'
      - '\AppData\'
      - '\Temp\'
  condition: selection
falsepositives:
  - Legitimate developer activity
  - Software build pipelines running on endpoints
  - Administrative automation using MSBuild
level: medium
