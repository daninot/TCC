title: Windows Registry Run Key Persistence Modification
id: 8f2d3f4a-5c7e-4d21-9f0e-4b7d1d2d9e11
status: experimental
description: Detects creation or modification of Windows Registry Run and RunOnce persistence keys commonly used for logon autostart execution.
references:
  - https://github.com/last-byte/PersistenceSniper
  - https://www.microsoft.com/en-us/security/blog/2025/03/06/malvertising-campaign-leads-to-info-stealers-hosted-on-github/
  - https://github.com/redcanaryco/atomic-red-team/blob/5ede8f21e42ebe37e0a6eff757dba60bcfa85859/atomics/T1547.001/T1547.001.md
tags:
  - attack.persistence
  - attack.t1547.001
  - attack.defense_evasion
logsource:
  product: windows
  category: registry_set
detection:
  selection_runkeys:
    TargetObject|contains:
      - '\Software\Microsoft\Windows\CurrentVersion\Run\'
      - '\Software\Microsoft\Windows\CurrentVersion\RunOnce\'
      - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run\'
      - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\'
      - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\RunOnce\'
  condition: selection_runkeys
fields:
  - Image
  - TargetObject
  - Details
  - User
  - Computer
falsepositives:
  - Legitimate software auto-start configuration
  - Endpoint management and software deployment tools
  - User-installed applications that persist by design
level: high
