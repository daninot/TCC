title: Malicious File Creation in Windows Startup Folder
id: 4c5e8f1a-921c-4b3d-8e4f-21a3b5c7d8e9
status: stable
description: Detects the creation of potentially malicious script or executable files in the Windows Startup folder, a common persistence technique where files are automatically executed at user login.
references:

* [https://github.com/last-byte/PersistenceSniper](https://github.com/last-byte/PersistenceSniper)
* [https://www.microsoft.com/en-us/security/blog/2025/03/06/malvertising-campaign-leads-to-info-stealers-hosted-on-github/](https://www.microsoft.com/en-us/security/blog/2025/03/06/malvertising-campaign-leads-to-info-stealers-hosted-on-github/)
* [https://github.com/redcanaryco/atomic-red-team/blob/5ede8f21e42ebe37e0a6eff757dba60bcfa85859/atomics/T1547.001/T1547.001.md](https://github.com/redcanaryco/atomic-red-team/blob/5ede8f21e42ebe37e0a6eff757dba60bcfa85859/atomics/T1547.001/T1547.001.md)
author: Senior Threat Detection Engineer
date: 2026/06/05
tags:
* attack.persistence
* attack.t1547.001
logsource:
product: windows
category: file_event
detection:
selection_path:
TargetFilename|contains: '\Microsoft\Windows\Start Menu\Programs\StartUp'
selection_extension:
TargetFilename|endswith:
* '.ps1'
* '.vbs'
* '.js'
* '.bat'
* '.cmd'
* '.hta'
* '.dll'
* '.jar'
* '.exe'
* '.vbe'
* '.jse'
* '.wsf'
* '.lnk'
condition: all of selection_*
falsepositives:


* Legitimate software installations or administrative configurations explicitly adding startup shortcuts or scripts for user convenience.
level: high
