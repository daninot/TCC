title: Suspicious File Creation in Windows Startup Folder
id: c3d4e5f6-a7b8-49c0-1d2e-3f4a5b6c7d8e
status: experimental
description: Detects creation of potentially malicious script or executable files in the Windows Startup folder, a common persistence technique executed at user login, often abused in malvertising and info-stealer campaigns.
references:
    - https://github.com/last-byte/PersistenceSniper
    - https://www.microsoft.com/en-us/security/blog/2025/03/06/malvertising-campaign-leads-to-info-stealers-hosted-on-github/
    - https://github.com/redcanaryco/atomic-red-team/blob/5ede8f21e42ebe37e0a6eff757dba60bcfa85859/atomics/T1547.001/T1547.001.md
author: Senior Threat Detection Engineer
date: 2026-06-05
logsource:
    product: windows
    category: file_event
detection:
    selection_path:
        TargetFilename|contains:
            - '\Startup\'
            - '\Microsoft\Windows\Start Menu\Programs\Startup\'
    selection_ext:
        TargetFilename|endswith:
            - '.ps1'
            - '.psm1'
            - '.psd1'
            - '.vbs'
            - '.vbe'
            - '.js'
            - '.jse'
            - '.bat'
            - '.cmd'
            - '.hta'
            - '.dll'
            - '.jar'
            - '.exe'
            - '.scr'
            - '.com'
            - '.pif'
            - '.gadget'
            - '.wsf'
            - '.wsh'
    condition: selection_path and selection_ext
falsepositives:
    - Legitimate software installations adding shortcuts or scripts to Startup folder
level: high
tags:
    - attack.persistence
    - attack.t1547.001
