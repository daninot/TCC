title: Windows Firewall Allow Rule Added via WmiPrvSE.exe
id: 8e7d6c5b-4a3f-2e1d-9c8b-7a6f5e4d3c2b
status: experimental
description: Detects when a new "Allow" rule is added to the Windows Firewall exception list by the WMI provider host process (WmiPrvSE.exe). Adversaries, including ransomware groups like Rhysida, abuse this to open inbound ports for lateral movement, C2, or data exfiltration by invoking PowerShell cmdlets or WMI CIM classes, causing the change to be performed under WmiPrvSE.exe context.
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md#atomic-test-24---set-a-firewall-rule-using-new-netfirewallrule
  - https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170
  - https://cybersecuritynews.com/rhysida-ransomware-attacking-windows/
author: Senior Threat Detection Engineer
date: 2026-05-26
tags:
  - attack.defense-evasion
  - attack.t1562.004
logsource:
  product: windows
  service: firewall-as
detection:
  selection_event:
    EventID:
      - 2006
  selection_action:
    Action: Allow
  selection_process:
    ModifyingApplication|endswith: \Windows\System32\wbem\WmiPrvSE.exe
  condition: selection_event and selection_action and selection_process
falsepositives:
  - Legitimate administrative scripts or configuration management tools that create firewall allow rules via WMI or PowerShell cmdlets (e.g., New-NetFirewallRule) executed under WmiPrvSE.exe context
level: medium
