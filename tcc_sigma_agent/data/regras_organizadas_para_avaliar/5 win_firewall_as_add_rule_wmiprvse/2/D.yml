title: Firewall Allow Rule Added via WmiPrvSE.EXE  
id: 8d2f1a6b-3c4e-4f7a-9b2d-6a1e5c9d7f42  
status: experimental  
description: Detects when a new "Allow" rule is added to the Windows Firewall exception list by the WMI provider host process (WmiPrvSE.EXE). Adversaries, including ransomware groups such as Rhysida, abuse this technique to open inbound ports for lateral movement, command and control, or data exfiltration.  
references:  
  - [https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md#atomic-test-24---set-a-firewall-rule-using-new-netfirewallrule](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md#atomic-test-24---set-a-firewall-rule-using-new-netfirewallrule)  
  - [https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170](https://malware.news/t/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/72170)  
  - [https://cybersecuritynews.com/rhysida-ransomware-attacking-windows/](https://cybersecuritynews.com/rhysida-ransomware-attacking-windows/)  
author: Senior Threat Detection Engineer  
date: 2026-05-26  
tags:  
  - attack.defense_evasion  
  - attack.persistence  
  - attack.t1562.004  
logsource:  
  product: windows  
  service: firewall  
  category: configuration_change  
detection:  
  selection_event:  
    EventID:  
      - 2004  
      - 2005  
      - 2006  
    Action: "Add rule"  
  selection_allow:  
    RuleAction: "Allow"  
  selection_process:  
    ProcessName|endswith: "\\WmiPrvSE.exe"  
  condition: selection_event and selection_allow and selection_process  
falsepositives:  
  - Legitimate administrator or automation scripts that configure firewall rules via WMI or PowerShell for enterprise management.  
level: medium  
