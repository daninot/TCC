title: Suspicious Process Access to LSASS Indicative of Credential Dumping
id: 5a3c9d2e-7b4f-4e6a-9c1d-0f2b3a4e5d6f
status: experimental
description: Detects process access requests to LSASS with GrantedAccess masks commonly used by credential dumping tools (Mimikatz-class). Matches access masks indicating memory read, duplication, or full access intent. Excludes known legitimate AV/EDR and system tooling to reduce noise. Requires process access auditing (e.g., Sysmon Event ID 10) that captures TargetImage, GrantedAccess, SourceImage, and CallTrace.
author: Senior Threat Detection Engineer
date: 2026/06/14
references:
  - [https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights](https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights)
  - [https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html](https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html)
  - [https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment](https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment)
tags:
  - attack.credential_access
  - attack.discovery
  - windows
  - lsass
logsource:
  product: windows
  category: process_access
  description: Process access events (e.g., Sysmon Event ID 10) that include SourceImage, TargetImage (or TargetProcessName), GrantedAccess, CallTrace, and ProcessId fields. Ensure process access auditing is enabled.
detection:
  selection_target:
    TargetImage|endswith:
      - '\\lsass.exe'
      - '\\LSASS.EXE'
  selection_access_lowbyte:
    GrantedAccess|endswith:
      - '30'
      - '50'
      - '70'
      - '90'
      - 'B0'
      - 'D0'
      - 'F0'
      - '38'
      - '3A'
      - '18'
      - '10'
      - '40'
      - '01'
  selection_access_high:
    GrantedAccess|startswith:
      - '0x1f0'
      - '0x1f1'
      - '0x1f2'
      - '0x1f3'
      - '0x100000'
      - '0x1010'
      - '0x141'
      - '0x143'
      - '0x1438'
      - '0x143a'
      - '0x401'
      - '0x40'
  condition: all of selection_target selection_access_lowbyte selection_access_high
  # Exclusions to reduce noise
  filter_main_system:
    SourceImage|contains:
      - '\\Windows\\'
      - '\\Program Files\\'
      - '\\Program Files (x86)\\'
  filter_main_defender:
    CallTrace|contains|all:
      - 'Definition Updates'
      - 'mpengine.dll'
  filter_main_defender_proc:
    SourceImage|endswith:
      - '\\MsMpEng.exe'
      - '\\MsMpEng.exe'
  filter_main_mpclient:
    CallTrace|contains:
      - 'MpClient'
      - 'mprtp'
  filter_main_explorer:
    SourceImage|endswith:
      - '\\explorer.exe'
    GrantedAccess|endswith:
      - '401'
  filter_optional_malwarebytes:
    SourceImage|endswith:
      - '\\mbupdatr.exe'
      - '\\MBAMInstallerService.exe'
    GrantedAccess|endswith:
      - '40'
  filter_optional_tools:
    SourceImage|endswith:
      - '\\Code.exe'
      - '\\vmtoolsd.exe'
      - '\\PROCEXP64.EXE'
      - '\\PROCEXP.EXE'
      - '\\handle.exe'
      - '\\handle64.exe'
      - '\\NextronAurora.exe'
      - '\\ThorAgent.exe'
      - '\\WebexHost.exe'
      - '\\steam.exe'
    GrantedAccess|endswith:
      - '40'
  condition: all of selection_target selection_access_lowbyte selection_access_high and not 1 of filter_main_system filter_main_defender filter_main_defender_proc filter_main_mpclient filter_main_explorer and not 1 of filter_optional_malwarebytes filter_optional_tools
falsepositives:
  - Legitimate security products or system components performing LSASS access for protection, scanning, or remediation.
  - Administrative or forensic tools run by authorized operators that require LSASS access.
  - Endpoint agents or management tooling not enumerated in optional filters that legitimately access LSASS.
level: high
