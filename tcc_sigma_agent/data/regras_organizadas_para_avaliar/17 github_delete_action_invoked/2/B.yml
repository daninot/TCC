title: GitHub Destructive Delete Actions
id: 7cf7df0e-c4a3-4886-af34-4bc972e3916b
status: stable
description: Detects delete actions in GitHub audit logs targeting codespaces, environments, projects, and repositories, which can indicate destructive activity or unauthorized resource removal. This rule requires GitHub audit log streaming to be enabled (setup documentation available at [https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise](https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise)).
references:

* [https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions](https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions)
* [https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events#codespaces](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events#codespaces)
author: Senior Threat Detection Engineer
date: 2026/06/03
tags:
* attack.impact
* attack.t1485
logsource:
product: github
service: audit
detection:
selection:
action:
* 'codespaces.delete'
* 'environment.delete'
* 'project.delete'
* 'repo.delete'
condition: selection
falsepositives:


* Legitimate administrative cleanup, decommissioning of projects, or authorized removal of stale codespaces, repositories, and environments by repository owners.
level: medium
