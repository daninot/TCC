title: GitHub Audit Log Deletion Events for Codespaces, Environments, Projects, and Repositories
id: 6a9f2c3d-8b4e-4f1a-9c7d-2e5f0a7b8c9d
status: experimental
description: Detects destructive delete actions in GitHub audit logs targeting codespaces, environments, projects, and repositories. Any such deletion may indicate unauthorized resource removal or malicious activity. Requires GitHub audit log streaming to be enabled. See setup documentation at [https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions](https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions).
author: Senior Threat Detection Engineer
date: 2026/06/02
references:
  - [https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions](https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions)
  - [https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events#codespaces](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events#codespaces)
tags:
  - attack.impact
  - attack.t1485
  - github
  - destructive-activity
logsource:
  product: github
  service: audit
  description: GitHub audit log streaming must be enabled to capture these events. See [https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions](https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions) for setup.
detection:
  selection:
    action|in:
      - 'codespaces.delete'
      - 'environment.delete'
      - 'project.delete'
      - 'repository.delete'
  condition: selection
falsepositives:
  - Legitimate administrative actions removing unused codespaces, environments, projects, or repositories.
level: high
