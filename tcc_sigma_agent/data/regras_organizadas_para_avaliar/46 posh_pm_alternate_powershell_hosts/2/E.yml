title: PowerShell Execution From Alternate Hosts
id: 5642ea35-1d4a-4db5-9e63-23a78912e5ac
status: experimental
description: Detects PowerShell execution from alternate (non-default) hosts where attackers embed the PowerShell runtime inside custom executables to bypass detections focused on powershell.exe. Logged via the HostApplication field in PowerShell classic event logging.
references:
- [https://threathunterplaybook.com/hunts/windows/190815-RemoteServiceInstallation/notebook.html](https://threathunterplaybook.com/hunts/windows/190815-RemoteServiceInstallation/notebook.html)
author: Senior Threat Detection Engineer
date: 2026/06/08
tags:
- attack.execution
- attack.t1059.001
- attack.defense_evasion
logsource:
product: windows
category: ps_classic_start
detection:
selection:
Data|contains: 'HostApplication='
filter_main_standard:
Data|contains:
- '\System32\WindowsPowerShell\v1.0\powershell.exe'
- '/System32/WindowsPowerShell/v1.0/powershell.exe'
- '\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
- '/SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
filter_main_sdiagnhost:
Data|contains:
- '\sdiagnhost.exe'
- '/sdiagnhost.exe'
filter_main_bare:
Data|contains:
- 'HostApplication=powershell.exe'
- 'HostApplication=powershell'
filter_optional_citrix:
Data|contains: 'ConfigSyncRun.exe'
filter_optional_hexnode:
Data|contains: 'Hexnode Agent'
condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Third-party applications that legitimately embed the PowerShell runtime
level: high
