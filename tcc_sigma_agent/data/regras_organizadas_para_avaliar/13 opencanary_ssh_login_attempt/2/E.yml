title: OpenCanary SSH Login Attempt
id: 5a2c2069-7988-4e89-9a2d-1db9df845014
status: experimental
description: Detects an SSH login attempt against an OpenCanary honeypot node. Since the node is a decoy, any login attempt is inherently suspicious.
