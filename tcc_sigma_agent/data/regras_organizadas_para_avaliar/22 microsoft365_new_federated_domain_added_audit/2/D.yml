title: Microsoft 365 Federated Domain Addition
id: 2f3b9c7e-6d21-4f3a-9f1b-3e8a1d4c5b72
status: experimental
description: Detects Microsoft 365 audit log activity consistent with the creation or addition of a new federated domain, which may be abused to establish persistent backdoor access via forged SAML tokens.
references:

* [https://research.splunk.com/cloud/e155876a-6048-11eb-ae93-0242ac130002/](https://research.splunk.com/cloud/e155876a-6048-11eb-ae93-0242ac130002/)
* [https://o365blog.com/post/aadbackdoor/](https://o365blog.com/post/aadbackdoor/)
  author: OpenAI
  date: 2026-06-04
  tags:
* attack.persistence
* attack.defense_evasion
* attack.t1484.002
  logsource:
  product: m365
  service: audit
  detection:
  selection_domain:
  Operation|contains: 'Domain'
  selection_create:
  Operation|contains:

  * 'Add'
  * 'Create'
    condition: all of selection_*
    falsepositives:
* Legitimate federation setup or domain onboarding by authorized administrators
  level: high

