title: Suspicious Federated Domain Addition in Microsoft 365
id: b7c8d9e0-f1a2-4b3c-8d4e-5f6a7b8c9d0e
status: experimental
description: Detects addition of a new federated domain in Microsoft 365, which adversaries may use to establish persistent backdoor access via forged SAML tokens, bypassing MFA and password controls.
references:
    - https://research.splunk.com/cloud/e155876a-6048-11eb-ae93-0242ac130002/
    - https://o365blog.com/post/aadbackdoor/
author: Senior Threat Detection Engineer
date: 2026-06-04
logsource:
    product: m365
    service: audit
detection:
    selection_operation_domain:
        Operation|contains: 'domain'
    selection_operation_add:
        Operation|contains:
            - 'add'
            - 'set'
    condition: selection_operation_domain and selection_operation_add
falsepositives:
    - Legitimate domain federation configuration by administrators
level: high
tags:
    - attack.persistence
    - attack.t1098
    - attack.t1484
    - attack.t1550.001
