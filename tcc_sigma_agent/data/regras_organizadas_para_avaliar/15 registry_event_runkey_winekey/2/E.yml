title: WINEKEY or Team9 Backdoor Run Key Persistence
id: 3c5e8b4e-4f7d-4a1e-8e8d-8a2b5c6d7e8f
status: experimental
description: Detects registry Run key modifications associated with the WINEKEY or Team9 backdoor, where an entry is created under the Run key disguised as a backup manager application to achieve persistence.
references:
- [https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html](https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html)
author: Senior Threat Detection Engineer
date: 2026/06/02
tags:
- attack.persistence
- attack.t1547.001
logsource:
product: windows
category: registry_event
detection:
selection:
TargetObject|endswith: '\Software\Microsoft\Windows\CurrentVersion\Run\Backup Manager'
condition: selection
falsepositives:
- Legitimate installation or configuration of an enterprise backup application named Backup Manager.
level: high
