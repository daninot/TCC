title: Suspicious MeshAgent Execution and Persistence
id: 003e8f1a-2b3c-4d5e-6f7a-8b9c0d1e2f3a
status: test
description: |
    Detects indicators of MeshAgent (also known as ANONVNC) deployment and execution.
    MeshAgent is a legitimate remote management tool that can be abused by threat actors
    to establish persistent backdoors, conduct lateral movement, and exfiltrate data.
    This rule focuses on known file paths, registry modifications, service creations,
    and command-line parameters observed in malicious campaigns.
references:
    - https://www.huntress.com/blog/know-thy-enemy-a-novel-november-case-on-persistent-remote-access
    - https://thecyberexpress.com/ukraine-hit-by-meshagent-malware-campaign/
    - https://wazuh.com/blog/how-to-detect-meshagent-with-wazuh/
    - https://www.security.com/threat-intelligence/medusa-ransomware-attacks
author: "Sigma Rule Generator (based on research by Huntress, CERT-UA, Wazuh, and Symantec)"
date: 2024-08-12
modified: 2025-04-15
tags:
    - attack.persistence
    - attack.t1059.003
    - attack.t1543.003
    - attack.t1569.002
    - attack.t1219
    - attack.defense-evasion
    - attack.t1036.005
    - attack.credential-access
    - attack.t1003.001
logsource:
    product: windows
    category: process_creation
    definition: "Requires Sysmon or Windows Security Event Logs (EventID 4688) with command-line logging enabled."
detection:
    selection_img:
        - Image|endswith:
            - '\MeshAgent.exe'
            - '\nvspbind.exe'
            - '\ARestore.exe'
            - '\ARest1.exe'
        - OriginalFileName: 'MeshAgent.exe'
    selection_cli:
        CommandLine|contains|all:
            - '-fullinstall'
        CommandLine|contains:
            - 'MeshAgent.exe'
            - 'nvspbind'
    selection_reg:
        CommandLine|contains|all:
            - 'reg'
            - 'add'
            - 'HKLM\SYSTEM\CurrentControlSet\Control\LSA'
            - '/v RunAsPPL'
            - '/d 0'
        CommandLine|contains:
            - 'WDigest'
            - 'UseLogonCredential'
    condition: 1 of selection_*
falsepositives:
    - Legitimate administrative use of MeshAgent for remote management.
    - Authorized deployment of remote monitoring and management (RMM) software.
    - Software developers or IT administrators using nvspbind for network configuration.
level: high
