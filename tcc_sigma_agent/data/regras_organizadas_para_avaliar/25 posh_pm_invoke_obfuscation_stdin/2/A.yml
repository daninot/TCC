title: Invoke-Obfuscation STDIN Plus Launcher
id: 3b2f5c4d-6e1a-4f6a-8c9d-1d7f2a5b8c13
status: experimental
description: Detects obfuscated PowerShell execution using cmd.exe to pipe input into PowerShell via stdin, consistent with the Invoke-Obfuscation STDIN+ launcher technique.
references:

* [https://github.com/SigmaHQ/sigma/issues/1009](https://github.com/SigmaHQ/sigma/issues/1009)
  author: OpenAI
  date: 2026-06-04
  tags:
* attack.execution
* attack.t1059.001
  logsource:
  product: windows
  category: ps_module
  detection:
  selection:
  payload|re: '(?i)\bcmd(?:.exe)?\b.*?/[cr]\b.*?\bpowershell(?:.exe)?\b.*?(?:$input\b|\bstdin\b|\bnoexit\b|0<&1|1>&0)'
  condition: selection
  falsepositives:
* Legitimate administrative scripting that launches PowerShell from cmd.exe with stdin handling
* Security tooling or software deployment frameworks that intentionally invoke PowerShell this way
  level: high

