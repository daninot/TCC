title: OpenCanary Honeypot Alert Detected
id: 2f8b6c9e-7a4d-4b2f-9c3e-1d2a3b4c5e6f
status: experimental
description: Detects OpenCanary honeypot alerts or connections (common service triggers such as SSH, FTP, HTTP, SMB, RDP, MySQL, MSSQL, VNC, Telnet). Useful for identifying external hosts interacting with deployed honeypots or accidental exposure of honeypot telemetry.
author: Daniela
date: 2026-05-30
references:
  - https://opencanary.readthedocs.io/en/latest/starting/configuration.html#services-configuration
  - https://github.com/thinkst/opencanary/blob/a0896adfcaf0328cfd5829fe10d2878c7445138e/opencanary/logger.py#L52
logsource:
  product: generic
  service: syslog
  category: network
detection:
  selection_logger_name:
    LoggerName|contains:
      - "opencanary"
      - "OpenCanary"
  selection_process:
    ProcessName|contains:
      - "opencanary"
  selection_message_indicators:
    Message|contains:
      - "connection from"
      - "alert"
      - "triggered"
      - "honeypot"
      - "service:"
      - "ssh"
      - "ftp"
      - "http"
      - "smb"
      - "rdp"
      - "mysql"
      - "mssql"
      - "vnc"
      - "telnet"
  condition: (selection_logger_name or selection_process) and selection_message_indicators
fields:
  - timestamp
  - LoggerName
  - ProcessName
  - Message
  - SourceIp
  - DestinationIp
  - DestinationPort
  - Service
falsepositives:
  - Authorized internal or third-party security scans against intentionally deployed honeypots
  - Automated monitoring or health checks targeting the honeypot services
level: medium
tags:
  - detection.honeypot
  - tool.opencanary
  - network.connection
