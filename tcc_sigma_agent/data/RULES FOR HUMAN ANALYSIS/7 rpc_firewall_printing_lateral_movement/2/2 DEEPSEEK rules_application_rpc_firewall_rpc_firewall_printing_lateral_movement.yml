title: PrintNightmare-Style RPC Call to MS-RPRN/MS-PAR Interfaces
id: b3c4d5e6-f7a8-4b9c-0d1e-2f3a4b5c6d7e
status: experimental
description: Detects remote RPC calls to the MS-RPRN (Print System Remote Protocol) and MS-PAR (Print Asynchronous Remote Protocol) interfaces via the Zero Networks RPC Firewall. This pattern is associated with PrintNightmare (CVE-2021-34527) lateral movement attacks. Requires RPC Firewall agent installed, enabled for AUDIT on the relevant RPC interface UUIDs for all processes.
references:
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527
  - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-rprn/d42db7d5-f141-4466-8f47-0a4be14e2fc1
  - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-pan/e44d984c-07d3-414c-8ffc-f8c8ad8512a8
  - https://github.com/jsecurity101/MSRPC-to-ATTACK/blob/ddd4608fe8684fcf2fcf9b48c5f0b3c28097f8a3/documents/MS-RPRN-PAR.md
  - https://github.com/zeronetworks/rpcfirewall
  - https://zeronetworks.com/blog/stopping-lateral-movement-via-the-rpc-firewall/
author: Senior Threat Detection Engineer
date: 2026-05-26
tags:
  - attack.lateral-movement
  - attack.t1210
logsource:
  product: rpc_firewall
  service: application
detection:
  selection_event:
    EventType: RpcCall
  selection_uuids:
    RpcInterfaceUUID:
      - d42db7d5-f141-4466-8f47-0a4be14e2fc1  # MS-RPRN
      - e44d984c-07d3-414c-8ffc-f8c8ad8512a8  # MS-PAR
  condition: selection_event and selection_uuids
falsepositives:
  - Legitimate printing activities and administrative printer management that invoke the same RPC interfaces
level: high
