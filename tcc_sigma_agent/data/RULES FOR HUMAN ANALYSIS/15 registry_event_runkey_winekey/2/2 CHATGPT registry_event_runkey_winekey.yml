title: WINEKEY Or Team9 Run Key Persistence
id: 3d2d5ec3-7c8d-4a25-b8bc-2a7f61a1e9cf
status: experimental
description: Detects registry Run key modification used by the WINEKEY or Team9 backdoor to persist via a value disguised as a legitimate backup manager application.
references:

* [https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html](https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html)
  author: OpenAI
  date: 2026-06-02
  tags:
* attack.persistence
* attack.privilege_escalation
* attack.t1547.001
  logsource:
  product: windows
  category: registry_event
  detection:
  selection:
  TargetObject|endswith: '\Software\Microsoft\Windows\CurrentVersion\Run\Backup Mgr'
  condition: selection
  falsepositives:
* Unlikely
  level: high

