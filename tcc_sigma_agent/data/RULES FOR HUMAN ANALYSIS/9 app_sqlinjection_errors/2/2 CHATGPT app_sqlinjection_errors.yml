title: SQL Injection Probing via Database Error Messages
id: 2d8d2a4a-6a6f-4c2b-8a1f-9c9ddf4e7f31
status: stable
description: Detects application error log messages commonly returned by multiple database engines during SQL injection probing. This rule requires application logs at LOG_LEVEL ERROR or above so that database syntax and execution errors are captured in raw log content.
references:

* [http://www.sqlinjection.net/errors](http://www.sqlinjection.net/errors)
  author: OpenAI
  date: 2026/05/29
  tags:
* attack.initial-access
* attack.t1190
  logsource:
  product: sql
  category: application
  detection:
  keywords:

  * 'ORA-01756'
  * 'ORA-00933'
  * 'ORA-00936'
  * 'You have an error in your SQL syntax'
  * 'quoted string not properly terminated'
  * 'Unclosed quotation mark after the character string'
  * 'Microsoft OLE DB Provider for SQL Server'
  * 'SQLite.Exception'
  * 'near "SELECT": syntax error'
  * 'mysql_fetch_array()'
  * 'mysql_num_rows()'
    condition: keywords
    falsepositives:
* Legitimate application errors caused by malformed queries or broken input handling.
* Development, testing, or database migration activity.
* Misconfigured applications that emit database syntax errors during normal use.
  level: medium

