title: PowerShell Group Policy Modification
id: 3ef25890-e768-4fb6-b31b-7411bc2df4de
status: stable
description: Detects PowerShell scripts modifying Group Policy settings in the registry (such as SmartScreen settings or Group Policy refresh intervals) to bypass security controls or maintain persistence. This rule requires PowerShell Script Block Logging (Event ID 4104) to be enabled.
references:

* [https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1484.001/T1484.001.md](https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1484.001/T1484.001.md)
author: Senior Threat Detection Engineer
date: 2026/05/26
tags:
* attack.defense_evasion
* attack.privilege_escalation
* attack.t1484.001
logsource:
product: windows
category: ps_script
detection:
selection_path:
ScriptBlockText|contains: '\SOFTWARE\Policies\Microsoft\Windows\System'
selection_values:
ScriptBlockText|contains:
* 'GroupPolicyRefreshTime'
* 'GroupPolicyRefreshTimeOffset'
* 'GroupPolicyRefreshTimeDC'
* 'GroupPolicyRefreshTimeOffsetDC'
* 'EnableSmartScreen'
* 'ShellSmartScreenLevel'
condition: selection_path and selection_values
falsepositives:


* Legitimate administrative scripts or configuration management tools updating Group Policy registry configurations.
level: medium
