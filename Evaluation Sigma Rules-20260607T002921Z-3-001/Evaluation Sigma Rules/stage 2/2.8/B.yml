title: Potential Internet Explorer Trusted Sites Zone Modification
id: 9b2f5e1a-4c3d-4a7e-8c9d-1a2b3c4d5e6f
status: experimental
description: Detects registry modifications that add a domain to Internet Explorer Trusted Sites zone (ZoneMap), potentially lowering security controls for attacker-controlled domains.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone
    - https://learn.microsoft.com/en-us/troubleshoot/developer/browsers/security-privacy/ie-security-zones-registry-entries
author: Senior Threat Detection Engineer
date: 2026-06-02
logsource:
    product: windows
    category: registry_set
detection:
    selection:
        TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains\'
        Details: 'DWORD (0x00000002)'
    exclusion:
        Details|endswith: '0x00000000'  # My Computer zone
        Details|endswith: '0x00000001'  # Local Intranet zone
    condition: selection and not exclusion
falsepositives:
    - Legitimate administrative configuration adding internal sites to Trusted Sites zone (e.g., for compatibility).
    - Software installers that modify Trusted Sites for proper functionality.
level: medium
tags:
    - attack.defense_evasion
    - attack.t1112
    - attack.persistence
    - attack.t1112.001
