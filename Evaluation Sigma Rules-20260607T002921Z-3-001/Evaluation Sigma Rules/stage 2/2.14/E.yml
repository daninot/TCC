title: CVE-2023-1389 TP-Link Archer AX21 Command Injection Attempt
id: 0c2f7c8b-7d8e-4d2f-9b17-8d5f0c6a2f31
status: experimental
description: Detects HTTP requests consistent with exploitation attempts against CVE-2023-1389 in the TP-Link Archer AX21 web management CGI interface. This vulnerability has been abused by Mirai botnet variants for unauthenticated initial access.
references:

* [https://www.tenable.com/security/research/tra-2023-11](https://www.tenable.com/security/research/tra-2023-11)
* [https://github.com/Voyag3r-Security/CVE-2023-1389/blob/4ecada7335b17bf543c0e33b2c9fb6b6215c09ae/archer-rev-shell.py](https://github.com/Voyag3r-Security/CVE-2023-1389/blob/4ecada7335b17bf543c0e33b2c9fb6b6215c09ae/archer-rev-shell.py)
* [https://www.zerodayinitiative.com/blog/2023/4/21/tp-link-wan-side-vulnerability-cve-2023-1389-added-to-the-mirai-botnet-arsenal](https://www.zerodayinitiative.com/blog/2023/4/21/tp-link-wan-side-vulnerability-cve-2023-1389-added-to-the-mirai-botnet-arsenal)
  author: OpenAI
  date: 2026-06-02
  tags:
* attack.initial_access
* attack.t1190
* cve.2023-1389
* threat.emerging
  logsource:
  category: proxy
  detection:
  selection_uri:
  cs-method:

  * GET
  * POST
    cs-uri|contains|all:
  * '/cgi-bin/luci/;stok=/locale'
  * 'form=country'
    selection_payload:
    cs-uri|contains|all:
  * 'operation=write'
  * 'country=$('
    condition: all of selection_*
    falsepositives:
* Administrative access to the router web interface during troubleshooting or testing
* Security validation or vulnerability assessment activity
  level: high
  notes: Requires proxy logging that captures HTTP method and URI/query content.

