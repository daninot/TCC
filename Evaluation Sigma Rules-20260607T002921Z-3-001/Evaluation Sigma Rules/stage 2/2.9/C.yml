title: Application SQL Error Messages Indicative of SQL Injection Probing
id: 3b7f6a2c-4e2d-4a9b-9f1a-5c2d8e7b6a4f
status: experimental
description: Detects application error log entries at ERROR level or above that contain characteristic database error messages commonly triggered by SQL injection probing against Oracle, MySQL, Microsoft SQL Server, and SQLite backends.
author: Senior Threat Detection Engineer
date: 2026/06/02
references:
  - [https://www.sqlinjection.net/errors](https://www.sqlinjection.net/errors)
tags:
  - attack.reconnaissance
  - attack.initial_access
  - attack.t1190
  - detection
logsource:
  product: sql
  category: application
detection:
  selection_loglevel:
    LogLevel|in:
      - 'ERROR'
      - 'ERR'
      - 'FATAL'
      - 'CRITICAL'
  selection_keywords:
    Message|contains:
      - 'ORA-01756'
      - 'You have an error in your SQL syntax'
      - 'Unclosed quotation mark after the string'
      - 'SQL error or missing database'
  condition: selection_loglevel and selection_keywords
  timeframe: 1m
falsepositives:
  - Application developers or automated test suites intentionally submitting malformed queries.
  - Third-party scanners or monitoring tools performing health checks that trigger database errors.
level: high
