title: Suspicious Group Policy Modification (T1484.001)
id: 2b7d9f4a-4d1e-11ef-9a2d-0242ac120002
status: experimental
description: Detects potential malicious modification of Group Policy Objects (GPOs) in Active Directory, which may indicate Domain Policy Modification (MITRE ATT&CK T1484.001).
author: Copilot
date: 2026/05/25
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1484.001/T1484.001.md
logsource:
  product: windows
  service: security
  category: directory-service
detection:
  selection_gpo_modification:
    EventID:
      - 5136   # Directory Service object modified
      - 5137   # Directory Service object created
      - 5141   # Directory Service object deleted
    ObjectClass: "groupPolicyContainer"
  condition: selection_gpo_modification
fields:
  - timestamp
  - EventID
  - SubjectUserName
  - SubjectDomainName
  - ObjectDN
  - ObjectClass
falsepositives:
  - Legitimate administrative changes to GPOs by domain admins
level: high
tags:
  - attack.persistence
  - attack.t1484.001
