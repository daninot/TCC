title: Potential DNS Query to Katz Stealer C2 Domains
id: 135ab954-7f2a-4c9e-8a1c-4d5e6f7g8h9i
status: experimental
description: Detects DNS queries to domains associated with Katz Stealer, an information-stealing malware used for exfiltration of credentials, browser data, and crypto wallets.
references:
    - Internal research
author: Senior Threat Detection Engineer
date: 2026-06-02
logsource:
    category: dns
detection:
    selection:
        dns.question.name|contains:
            # Example Katz Stealer domains - replace with actual IOCs
            - 'katz-stealer.com'
            - 'katzpanel.net'
            - 'katzz.xyz'
            - 'stealerc2.org'
    condition: selection
falsepositives:
    - Unlikely in enterprise environments; domain squatting or typo-squatting may cause rare FPs
level: high
tags:
    - attack.command_and_control
    - attack.t1071.004
    - attack.emerging_threats
