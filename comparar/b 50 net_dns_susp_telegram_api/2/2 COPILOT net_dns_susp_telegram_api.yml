title: DNS Query for Telegram Bot API Hostname
id: 2f4b6a8c-1d3e-4f7b-9a0c-5e6d7f8a9b0c
status: experimental
description: Detects DNS queries that exactly match the Telegram Bot API hostname. Malware families have abused Telegram bots as covert C2 channels; DNS lookups for the Bot API hostname can indicate beaconing or C2 activity when observed from endpoints or servers that do not normally use Telegram.
author: Senior Threat Detection Engineer
date: 2026/06/16
references:
  - [https://core.telegram.org/bots/faq](https://core.telegram.org/bots/faq)
  - [https://researchcenter.paloaltonetworks.com/2018/03/unit42-telerat-another-android-trojan-leveraging-telegrams-bot-api-to-target-iranian-users/](https://researchcenter.paloaltonetworks.com/2018/03/unit42-telerat-another-android-trojan-leveraging-telegrams-bot-api-to-target-iranian-users/)
  - [https://blog.malwarebytes.com/threat-analysis/2016/11/telecrypt-the-ransomware-abusing-telegram-api-defeated/](https://blog.malwarebytes.com/threat-analysis/2016/11/telecrypt-the-ransomware-abusing-telegram-api-defeated/)
  - [https://www.welivesecurity.com/2016/12/13/rise-telebots-analyzing-disruptive-killdisk-attacks/](https://www.welivesecurity.com/2016/12/13/rise-telebots-analyzing-disruptive-killdisk-attacks/)
tags:
  - network
  - dns
  - command_and_control
  - telemetry
logsource:
  product: dns
  category: dns
  description: DNS query logs containing the queried hostname (Query), query type, source IP, and destination/resolver IP.
detection:
  selection_query:
    Query:
      - 'api.telegram.org'
  condition: selection_query
fields:
  - Query
  - QueryType
  - SrcIp
  - DstIp
  - Timestamp
falsepositives:
  - Legitimate use of Telegram Bot API by applications, integrations, or administrators.
  - Development or testing environments that interact with Telegram bots.
level: high
