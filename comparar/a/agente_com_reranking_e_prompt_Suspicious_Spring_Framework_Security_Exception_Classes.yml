title: Suspicious Spring Framework Security Exception Classes
id: ed87ff5c-0d68-4a1e-948f-5a6889df3a40
status: test
description: Detects suspicious Spring framework security exception classes in application logs indicating exploitation attempts.
references:
    - https://docs.spring.io/spring-security/site/docs/current/api/overview-tree.html
author: 'Your Name'
date: 2023-03-01
modified: 2023-03-01
tags:
    - attack.initial-access
    - detection.emerging-threats
logsource:
    category: application
    product: spring
detection:
    keywords:
        - 'org.springframework.security.authentication.BadCredentialsException'
        - 'org.springframework.security.access.AccessDeniedException'
        - 'org.springframework.security.web.csrf.CsrfException'
        - 'org.springframework.security.web.util.matcher.AntPathRequestMatcher$PatternMatchException'
    condition: keywords
falsepositives:
    - Unknown, please report false positives via https://github.com/SigmaHQ/sigma/issues
level: high